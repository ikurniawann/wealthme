<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon — Light that listens</title>
<style>
  :root { --bg: #0d0f14; --fg: #f2efe8; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.5 Georgia, 'Times New Roman', serif; }
  .hero { min-height: 100vh; display: grid; align-content: center; padding: 0 6vw; }
  .hero h1 { font-size: clamp(52px, 12vw, 168px); line-height: .95; letter-spacing: -.03em; font-weight: 400; }
  .hero h1 .w { display: inline-block; overflow: hidden; vertical-align: top; }
  .hero h1 .w > span { display: inline-block; }
  .hero p { max-width: 34ch; margin-top: 28px; opacity: .8; }
  .gallery { height: 100vh; position: relative; overflow: hidden; }
  .gallery h2 { position: absolute; top: 7vh; left: 6vw; font: 600 13px/1 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; }
  .track { position: absolute; top: 18vh; left: 0; display: flex; align-items: center; gap: 28px; padding: 0 30vw; }
  .card { flex: none; width: 200px; height: 60vh; border-radius: 22px; padding: 22px; overflow: hidden;
          box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .card b { display: block; font: 600 13px/1 system-ui, sans-serif; letter-spacing: .12em; margin-bottom: 14px; }
  .card h3 { font-size: 26px; font-weight: 400; line-height: 1.1; margin-bottom: 12px; }
  .card p { font-size: 14px; line-height: 1.45; opacity: .85; }
  .dust { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .35; pointer-events: none; }
  .outro { min-height: 100vh; display: grid; place-content: center; padding: 0 6vw; text-align: center; }
  .outro h2 { font-size: clamp(32px, 6vw, 72px); font-weight: 400; }
</style>
</head>
<body>
<header class="hero">
  <h1><span class="w"><span>Light</span></span> <span class="w"><span>that</span></span> <span class="w"><span>listens.</span></span></h1>
  <p>Halcyon lamps read the room and tune colour, warmth and brightness to whoever is in it.</p>
</header>

<section class="gallery">
  <h2>The collection</h2>
</section>

<section class="outro">
  <h2>Pre-orders open in March.</h2>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  // Signature moment: the headline rises word by word, then the line underneath settles in.
  gsap.timeline({ defaults: { ease: 'expo.out' } })
    .from('.hero h1 .w > span', { yPercent: 110, duration: 1.2, stagger: 0.09 })
    .from('.hero p', { y: 24, opacity: 0, duration: 0.9 }, '-=0.7');

  // Pinned gallery: cards slide past and open up as they cross the centre of the screen,
  // their copy reflowing into the wider card, while a field of dust drifts behind them at different depths.
  const gallery = document.querySelector('.gallery');
  const track = document.createElement('div');
  track.className = 'track';
  gallery.appendChild(track);
  const NAMES = ['Ember', 'Tide', 'Moss', 'Dune', 'Frost', 'Bloom', 'Ash', 'Fern'];
  const cards = [];
  for (let i = 0; i < 24; i++) {
    const card = document.createElement('article');
    card.className = 'card';
    card.style.background = `linear-gradient(160deg, hsl(${i * 15} 80% 62%), hsl(${i * 15 + 40} 70% 28%))`;
    card.innerHTML = `<b>No. ${String(i + 1).padStart(2, '0')}</b><h3>${NAMES[i % 8]} ${['Table', 'Floor', 'Pendant'][i % 3]}</h3>
      <p>Hand-spun aluminium shade, linen flex, and a dimmer that learns your evenings. Warm at dusk, cool at noon,
      off when the room empties. Each one is turned, brushed and anodised in a two-person workshop.</p>`;
    track.appendChild(card);
    cards.push(card);
  }

  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const dust = [];
  for (let i = 0; i < 200; i++) {
    const d = document.createElement('i');
    d.className = 'dust';
    d.style.left = (rand() * 100).toFixed(2) + '%';
    d.dataset.y = (rand() * 300).toFixed(2);
    d.dataset.depth = (0.2 + rand() * 0.8).toFixed(2);
    gallery.insertBefore(d, track);
    dust.push(d);
  }

  const cardStep = 228; // card width + gap
  function layoutGallery(progress) {
    const shift = progress * (cards.length - 1) * cardStep;
    track.style.transform = `translateX(${-shift}px)`;
    cards.forEach((card, i) => {
      const d = Math.min(1, Math.abs(i * cardStep - shift) / innerWidth);
      card.style.width = `${200 + (1 - d) * 150}px`;
      card.style.opacity = 1 - d * 0.6;
    });
    dust.forEach((d) => {
      const h = gallery.offsetHeight;
      d.style.top = (d.dataset.y / 100) * h - progress * 1600 * d.dataset.depth + 'px';
    });
  }
  layoutGallery(0);

  ScrollTrigger.create({
    trigger: gallery,
    start: 'top top',
    end: '+=4000',
    pin: true,
    scrub: true,
    onUpdate: (self) => layoutGallery(self.progress),
  });
</script>
</body>
</html>
