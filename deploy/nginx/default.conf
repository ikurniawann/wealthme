# WealthMe — dev-server reverse proxy (see docs/DEPLOYMENT.md)
#
# Sits between the Cloudflare Tunnel and this repo's own web/api containers.
# It exists so wealthme.demo-wit.id can route by PATH (/api/* → api:4000,
# everything else → web:3000) without needing a Cloudflare-side path rule —
# the tunnel is token-based and its ingress is dashboard-managed, so a path
# rule there would need Cloudflare Zero Trust dashboard access this repo's
# automation does not have. `tunnel-container` is already on this compose
# stack's own docker network (confirmed via `docker network inspect`), so the
# ONE change needed on Cloudflare's side is repointing the existing
# wealthme.demo-wit.id Public Hostname's target service to http://nginx:80 —
# everything past that point is this file, fully in-repo.
#
# The trailing slash on `proxy_pass http://api:4000/;` is what strips the
# `/api` prefix before forwarding — `/api/health` reaches the api container
# as `/health`, matching its existing unprefixed routes exactly. No NestJS
# code change (no app.setGlobalPrefix) is needed for this to work.

server {
  listen 80;
  server_name wealthme.demo-wit.id;

  # Default request-body ceiling for EVERY location, including all the
  # @Public() NestJS routes reached through `location /api/`. Written out
  # rather than left implicit: 1m IS nginx's default, so this changes
  # nothing — it exists so the three per-route overrides below read as
  # deliberate exceptions instead of the only numbers in the file.
  client_max_body_size 1m;

  # Better Auth — served BY the web container itself at apps/web/src/app/api/auth/[...all]/route.ts,
  # i.e. Next.js' own /api/auth/* route, not the NestJS api. Without this block
  # the /api/ location below (path-stripped to the api container) swallows it
  # first, since both are prefix matches on /api/ — nginx picks the longest
  # (most specific) prefix match regardless of declaration order, so this one
  # wins over /api/ for anything under /api/auth/. Forwarded AS-IS (no trailing
  # slash on proxy_pass — Next.js' route expects the /api/auth prefix intact).
  location /api/auth/ {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # NestJS ALSO owns its own, separate /auth/* namespace — apps/api/src/auth/
  # auth.controller.ts (register, login, logout, refresh, me, profile,
  # change-password, google, google/callback) and password-policy.controller.ts
  # (password-status, set-password). Both @Controller("auth"). Reached publicly
  # as /api/auth/<name> via the /api/ prefix-strip below, that's the SAME URL
  # space as Better Auth's /api/auth/* on web — a genuine namespace collision
  # between two independent auth systems, not a typo. Without this block the
  # /api/auth/ location above (a longer, more specific prefix) wins and sends
  # every one of these to Next.js/Better Auth instead, which doesn't recognize
  # them — broke apps/web/src/lib/auth-compat.ts's /auth/me call silently
  # (dashboard stuck loading forever, no visible error) after the /api/auth/
  # fix above shipped. nginx gives regex locations priority over plain-prefix
  # ones regardless of length, so this wins over /api/auth/ for exactly these
  # names while everything else under /api/auth/* still reaches Better Auth.
  # If either controller's route names change, this list must be updated too.
  #
  # EPIC-024 B1 — `devices(?:/.*)?` added: apps/api/src/devices/
  # devices.controller.ts is @Controller("auth/devices") (register, list,
  # set PIN, revoke, unlock — POST /auth/devices, GET /auth/devices,
  # POST /auth/devices/:id/pin, DELETE /auth/devices/:id,
  # POST /auth/devices/:id/unlock), but this allowlist regex predated that
  # controller and never named it, so every POST /api/auth/devices* fell
  # through to Better Auth's catch-all on the web container and 404'd —
  # quick-unlock PIN registration/setup/unlock was dead in every deployed
  # environment (local dev has no nginx in front of it).
  location ~ ^/api/auth/(register|login|logout|refresh|me|profile|change-password|google|google/callback|password-status|set-password|devices(?:/.*)?)$ {
    proxy_pass http://api:4000/auth/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # EPIC-024 B1 — `/api/device-unlock` is a Next.js BFF route handler
  # (apps/web/src/app/api/device-unlock/route.ts), NOT a NestJS endpoint. It
  # exists specifically because it can set the httpOnly better-auth session
  # cookie server-side (a client fetch cannot); it then calls NestJS's
  # POST /auth/devices/:id/unlock itself. Without this dedicated location the
  # generic `location /api/` prefix-strip below sends it to api:4000/device-
  # unlock, which NestJS does not serve → 404, and the pre-login PIN pad
  # silently mis-reports every routing failure as "PIN salah" (wrong PIN).
  # No trailing slash on proxy_pass — must reach web:3000 as literally
  # /api/device-unlock, matching the Route Handler's own path.
  location = /api/device-unlock {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Upload routes: the only three that may exceed the 1m server default ──
  #
  # Security review (HIGH) — the first version of this fix put 21m on the
  # whole `/api/` prefix, which also covers every @Public() NestJS route
  # (/api/calculators/*, /api/fx/rates, the split-bill participant token
  # routes, /api/auth/devices/:id/unlock). Those carry no auth and only the
  # global 100/min throttle, and nginx spools a body past its small memory
  # buffer to a temp FILE before proxying — so a broad 21m hands an
  # anonymous caller ~20x the disk and bandwidth cost per request. Express'
  # own limit cannot help: it only rejects after nginx has already staged
  # the whole body. So each route below gets exactly the ceiling its own
  # server-side limit needs, and everything else stays at 1m.
  #
  # These are REGEX locations, which nginx evaluates before any plain-prefix
  # location regardless of length — that is what makes them win over
  # `location /api/` below. They are anchored end-to-end and match only the
  # three real routes, so they cannot shadow anything else (this file's
  # history records /api/auth/ precedence being got wrong twice; every path
  # in every block here is asserted against a running nginx by
  # scripts/nginx-routing-check.sh).
  #
  # The `/?$` allows the trailing-slash variant of each route, matching
  # Express' default non-strict routing (and SCAN_ROUTE_PATTERN in
  # common/http/body-limits.ts, which allows it too). Without it a request
  # to `…/scan/` fell back to the 1m default and was refused at a size the
  # route is supposed to accept — fail-safe, but still a real route being
  # rejected (security review, LOW).
  #
  # `proxy_pass` may not carry a URI part in a regex location, so the
  # trailing-slash trick `location /api/` uses to strip the prefix is
  # unavailable — `rewrite … break` reproduces it exactly: the upstream sees
  # /family-groups/... just as it does through the prefix block.

  # POST /api/family-groups/:id/transactions/scan — JSON, bounded at
  # ~2.02 MiB by MAX_SCAN_JSON_BODY_BYTES (common/http/body-limits.ts).
  # 3m leaves room for that plus request framing.
  location ~ ^/api/family-groups/[^/]+/transactions/scan/?$ {
    client_max_body_size 3m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # POST /api/family-groups/:id/transactions/:txId/attachments — multipart,
  # bounded at MAX_ATTACHMENT_FILE_BYTES = 5 MiB (attachments.controller.ts).
  # 6m = that plus ~1 MiB for multipart boundary and part-header framing,
  # which nginx counts toward the body size but multer's fileSize does not.
  location ~ ^/api/family-groups/[^/]+/transactions/[^/]+/attachments/?$ {
    client_max_body_size 6m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # POST /api/family-groups/:id/reconciliation/upload-file — multipart,
  # bounded at MAX_STATEMENT_FILE_BYTES = 20 MiB
  # (reconciliation.controller.ts). At the inherited 1m nginx 413'd every
  # statement over 1 MB before it ever reached multer, so that documented
  # 20 MB limit had never actually worked in a deployed environment. 21m =
  # 20 MiB plus ~1 MiB of multipart framing.
  location ~ ^/api/family-groups/[^/]+/reconciliation/upload-file/?$ {
    client_max_body_size 21m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # NestJS API — path-stripped. Inherits the 1m server default: every route
  # here that needs more has its own, narrower block ABOVE.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js web app — everything else.
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js doesn't need WebSocket upgrade in this stack (no HMR in the
    # production standalone server), but Upgrade/Connection are forwarded
    # defensively — cheap, and correct if that ever changes.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
