# WealthMe — dev-server reverse proxy (see docs/DEPLOYMENT.md)
#
# Sits between the Cloudflare Tunnel and this repo's own web/api containers.
# It exists so wealthme.demo-wit.id can route by PATH (/api/* → api:4000,
# everything else → web:3000) without needing a Cloudflare-side path rule —
# the tunnel is token-based and its ingress is dashboard-managed, so a path
# rule there would need Cloudflare Zero Trust dashboard access this repo's
# automation does not have. `tunnel-container` is already on this compose
# stack's own docker network (confirmed via `docker network inspect`), so the
# ONE change needed on Cloudflare's side is repointing the existing
# wealthme.demo-wit.id Public Hostname's target service to http://nginx:80 —
# everything past that point is this file, fully in-repo.
#
# The trailing slash on `proxy_pass http://api:4000/;` is what strips the
# `/api` prefix before forwarding — `/api/health` reaches the api container
# as `/health`, matching its existing unprefixed routes exactly. No NestJS
# code change (no app.setGlobalPrefix) is needed for this to work.

server {
  listen 80;
  server_name wealthme.demo-wit.id;

  # Better Auth — served BY the web container itself at apps/web/src/app/api/auth/[...all]/route.ts,
  # i.e. Next.js' own /api/auth/* route, not the NestJS api. Without this block
  # the /api/ location below (path-stripped to the api container) swallows it
  # first, since both are prefix matches on /api/ — nginx picks the longest
  # (most specific) prefix match regardless of declaration order, so this one
  # wins over /api/ for anything under /api/auth/. Forwarded AS-IS (no trailing
  # slash on proxy_pass — Next.js' route expects the /api/auth prefix intact).
  location /api/auth/ {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # NestJS ALSO owns its own, separate /auth/* namespace — apps/api/src/auth/
  # auth.controller.ts (register, login, logout, refresh, me, profile,
  # change-password, google, google/callback) and password-policy.controller.ts
  # (password-status, set-password). Both @Controller("auth"). Reached publicly
  # as /api/auth/<name> via the /api/ prefix-strip below, that's the SAME URL
  # space as Better Auth's /api/auth/* on web — a genuine namespace collision
  # between two independent auth systems, not a typo. Without this block the
  # /api/auth/ location above (a longer, more specific prefix) wins and sends
  # every one of these to Next.js/Better Auth instead, which doesn't recognize
  # them — broke apps/web/src/lib/auth-compat.ts's /auth/me call silently
  # (dashboard stuck loading forever, no visible error) after the /api/auth/
  # fix above shipped. nginx gives regex locations priority over plain-prefix
  # ones regardless of length, so this wins over /api/auth/ for exactly these
  # names while everything else under /api/auth/* still reaches Better Auth.
  # If either controller's route names change, this list must be updated too.
  location ~ ^/api/auth/(register|login|logout|refresh|me|profile|change-password|google|google/callback|password-status|set-password)$ {
    proxy_pass http://api:4000/auth/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # NestJS API — path-stripped.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js web app — everything else.
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js doesn't need WebSocket upgrade in this stack (no HMR in the
    # production standalone server), but Upgrade/Connection are forwarded
    # defensively — cheap, and correct if that ever changes.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
