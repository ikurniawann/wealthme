# =============================================================================
# WealthMe — Dev-server Compose override
# =============================================================================
# Use with the root docker-compose.yml from the repo root:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.yml up -d --build
#
# This overlay adds server-specific settings that differ from the local
# developer workstation (e.g. published API/web ports, production NODE_ENV).
# The root .env (copied to the server as .env) is still the single secret store.
#
# Ports for postgres/redis/minio/mailhog are intentionally NOT published here —
# infra services should only be reachable inside the Docker network on the server.
# If you need SSH port-forwarding for debug access, do so at the OS level.
# =============================================================================

services:
  api:
    environment:
      NODE_ENV: production

  web:
    environment:
      NODE_ENV: production
