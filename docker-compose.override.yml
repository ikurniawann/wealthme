# =============================================================================
# WealthMe — Local-only Docker Compose override
# =============================================================================
# Applied automatically when running `docker compose` from the repo root.
# NOT applied on the dev server (which uses -f docker-compose.yml explicitly,
# or stores this file separately as a server override).
#
# Adds host-port bindings for local development tools (DB clients, Redis GUI,
# MinIO console, Mailhog UI). These ports are intentionally absent from the
# base docker-compose.yml so infrastructure ports are not exposed on the server.
# =============================================================================

services:
  # Force browser-facing origins to localhost for local dev, regardless of what
  # the root .env holds. The browser talks to the host (localhost:3000 / :4000),
  # so Better Auth's origin check (web) and CORS (api) must see localhost — NOT
  # the internal `web`/`api` service names. On the real dev server these come
  # from .env (the server's public origin) via the base compose, not this file.
  web:
    # NEXT_PUBLIC_* vars are inlined into the client JS bundle at BUILD time
    # (see apps/web/Dockerfile), so overriding them under `environment:` (a
    # runtime-only setting) has no effect on already-built pages. Without this,
    # `docker compose build` picks up NEXT_PUBLIC_API_URL/NEXT_PUBLIC_APP_URL
    # from the root .env (the dev server's public domains) and bakes them into
    # the local bundle — the browser then calls the remote API/app origin
    # instead of localhost, breaking every fetch (dashboard, auth, etc.).
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    environment:
      BETTER_AUTH_URL: http://localhost:3000
  api:
    environment:
      WEB_ORIGIN: http://localhost:3000

  postgres:
    ports:
      # Expose postgres to localhost so GUI tools (e.g. TablePlus, psql) work.
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      # Expose redis to localhost for direct inspection.
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports:
      # MinIO S3-compatible API.
      - "${MINIO_API_PORT:-9000}:9000"
      # MinIO web console.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  mailhog:
    ports:
      # SMTP (outbound mail capture).
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      # Mailhog web UI.
      - "${MAILHOG_UI_PORT:-8025}:8025"
