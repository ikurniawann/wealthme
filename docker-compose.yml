# =============================================================================
# WealthMe — Canonical Docker Compose Stack
# =============================================================================
# This file is the SINGLE source of truth for both local-demo and the dev
# server. Keep all host-port bindings in docker-compose.override.yml so this
# base file is portable to any environment.
#
# Usage (local, with override, building from source):
#   docker compose up -d --build
#
# Usage (dev server, prebuilt images from GHCR — the default deploy path,
# see scripts/deploy-dev.sh and docs/DEPLOYMENT.md):
#   docker compose -f docker-compose.yml pull
#   docker compose -f docker-compose.yml up -d --wait
#
# `api`, `migrate`, and `web` each carry BOTH `image:` and `build:`. Compose
# uses whichever is already present locally when you run plain `up`/`pull`;
# `--build` (or `docker compose build`) forces a local build under the SAME
# image name instead. This is what lets one file serve two operators: CI
# builds and pushes to ghcr.io/andrsrjld/wealthme-web-{api,web} on every push
# to `development` (see .github/workflows/ci.yml), and the dev server just
# pulls that image — no local `pnpm install`/`next build`/`apt-get` ever runs
# there. `DEPLOY_IMAGE_TAG` (default `dev`, a moving tag CI updates on every
# green build) pins which tag to pull; set it to a `sha-<short>` tag to roll
# back to a specific commit without touching this file.
#
# All services read shared secrets from the root .env via `env_file`.
# Host-vs-container URLs are overridden per-service under `environment:` so
# that pnpm dev (localhost) and compose (service names) both work from one .env.
# =============================================================================

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: [.env]
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from env_file.
    # entrypoint wraps docker-entrypoint.sh to re-sync the password on every
    # startup — prevents P1000 when POSTGRES_PASSWORD changes without -v reset.
    entrypoint: ["/docker-custom-entrypoint.sh"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/docker-custom-entrypoint.sh:ro,z
    networks:
      - wealthme_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wealthme} -d ${POSTGRES_DB:-wealthme_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - wealthme_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: [.env]
    # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD come from env_file.
    volumes:
      - minio_data:/data
    networks:
      - wealthme_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    networks:
      - wealthme_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8025 > /dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── One-shot migration + seed ───────────────────────────────────────────────
  # Runs prisma migrate deploy + prisma db seed, then exits.
  # api waits for this service to complete successfully before starting.
  # The seed uses upsert, so re-running `docker compose up` is safe (idempotent).

  migrate:
    image: ghcr.io/andrsrjld/wealthme-web-api:${DEPLOY_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: "no"
    env_file: [.env]
    environment:
      # Override localhost URL from .env to use the postgres service name.
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-wealthme}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wealthme_dev}
    # pnpm hoists shared binaries to .pnpm/node_modules/.bin/ (not .bin/ directly).
    # NODE_PATH lets node resolve @prisma/client and other shared packages from
    # the pnpm virtual store without per-package node_modules symlinks.
    # prisma schema lives at /app/apps/api/prisma/schema.prisma.
    command: >
      sh -c "
        export NODE_PATH=/app/node_modules/.pnpm/node_modules &&
        cd /app &&
        node_modules/.pnpm/node_modules/.bin/tsx apps/api/prisma/fix-drift-migration.ts &&
        node_modules/.pnpm/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
        node_modules/.pnpm/node_modules/.bin/tsx apps/api/prisma/seed.ts
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wealthme_net

  # ── Application services ────────────────────────────────────────────────────

  api:
    image: ghcr.io/andrsrjld/wealthme-web-api:${DEPLOY_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    container_name: wealthme-api
    env_file: [.env]
    environment:
      # Override localhost URLs from .env to use docker service names.
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-wealthme}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wealthme_dev}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      # MinIO credentials come from env_file; only endpoint needs overriding.
      MAIL_HOST: mailhog
      # WEB_ORIGIN is the BROWSER origin for CORS (the browser calls the API
      # directly via NEXT_PUBLIC_API_URL) — it must be the public origin, NOT the
      # internal `web` service name. From .env on the server; localhost locally
      # (forced in docker-compose.override.yml).
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Google callback must use the host-accessible API URL (browser redirect).
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - wealthme_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/andrsrjld/wealthme-web-web:${DEPLOY_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    container_name: wealthme-web
    env_file: [.env]
    environment:
      # PORT in root .env is the NestJS API port (4000); override here so
      # the Next.js standalone server listens on 3000 inside the container.
      PORT: "3000"
      # Better Auth runs server-side on web and talks to Postgres via Prisma
      # (apps/web/src/lib/auth.ts → new PrismaClient()), so the web container
      # needs DATABASE_URL pointed at the `postgres` service — NOT the localhost
      # value from .env (that resolves to the web container itself). Without this
      # override, email/social login fails with a DB connection error.
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-wealthme}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wealthme_dev}
      # Server-side API URL (used by Next.js SSR + Better Auth callbacks).
      # Browser-facing NEXT_PUBLIC_API_URL stays as localhost (from env_file).
      API_URL: http://api:4000
      # Better Auth canonical URL — must match the browser-visible origin.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wealthme_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  wealthme_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
