<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit One — Sound you can see</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #000; color: #f5f5f7; font: 17px/1.5 system-ui, sans-serif; }
  .intro { min-height: 70vh; display: grid; align-content: end; padding: 0 6vw 8vh; }
  .intro h1 { font-size: clamp(44px, 10vw, 128px); line-height: 1; letter-spacing: -.04em; }
  .seq { height: 100vh; position: relative; }
  .seq canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seq .copy { position: absolute; left: 6vw; bottom: 10vh; max-width: 30ch; font-size: clamp(20px, 3vw, 32px); font-weight: 600; }
  .outro { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 0 6vw; }
</style>
</head>
<body>
<header class="intro"><h1>Orbit One.</h1></header>

<section class="seq">
  <canvas id="seq"></canvas>
  <p class="copy">Forty drivers. One ring. Turn it, and the room turns with it.</p>
</section>

<section class="outro"><h2>From £499. Ships in May.</h2></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script>
  // Signature moment: the product spins and opens up as you scroll (150 rendered frames, 1920x1080).
  gsap.registerPlugin(ScrollTrigger);
  const FRAMES = 150;
  const canvas = document.getElementById('seq');
  const ctx = canvas.getContext('2d');
  const images = [];
  for (let i = 1; i <= FRAMES; i++) {
    const img = new Image();
    img.src = `frames/${String(i).padStart(4, '0')}.jpg`;
    images.push(img);
  }

  function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    render();
  }

  const state = { frame: 0 };
  function render() {
    const img = images[Math.round(state.frame)];
    if (!img.complete || !img.naturalWidth) return;
    const scale = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
    const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
    ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
  }

  images[0].onload = render;
  addEventListener('resize', resize);
  resize();

  gsap.to(state, {
    frame: FRAMES - 1,
    ease: 'none',
    onUpdate: render,
    scrollTrigger: { trigger: '.seq', start: 'top top', end: '+=5000', pin: true, scrub: true },
  });
</script>
</body>
</html>
