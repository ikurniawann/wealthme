<title>Beranda · WealthMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
/* ---------- beranda page-only rules (bento layout on top of wm.css tokens) ---------- */
.greet{margin-top:2px}
.greet b{display:block;font-size:22px;letter-spacing:-.03em;font-weight:600}
.greet small{color:var(--muted);font-size:13px}

/* setup checklist */
.setup-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.setup-top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.setup-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:14px}
.setup-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-height:34px}
.setup-step.done{color:var(--ink)}
.setup-step i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;color:var(--good)}
.setup-step.done i{border-color:var(--good);background:var(--lime-soft)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 190px;gap:0;padding:0;overflow:hidden}
.hero .side-a{padding:22px 22px 14px;min-width:0}
.hero .side-b{border-left:1px solid var(--cover-line);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero .cap{margin-top:4px}
.hero-win{display:flex;gap:6px}
.hero-win button{border:0;background:var(--cover-2);color:var(--on-cover-2);border-radius:9px;padding:0 10px;min-height:32px;font-size:12px}
.hero-win button[aria-pressed="true"]{background:var(--on-cover);color:var(--cover);font-weight:600}
.hero-chart{height:200px;margin-top:12px}
.hero-kpi small{display:block;color:var(--on-cover-2);font-size:12px}
.hero-kpi b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px}

/* wallet */
.wallet-cards{display:flex;gap:12px;margin:14px -20px 0;padding:0 20px 2px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.wallet-cards::-webkit-scrollbar{display:none}
.pcard{flex:none;width:82%;max-width:270px;aspect-ratio:1.586;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative}
.pcard.lime{background:var(--lime);color:var(--lime-ink);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 2px,transparent 2px 9px)}
.pcard.soft{background:linear-gradient(135deg,var(--card-2),var(--ghost));color:var(--ink)}
.pcard.dark{background:var(--ink);color:var(--card)}
.pcard .t{display:flex;justify-content:space-between;align-items:flex-start;font-size:11.5px}
.pcard .t b{font-size:14.5px;font-style:italic;font-weight:700;letter-spacing:.02em}
.pcard .no{font-size:12.5px;letter-spacing:.08em;margin-top:auto}
.pcard .bt{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:11.5px;white-space:nowrap}
.pcard .bt span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.wallet-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.wallet-act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink);background:none;border:0;padding:2px 0;min-height:60px}
.wallet-act span{width:100%;max-width:44px;aspect-ratio:1;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.wallet-act:hover span{background:var(--card-2)}
.fam-head{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.fam-head h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.wallet-fam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.wallet-fam div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);min-width:0}
.wallet-fam .avatar{width:100%;max-width:40px;aspect-ratio:1;height:auto}

/* wealth snapshot */
.snap-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.snap-row:first-child{border-top:0}
.snap-row .ic{width:36px;height:36px;border-radius:11px}
.snap-body{min-width:0;flex:1}
.snap-label{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-val{display:block;font-size:15px;font-weight:600;margin-top:1px}

/* allocation */
.alloc-body{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.alloc-donut{width:150px;height:150px;flex:none}
.alloc-list{flex:1;min-width:160px;display:flex;flex-direction:column;gap:10px}
.alloc-row .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.alloc-row .top b{font-weight:600}
.alloc-row .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:2px}
.alloc-row .track{margin-top:5px;height:6px}

/* stat tiles */
.stat-tile{display:flex;flex-direction:column;gap:10px}
.stat-tile .ic{width:38px;height:38px;border-radius:11px}
.stat-tile .link{align-self:flex-start;font-size:12.5px}

/* budget + attention side stack */
.side-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.budget-row+.budget-row{margin-top:14px}
.budget-row .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.budget-row .top small{color:var(--muted);font-size:12px}
.budget-row .track{margin-top:6px}
.budget-row .over{color:var(--bad);font-size:11.5px;margin-top:4px}
.note.click{border:0;width:100%;text-align:left;cursor:pointer}
.note.click:hover{filter:brightness(.97)}
.note+.note{margin-top:8px}

/* goals */
.goal-list{display:grid;grid-template-columns:1fr;gap:14px;margin-top:4px}
.goal-item .row1{display:flex;align-items:center;gap:10px}
.goal-item .ic{width:36px;height:36px;border-radius:11px;background:var(--card-2)}
.goal-item .g-body{min-width:0;flex:1}
.goal-item .g-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-item .g-num{font-size:11.5px;color:var(--muted)}
.goal-item .track{margin-top:9px}
.goal-item .g-note{margin-top:4px;font-size:11px;color:var(--muted);text-align:right}

@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .hero .side-b{border-left:0;border-top:1px solid var(--cover-line);flex-direction:row;flex-wrap:wrap}
}
@media (max-width:720px){
  .greet b{font-size:20px}
  .setup-steps{grid-template-columns:repeat(2,1fr)}
  .hero .side-a,.hero .side-b{padding:18px}
  .hero-chart{height:170px}
  .wallet-actions{grid-template-columns:repeat(4,1fr)}
  .wallet-fam{grid-template-columns:repeat(4,1fr)}
}
</style>
<main data-page="beranda">
  <div class="greet enter" id="greet"></div>
  <div id="setupWrap"></div>
  <section class="grid" id="grid" aria-label="Ringkasan keuangan keluarga"></section>
</main>
<script src="wm.js"></script>
<script>
(function(){
WM.shell({page:"beranda",title:"Beranda"});
if(!WM.allowed)return;

var winMonths=3;

/* ---------- derived data ---------- */
function pad(n){return n<10?"0"+n:""+n;}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function monthsBack(n){var t=new Date(WM.today+"T00:00:00"),arr=[];for(var i=n-1;i>=0;i--){arr.push(ym(new Date(t.getFullYear(),t.getMonth()-i,1)));}return arr;}
function monthLabel(y){var p=y.split("-");return WM.months[+p[1]-1];}
function nextDue(day){var t=new Date(WM.today+"T00:00:00"),d=new Date(t.getFullYear(),t.getMonth(),day);if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,day);return d;}
function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function monthsUntil(iso){var t=new Date(WM.today+"T00:00:00"),d=new Date(iso+"T00:00:00");return (d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth());}

function data(){
  var accounts=WM.visibleAccounts(),members=WM.store.get("members"),goals=WM.store.get("goals"),
    budgets=WM.store.get("budgets"),liabilities=WM.store.get("liabilities"),requests=WM.store.get("requests"),
    investments=WM.store.get("investments"),assets=WM.store.get("assets"),tx=WM.store.get("tx");
  var totals=WM.totals();
  var liquidTypes={bank:1,cash:1,ewallet:1};
  var liquidTotal=accounts.filter(function(a){return liquidTypes[a.type];}).reduce(function(s,a){return s+a.balance;},0);
  var investTotal=investments.reduce(function(s,i){return s+i.value;},0);
  var assetsTotal=assets.reduce(function(s,a){return s+a.value;},0);
  var wealthBase=liquidTotal+investTotal+assetsTotal;
  var cashEwallet=accounts.filter(function(a){return a.type==="cash"||a.type==="ewallet";}).reduce(function(s,a){return s+a.balance;},0);
  var bankTotal=accounts.filter(function(a){return a.type==="bank";}).reduce(function(s,a){return s+a.balance;},0);
  var liaTotal=liabilities.reduce(function(s,l){return s+l.outstanding;},0);
  var income=WM.income(),spent=WM.spent(),saved=income-spent;
  var pendingCount=requests.filter(function(r){return r.status==="pending";}).length;
  var nearest=liabilities.map(function(l){var d=nextDue(l.dueDay);return Object.assign({},l,{nextIso:isoOf(d)});}).sort(function(a,b){return a.nextIso<b.nextIso?-1:1;})[0];
  return {accounts:accounts,members:members,goals:goals,budgets:budgets,liabilities:liabilities,requests:requests,
    totals:totals,liquidTotal:liquidTotal,investTotal:investTotal,assetsTotal:assetsTotal,wealthBase:wealthBase,
    cashEwallet:cashEwallet,bankTotal:bankTotal,liaTotal:liaTotal,income:income,spent:spent,saved:saved,
    pendingCount:pendingCount,nearest:nearest,tx:tx};
}

/* ---------- setup checklist ---------- */
var setupDismissed=false;
function setupState(D){
  var steps=[
    {id:"account",label:"Tambah rekening",done:D.accounts.length>0,href:"rekening.html"},
    {id:"budget",label:"Buat anggaran",done:D.budgets.length>0,href:"anggaran.html"},
    {id:"transaction",label:"Catat transaksi",done:D.tx.length>0,href:"transaksi.html"},
    {id:"family",label:"Undang anggota keluarga",done:D.members.filter(function(m){return m.role!=="staff";}).length>1,href:"iam.html"},
    {id:"goal",label:"Buat tujuan keuangan",done:D.goals.length>0,href:"tujuan.html"}
  ];
  var completedCount=steps.filter(function(s){return s.done;}).length;
  var next=steps.filter(function(s){return !s.done;})[0]||null;
  return {steps:steps,completedCount:completedCount,next:next,complete:completedCount===steps.length};
}
function drawSetup(D){
  var wrap=document.getElementById("setupWrap");
  var st=setupState(D);
  if(st.complete&&setupDismissed){wrap.innerHTML="";return;}
  wrap.innerHTML='<div class="card enter" style="margin-top:16px" id="setupCard">'+
    '<div class="setup-top"><div><h2>Lengkapi profil keluarga</h2><p>'+st.completedCount+' dari 5 langkah selesai.</p></div>'+
    (st.complete?'<button class="ibtn" type="button" id="setupX" aria-label="Tutup">'+WM.icon("x",16,2)+'</button>':'')+'</div>'+
    '<div class="track lg" style="margin-top:12px"><i style="width:'+(st.completedCount/5*100)+'%"></i></div>'+
    '<div class="setup-steps">'+st.steps.map(function(s){return '<div class="setup-step'+(s.done?" done":"")+'"><i>'+(s.done?WM.icon("check",11,3):"")+'</i>'+s.label+'</div>';}).join("")+'</div>'+
    (st.next?'<a class="btn primary sm" style="margin-top:14px" href="'+st.next.href+'">Lanjutkan: '+st.next.label+' '+WM.icon("chev",14,2.2)+'</a>':'');
  if(st.complete)document.getElementById("setupX").onclick=function(){setupDismissed=true;drawSetup(data());};
}

/* ---------- card builders ---------- */
function heroCard(D){
  return '<article class="card cover hero s8 enter" id="heroCard">'+
    '<div class="side-a">'+
      '<div class="hero-head"><div><p class="cap">Kekayaan bersih keluarga</p><p class="headline">Rp '+D.totals.netWorth.toLocaleString("id-ID")+'</p></div>'+
      '<div class="hero-win" role="group" aria-label="Rentang grafik arus kas">'+
        '<button type="button" data-win="3" aria-pressed="'+(winMonths===3)+'">3 bln</button>'+
        '<button type="button" data-win="6" aria-pressed="'+(winMonths===6)+'">6 bln</button></div></div>'+
      '<div class="legend" style="margin-top:10px"><span><i style="background:var(--lime)"></i>Pemasukan</span><span><i style="background:var(--orange)"></i>Pengeluaran</span></div>'+
      '<div class="hero-chart chart" id="heroChart"></div>'+
    '</div>'+
    '<div class="side-b">'+
      '<div class="hero-kpi"><small>Pemasukan bulan ini</small><b class="num">'+WM.short(D.income)+'</b></div>'+
      '<div class="hero-kpi"><small>Pengeluaran bulan ini</small><b class="num">'+WM.short(D.spent)+'</b></div>'+
      '<div class="hero-kpi"><small>Ditabung</small><b class="num">'+WM.short(D.saved)+'</b></div>'+
      '<div class="hero-kpi"><small>Liabilitas</small><b class="num">'+WM.short(D.liaTotal)+'</b></div>'+
    '</div></article>';
}
function drawHeroChart(){
  var box=document.getElementById("heroChart");if(!box)return;
  var months=monthsBack(winMonths),income=months.map(function(m){return WM.income(m)/1e6;}),spent=months.map(function(m){return WM.spent(m)/1e6;});
  WM.chart.bars(box,{labels:months.map(monthLabel),series:[{d:income,c:"var(--lime)",n:"Pemasukan"},{d:spent,c:"var(--orange)",n:"Pengeluaran"}],hi:months.length-1,fmt:function(v){return v.toLocaleString("id-ID",{maximumFractionDigits:1})+" jt";}});
}

function pcard(a){
  var cls=a.color==="lime"?"lime":a.color==="dark"?"dark":"soft";
  var bal=a.type==="cc"?("Tagihan "+WM.short(-a.balance)):WM.short(a.balance);
  var owner=WM.member(a.owner);
  return '<div class="pcard '+cls+'"><div class="t"><span>'+WM.esc(a.name)+'</span><b>'+WM.esc(a.bank)+'</b></div>'+
    '<div class="no num">'+(a.no?"**** **** **** "+WM.esc(a.no):"Tanpa nomor kartu")+'</div>'+
    '<div class="bt"><span>'+WM.esc(owner.short)+'</span><span class="num">'+bal+'</span></div></div>';
}
function walletCard(D){
  return '<article class="card s4 enter" id="walletCard">'+
    '<div class="head"><div><h2>Rekening & kartu</h2><div class="cap">Aksi cepat</div></div><a class="btn ghost sm" href="rekening.html">+ Tambah</a></div>'+
    '<div class="wallet-cards" id="walletCards" tabindex="0" aria-label="Rekening dan kartu, geser untuk melihat semua">'+D.accounts.map(pcard).join("")+'</div>'+
    '<div class="wallet-actions">'+
      '<button class="wallet-act" type="button" data-act="tx-out"><span>'+WM.icon("plus",17)+'</span>Catat</button>'+
      '<button class="wallet-act" type="button" data-act="tx-tf"><span>'+WM.icon("swap",17)+'</span>Transfer</button>'+
      '<button class="wallet-act" type="button" data-act="minta"><span>'+WM.icon("send",17)+'</span>Minta dana</button>'+
      '<a class="wallet-act" href="transaksi.html"><span>'+WM.icon("clock",17)+'</span>Riwayat</a>'+
      '<button class="wallet-act" type="button" data-act="lainnya"><span>'+WM.icon("dots",17)+'</span>Lainnya</button>'+
    '</div>'+
    '<div class="fam-head"><h3>Anggota keluarga</h3><button class="ibtn" type="button" data-act="kelola" aria-label="Kelola anggota">'+WM.icon("dots",15)+'</button></div>'+
    '<div class="wallet-fam">'+D.members.map(function(m){return '<div>'+WM.avatar(m,40)+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">'+(m.id===WM.meId()?"Kamu":WM.esc(m.short))+'</span></div>';}).join("")+'</div>'+
  '</article>';
}

function statTile(icon,bg,fg,label,val,href){
  return '<article class="card stat-tile s3 enter"><span class="ic" style="background:'+bg+';color:'+fg+'">'+WM.icon(icon,18)+'</span>'+
    '<div><span class="cap" style="display:block">'+label+'</span><b class="num" style="font-size:19px">'+WM.short(val)+'</b></div>'+
    '<a class="link" href="'+href+'">Lihat detail</a></article>';
}
function statTiles(D){
  return statTile("wallet","var(--lime-soft)","var(--good)","Cash & E-Wallet",D.cashEwallet,"dana.html")+
    statTile("landmark","var(--sky)","#123B63","Bank & Rekening",D.bankTotal,"rekening.html")+
    statTile("bars","var(--lilac)","#472062","Investasi",D.investTotal,"investasi.html")+
    statTile("receipt","var(--rose)","var(--bad)","Liabilitas",D.liaTotal,"liabilitas.html");
}

function snapCard(D){
  var lp=D.wealthBase>0?Math.round(D.liquidTotal/D.wealthBase*100):0,np=100-lp;
  return '<article class="card s4 enter">'+
    '<div class="head"><div><h2>Komposisi kekayaan</h2><div class="cap">Likuid vs non-likuid</div></div><a class="more" href="ringkasan.html">Ringkasan '+WM.icon("chev",14,2.2)+'</a></div>'+
    '<div class="snap-row"><span class="ic lime">'+WM.icon("wallet",17)+'</span><span class="snap-body"><span class="snap-label">Aset likuid ('+lp+'%)</span><span class="snap-val num">'+WM.short(D.liquidTotal)+'</span></span><span class="pill good">Cair</span></div>'+
    '<div class="snap-row"><span class="ic" style="background:var(--lilac);color:#472062">'+WM.icon("building",17)+'</span><span class="snap-body"><span class="snap-label">Aset non-likuid ('+np+'%)</span><span class="snap-val num">'+WM.short(D.wealthBase-D.liquidTotal)+'</span></span><span class="pill">Investasi/aset</span></div>'+
  '</article>';
}

function allocCard(D){
  var items=[["Kas & Rekening",D.liquidTotal,"var(--lime)"],["Investasi",D.investTotal,"var(--yellow)"],["Aset fisik",D.assetsTotal,"var(--sky)"]].filter(function(i){return i[1]>0;});
  var total=items.reduce(function(s,i){return s+i[1];},0)||1;
  return '<article class="card s4 enter">'+
    '<div class="head"><div><h2>Alokasi kekayaan</h2><div class="cap">Kas, investasi, aset</div></div><a class="more" href="ringkasan.html">Detail '+WM.icon("chev",14,2.2)+'</a></div>'+
    '<div class="alloc-body"><div class="alloc-donut chart" id="allocDonut"></div>'+
    '<div class="alloc-list">'+items.map(function(i){var pct=Math.round(i[1]/total*100);return '<div class="alloc-row"><div class="top"><span>'+i[0]+'</span><b class="num">'+WM.short(i[1])+'</b></div>'+
      '<div class="meta"><span>'+pct+'%</span></div><div class="track"><i style="width:'+pct+'%;background:'+i[2]+'"></i></div></div>';}).join("")+'</div></div>'+
  '</article>';
}
function drawAllocDonut(D){
  var box=document.getElementById("allocDonut");if(!box)return;
  var items=[["Kas & Rekening",D.liquidTotal,"var(--lime)"],["Investasi",D.investTotal,"var(--yellow)"],["Aset fisik",D.assetsTotal,"var(--sky)"]].filter(function(i){return i[1]>0;});
  if(!items.length){box.innerHTML='<div class="empty" style="padding:12px"><b>Belum ada data</b></div>';return;}
  WM.chart.donut(box,{items:items,center:WM.short(D.wealthBase),sub:"total kekayaan"});
}

function budgetRow(b){
  var spent=WM.spent(b.cat),pct=Math.min(100,Math.round(spent/b.limit*100)),over=spent>b.limit,watch=!over&&spent/b.limit>=.8;
  return '<div class="budget-row"><div class="top"><span>'+WM.esc(WM.cat(b.cat).name)+'</span><small class="num">'+WM.short(spent)+' / '+WM.short(b.limit)+'</small></div>'+
    '<div class="track'+(over?" ":"")+'"><i style="width:'+pct+'%;background:'+(over?"var(--bad)":watch?"var(--orange)":"var(--lime)")+'"></i></div>'+
    (over?'<div class="over">Lewat '+WM.rp(spent-b.limit)+'</div>':'')+'</div>';
}
function budgetCard(D){
  var rows=D.budgets.slice(0,4);
  return '<article class="card" id="budgetCard"><div class="head"><div><h2>Anggaran '+WM.monthsLong[new Date(WM.today+"T00:00:00").getMonth()]+'</h2></div><a class="more" href="anggaran.html">Kelola '+WM.icon("chev",14,2.2)+'</a></div>'+
    (rows.length?rows.map(budgetRow).join(""):'<div class="empty"><b>Belum ada anggaran</b><p>Buat anggaran untuk memantau pengeluaran per kategori.</p></div>')+
  '</article>';
}
function attentionCard(D){
  var has=D.pendingCount>0||D.nearest;
  var body='';
  if(D.pendingCount>0)body+='<button class="note warn click" type="button" data-act="approvals">'+WM.icon("checkc",16)+'<span><b>'+D.pendingCount+'</b> permintaan dana menunggu persetujuanmu.</span></button>';
  if(D.nearest){var prog=D.nearest.tenor>0?" (cicilan ke-"+D.nearest.paid+" dari "+D.nearest.tenor+")":"";
    body+='<button class="note click" type="button" data-act="liability">'+WM.icon("cal",16)+'<span><b>'+WM.esc(D.nearest.name)+'</b> jatuh tempo '+WM.date(D.nearest.nextIso)+'.'+prog+'</span></button>';}
  if(!has)body='<div class="empty" style="padding:20px"><b>Tidak ada yang perlu perhatian</b></div>';
  return '<article class="card'+(has?" soft":"")+'" id="attentionCard"><div class="head"><div><h2>Perlu perhatian</h2></div></div>'+body+'</article>';
}

function goalItem(g){
  var pct=Math.min(100,Math.round(g.saved/g.target*100)),remaining=g.target-g.saved,mo=monthsUntil(g.due);
  var note=remaining<=0?"Target tercapai":mo<=0?"Lewat target":mo>=12?"~"+Math.round(mo/12)+" tahun lagi":mo+" bulan lagi";
  return '<div class="goal-item"><div class="row1"><span class="ic" style="display:grid;place-items:center;color:'+g.color+'">'+WM.icon(g.icon,17)+'</span>'+
    '<div class="g-body"><div class="g-name">'+WM.esc(g.name)+'</div><div class="g-num num">'+WM.short(g.saved)+' / '+WM.short(g.target)+'</div></div></div>'+
    '<div class="track"><i style="width:'+pct+'%;background:'+g.color+'"></i></div>'+
    '<div class="g-note">'+(remaining>0?WM.short(remaining)+" lagi · ":"")+note+'</div></div>';
}
function goalsCard(D){
  var items=D.goals.slice(0,3);
  return '<article class="card s5 enter" id="goalsCard"><div class="head"><div><h2>Tujuan keuangan</h2></div><a class="more" href="tujuan.html">Lihat semua '+WM.icon("chev",14,2.2)+'</a></div>'+
    (items.length?'<div class="goal-list">'+items.map(goalItem).join("")+'</div>':'<div class="empty"><span class="ic">'+WM.icon("target",22)+'</span><b>Belum ada tujuan</b><a class="link" href="tujuan.html">+ Buat tujuan</a></div>')+
  '</article>';
}

function recentCard(D){
  var items=D.tx.slice(0,6);
  return '<article class="card s7 enter" id="recentCard"><div class="head"><div><h2>Transaksi terakhir</h2></div><a class="more" href="transaksi.html">Lihat semua '+WM.icon("chev",14,2.2)+'</a></div>'+
    (items.length?'<div class="list">'+items.map(WM.txRow).join("")+'</div>':'<div class="empty"><b>Belum ada transaksi</b><p>Catat transaksi pertamamu supaya beranda ini mulai hidup.</p></div>')+
  '</article>';
}

/* ---------- draw ---------- */
function draw(){
  var D=data();
  var me=WM.me(),h=new Date().getHours(),g=h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam";
  document.getElementById("greet").innerHTML='<b>'+g+', '+WM.esc(me.short)+'</b><small>'+WM.date(WM.today,true)+'</small>';
  drawSetup(D);
  document.getElementById("grid").innerHTML=
    heroCard(D)+walletCard(D)+statTiles(D)+snapCard(D)+allocCard(D)+
    '<div class="side-stack s4">'+budgetCard(D)+attentionCard(D)+'</div>'+
    recentCard(D)+goalsCard(D);
  drawHeroChart();
  drawAllocDonut(D);
  var wc=document.getElementById("walletCards");if(wc)WM.hscroll(wc.parentElement===document.getElementById("walletCard")?wc:wc);
}
draw();
WM.onChange(["tx","accounts","budgets","goals","requests","liabilities","investments","assets","members"],draw);
WM.onResize(document.getElementById("grid"),function(){drawHeroChart();drawAllocDonut(data());});

/* ---------- interactions ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-win]");
  if(b){winMonths=+b.dataset.win;document.querySelectorAll("[data-win]").forEach(function(x){x.setAttribute("aria-pressed",x===b);});drawHeroChart();return;}
  var a=e.target.closest("[data-act]");if(!a)return;
  var act=a.dataset.act;
  if(act==="tx-out")WM.openTx();
  else if(act==="tx-tf")WM.openTx(null,{type:"tf"});
  else if(act==="minta")WM.toast("Permintaan dana terkirim ke Master keluarga (simulasi)");
  else if(act==="lainnya")WM.popover(a,'<a class="mi" href="rekening.html">'+WM.icon("landmark")+'Kelola rekening</a><a class="mi" href="laporan.html">'+WM.icon("chart")+'Laporan</a><a class="mi" href="rekonsiliasi.html">'+WM.icon("compare")+'Rekonsiliasi bank</a>');
  else if(act==="kelola")location.href="iam.html";
  else if(act==="approvals")location.href="persetujuan.html";
  else if(act==="liability")location.href="liabilitas.html";
});
})();
</script>
