<title>Bank & Account · WealthMe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
@media (min-width:1181px){
  .r-hero{grid-column:1/9;grid-row:1}.r-side{grid-column:9/13;grid-row:1/3}
  .r-grid{grid-column:1/9;grid-row:2}.r-cc{grid-column:1/13;grid-row:3}
}
.pcard{flex:none;width:78%;max-width:260px;aspect-ratio:1.586;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.pcard.lime{background:var(--lime);color:var(--lime-ink);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 2px,transparent 2px 9px)}
.pcard.soft{background:linear-gradient(135deg,var(--card-2),var(--ghost));color:var(--ink)}
.pcard.dark{background:var(--ink);color:var(--card)}
.pcard .t{display:flex;justify-content:space-between;align-items:flex-start;font-size:11.5px}
.pcard .t b{font-size:15px;font-style:italic;font-weight:700;letter-spacing:.02em}
.pcard .chipsvg{width:34px;height:26px;margin-top:4px;flex:none}
.pcard .no{font-size:13px;letter-spacing:.08em;margin-top:auto}
.pcard .bt{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:11.5px;margin-top:6px;white-space:nowrap}
.pcard .bt span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pcard .bt .num{font-weight:600}
.pcard .priv{font-size:9px;font-weight:700;background:rgba(0,0,0,.12);border-radius:99px;padding:2px 7px;align-self:flex-start;margin-top:3px}
.pcard.lime .priv,.pcard.dark .priv{background:rgba(255,255,255,.22)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.r-hero .addtile{border:1.5px dashed var(--line);border-radius:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);background:transparent}
.r-hero .addtile:hover{border-color:var(--lime);color:var(--ink)}
.ccdeck{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.ccdeck::-webkit-scrollbar{display:none}
.ccdeck .pcard{width:230px;scroll-snap-align:start}
</style>
<main data-page="rekening">
<section class="bento" aria-label="Bank & Account">
  <article class="card hero dark r-hero">
    <div class="chart-side">
      <div class="head">
        <div><p class="big num" id="hTotal"></p><div class="cap" id="hCap"></div></div>
        <div class="hero-ctrl">
          <div class="ctrl-row"><button class="ghost-btn lit" type="button" id="addTop">+ Rekening</button></div>
        </div>
      </div>
      <div class="pgrid" id="bankGrid"></div>
      <div class="empty" id="bankEmpty" hidden><b>Belum ada rekening bank</b><p>Tambahkan rekening pertama keluarga.</p></div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Saldo bank</small><div class="v" id="kBank"></div></div>
      <div class="kpi"><small>Bersama</small><div class="v" id="kShared"></div><div class="delta"><em id="kSharedN"></em></div></div>
      <div class="kpi"><small>Milik anggota</small><div class="v" id="kOwn"></div><div class="delta"><em id="kOwnN"></em></div></div>
    </div>
  </article>

  <article class="card r-side">
    <div class="head"><div><h2>Rekening</h2><div class="cap">Ketuk kartu untuk detail</div></div></div>
    <div class="seg" role="tablist" aria-label="Filter kepemilikan" id="filterSeg" style="margin-top:8px"><button role="tab" aria-selected="true" data-f="all" type="button">Semua</button><button role="tab" aria-selected="false" data-f="mine" type="button">Saya</button><button role="tab" aria-selected="false" data-f="shared" type="button">Bersama</button></div>
    <ul class="mini-list" id="sideList"></ul>
  </article>

  <article class="card tips r-cc" id="ccSection">
    <div><h2>Kartu Kredit</h2><p>Dikelola sebagai kewajiban, ditampilkan di sini agar terlihat utuh.</p><a class="more" href="liabilitas.html">Kelola di Liabilitas <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a></div>
    <div class="ccdeck" id="ccDeck" aria-label="Kartu kredit"></div>
  </article>
</section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:"rekening",title:"Bank & Account"});
(function(){ if(!WM.allowed) return;
var esc=WM.esc;
var filter="all";
var chip='<svg class="chipsvg" viewBox="0 0 34 26" aria-hidden="true"><rect x=".5" y=".5" width="33" height="25" rx="5" fill="#E9C77B" stroke="rgba(0,0,0,.18)"/><path d="M11 1v24M23 1v24M1 9h10M1 17h10M23 9h10M23 17h10M11 13h12" stroke="rgba(0,0,0,.22)" fill="none"/></svg>';

function bankAccounts(){return WM.visibleAccounts().filter(function(a){return a.type==="bank";});}
function ccAccounts(){return WM.store.get("accounts").filter(function(a){return a.type==="cc";});}
function memberOptions(){var me=WM.me(),ms=WM.store.get("members");if(!WM.isOwner())return [[me.id,me.short]];
  return [["","Keluarga (bersama)"]].concat(ms.map(function(m){return [m.id,m.short];}));}
function maskNo(no){if(!no)return "•••• ••••";var s=String(no);return s.length>4?"•••• "+s.slice(-4):s;}
function cardTone(a,i){return a.vis==="private"?"soft":(i%2===0?"lime":"soft");}

function bankCardHTML(a,i){
  return '<button type="button" class="pcard '+cardTone(a,i)+'" data-acc="'+a.id+'">'+
   '<div class="t"><span>'+esc(a.name)+'</span><b>'+esc(a.bank)+'</b></div>'+
   '<div style="display:flex;align-items:center;justify-content:space-between">'+chip+(a.vis==="private"?'<span class="priv">Privat</span>':'')+'</div>'+
   '<div class="no num">'+maskNo(a.no)+'</div>'+
   '<div class="bt"><span>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</span><span class="num">'+WM.rp(a.balance)+'</span></div></button>';
}
function ccCardHTML(a){
  return '<button type="button" class="pcard dark" data-cc="'+a.id+'">'+
   '<div class="t"><span>'+esc(a.name)+'</span><b>'+esc(a.bank)+'</b></div>'+chip+
   '<div class="no num">'+maskNo(a.no)+'</div>'+
   '<div class="bt"><span>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</span><span class="num">Tagihan '+WM.rp(-a.balance)+'</span></div></button>';
}

function draw(){
  var all=bankAccounts();
  var vis=all.filter(function(a){if(filter==="mine")return a.owner===WM.meId();if(filter==="shared")return !a.owner;return true;});
  var total=all.reduce(function(s,a){return s+a.balance;},0),shared=all.filter(function(a){return !a.owner;}),owned=all.filter(function(a){return a.owner;});
  var sharedSum=shared.reduce(function(s,a){return s+a.balance;},0);
  document.getElementById("hTotal").innerHTML='<span class="cur">Rp</span>'+total.toLocaleString("id-ID");
  document.getElementById("hCap").textContent=all.length+" rekening terhubung";
  document.getElementById("kBank").textContent=WM.short(total);
  document.getElementById("kShared").textContent=WM.short(sharedSum);
  document.getElementById("kSharedN").textContent=shared.length+" rekening";
  document.getElementById("kOwn").textContent=WM.short(total-sharedSum);
  document.getElementById("kOwnN").textContent=owned.length+" rekening";
  var grid=document.getElementById("bankGrid");
  grid.innerHTML=vis.map(bankCardHTML).join("")+(WM.isOwner()?'<button type="button" class="addtile" id="addTile">'+WM.icon("landmark",22)+'<b style="font-size:13px">Tambah rekening</b></button>':"");
  document.getElementById("bankEmpty").hidden=vis.length>0;
  grid.querySelectorAll("[data-acc]").forEach(function(b){b.onclick=function(){openDetail(b.dataset.acc);};});
  var at=document.getElementById("addTile");if(at)at.onclick=function(){openForm(null);};

  document.getElementById("sideList").innerHTML=vis.slice(0,6).map(function(a){return '<li style="cursor:pointer" data-side="'+a.id+'"><span class="ic" style="background:var(--card-2)">'+WM.icon("landmark",16)+'</span><div><b>'+esc(a.name)+'</b><small>'+esc(a.bank)+' · '+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</small></div><div class="amt num">'+WM.short(a.balance)+'</div></li>';}).join("")||'<li style="border:0"><small>Belum ada rekening.</small></li>';
  document.querySelectorAll("[data-side]").forEach(function(li){li.onclick=function(){openDetail(li.dataset.side);};});

  var ccs=ccAccounts();
  document.getElementById("ccSection").hidden=!ccs.length;
  document.getElementById("ccDeck").innerHTML=ccs.map(ccCardHTML).join("");
  document.getElementById("ccDeck").querySelectorAll("[data-cc]").forEach(function(b){b.onclick=function(){openCcInfo(WM.account(b.dataset.cc));};});
}

function openForm(edit){
  var opts=memberOptions();
  var body=WM.field({name:"bank",label:"Nama Bank",type:"select",required:true,options:["BCA","Mandiri","BRI","BNI","CIMB","OCBC","Bank Lainnya"],value:edit?edit.bank:""})+
   WM.field({name:"name",label:"Nama Rekening",required:true,placeholder:"cth: BCA Tahapan",value:edit?edit.name:""})+
   WM.field({name:"no",label:"Nomor Rekening",optional:true,placeholder:"cth: 1234567890",value:edit?edit.no:""})+
   WM.field({name:"balance",label:"Saldo Saat Ini",type:"money",required:true,value:edit?edit.balance:0})+
   (edit?"":WM.field({name:"jenis",label:"Jenis",type:"select",options:["Tabungan","Giro","Deposito"]}))+
   '<label class="switch"><span>Rekening Privat<small>Hanya Master & Co-Master.</small></span><input type="checkbox" name="isPrivate"'+(edit&&edit.vis==="private"?" checked":"")+'></label>'+
   WM.field({name:"owner",label:"Pemilik",type:"select",options:opts,value:edit?(edit.owner||""):(WM.isOwner()?"":WM.meId())});
  WM.modal({title:edit?"Ubah rekening":"Tambah rekening",body:body,submit:"Simpan",
    onOpen:function(d){if(!edit)return;var ft=d.querySelector(".sheet-foot");
      ft.insertAdjacentHTML("afterbegin",'<button class="btn" type="button" data-rm style="color:var(--bad);flex:none">'+WM.icon("trash",16)+'Hapus</button>');
      ft.querySelector("[data-rm]").onclick=function(){d.close();delAccount(edit.id);};},
    onSubmit:function(f,v){
      var patch={type:"bank",bank:v.bank,name:v.name,no:v.no,balance:v.balance,owner:v.owner||"",vis:v.isPrivate?"private":"shared"};
      if(edit)WM.store.update("accounts",edit.id,patch);else WM.store.add("accounts",Object.assign({color:"soft"},patch));
      WM.toast("Rekening "+(edit?"diperbarui":"ditambahkan"));draw();}});
}
function delAccount(id){var a=WM.account(id);if(!a)return;
  WM.store.remove("accounts",id);
  WM.toast("Rekening dihapus",{undo:function(){var arr=WM.store.get("accounts");arr.push(a);WM.store.set("accounts",arr);}});
  draw();}

function openDetail(id){
  var a=WM.account(id);if(!a)return;
  var tx=WM.store.get("tx").filter(function(t){return t.acc===id||t.to===id;}).sort(function(x,y){return x.date<y.date?1:-1;}).slice(0,8);
  var body='<dl class="kv"><dt>Bank</dt><dd>'+esc(a.bank)+'</dd><dt>Nomor</dt><dd class="mono">'+maskNo(a.no)+'</dd>'+
   '<dt>Pemilik</dt><dd>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+(a.vis==="private"?' <span class="pill">Privat</span>':'')+'</dd>'+
   '<dt>Saldo</dt><dd class="num">'+WM.rp(a.balance)+'</dd></dl>'+
   '<div class="divider"></div><b style="font-size:13px">Mutasi terakhir</b>'+
   (tx.length?'<div class="list">'+tx.map(WM.txRow).join("")+'</div>':'<p class="muted" style="font-size:12.5px;margin:6px 0 0">Belum ada mutasi di rekening ini.</p>')+
   '<a class="more" href="rekonsiliasi.html" style="margin-top:10px">'+WM.icon("compare",14,2.2)+' Rekonsiliasi saldo bank</a>';
  WM.modal({title:a.name,sub:a.bank+" · "+maskNo(a.no),body:body,submit:false,cancel:"Tutup",
    onOpen:function(d){if(!WM.isOwner())return;var foot=d.querySelector(".sheet-foot");
      foot.insertAdjacentHTML("beforeend",'<button class="btn" type="button" data-del style="color:var(--bad)">'+WM.icon("trash",16)+'Hapus</button><button class="btn primary" type="button" data-edit>'+WM.icon("edit",16)+'Ubah</button>');
      foot.querySelector("[data-edit]").onclick=function(){d.close();openForm(a);};
      foot.querySelector("[data-del]").onclick=function(){d.close();delAccount(a.id);};}});
}
function openCcInfo(a){
  WM.modal({title:a.name,sub:a.bank,size:"sm",submit:false,cancel:"Tutup",body:
   '<dl class="kv"><dt>Nomor</dt><dd class="mono">'+maskNo(a.no)+'</dd><dt>Pemilik</dt><dd>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</dd>'+
   '<dt>Tagihan berjalan</dt><dd class="num" style="color:var(--bad)">'+WM.rp(-a.balance)+'</dd></dl>'+
   '<div class="note" style="margin-top:12px">'+WM.icon("info",16)+'<span>Kartu kredit dicatat sebagai kewajiban. Cicilan, limit dan tanggal cetak tagihan ada di halaman Liabilitas.</span></div>'+
   '<a class="btn block" style="margin-top:12px" href="liabilitas.html">Buka di Liabilitas</a>'});
}

document.getElementById("filterSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-selected",x===b);});filter=b.dataset.f;draw();});
if(!WM.isOwner())document.getElementById("addTop").hidden=true;
document.getElementById("addTop").onclick=function(){openForm(null);};
draw();WM.onChange(["accounts","tx"],draw);
})();
</script>
