<title>Bank & Account · WealthMe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
@media (min-width:1181px){.a-hero{grid-column:1/9;grid-row:1}.a-cards{grid-column:9/13;grid-row:1}.a-list{grid-column:1/9;grid-row:2}.a-cc{grid-column:9/13;grid-row:2}}
.pcard{flex:none;width:100%;aspect-ratio:1.586;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:center;position:relative;overflow:hidden;border:0;text-align:left;font:inherit;cursor:pointer}
.pcard.lime{background:var(--lime);color:var(--lime-ink);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 2px,transparent 2px 9px)}
.pcard.soft{background:linear-gradient(135deg,var(--card-2),var(--ghost));color:var(--ink)}
.pcard.dark{background:#15170F;color:#EEF0E8}
.pcard .t{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px}
.pcard .t b{font-size:16px;font-style:italic;font-weight:700}
.chipsvg{width:34px;height:26px}
.pcard .no{font-size:14px;letter-spacing:.08em}
.pcard .bt{display:flex;justify-content:space-between;font-size:12px;gap:8px}.pcard .bt .num{font-weight:600}
.pcard .priv{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:rgba(0,0,0,.08)}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:14px}
.deck::-webkit-scrollbar{display:none}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ghost)}.dots i.on{width:16px;border-radius:3px;background:var(--ink)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.qa button,.qa a{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;border:0;background:none;text-decoration:none;color:var(--ink)}
.qa span{width:48px;height:48px;border-radius:15px;border:1px solid var(--line);display:grid;place-items:center}
.qa button:hover span,.qa a:hover span{background:var(--card-2)}
.arow{display:grid;grid-template-columns:44px minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:12px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.arow:first-child{border-top:0}.arow:hover{background:var(--card-2)}
.arow .bk{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-style:italic;font-size:12px}
.arow b{display:block;font-weight:500;font-size:14px}.arow small{color:var(--muted);font-size:12px}
.arow .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#cc .pcard{max-width:300px;margin:0 auto}
.arow .track{width:100%}
.cc-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:720px){.arow{grid-template-columns:40px minmax(0,1fr) auto}.arow .track{display:none}}
</style>
<main data-page="rekening">
<section class="bento">
  <article class="card hero dark a-hero">
    <div class="chart-side">
      <div class="head">
        <div><p class="big num" id="hTotal"></p><div class="cap" id="hCap"></div></div>
        <div class="hero-ctrl"><div class="ctrl-row"><div class="seg" role="group" aria-label="Filter" id="filterSeg"><button type="button" aria-pressed="true" data-f="all">Semua</button><button type="button" aria-pressed="false" data-f="shared">Bersama</button><button type="button" aria-pressed="false" data-f="private">Pribadi</button></div><button class="ghost-btn lit" type="button" id="addTop">+ Rekening</button></div></div>
      </div>
      <div class="chart-wrap" id="chart"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Rekening bank</small><div class="v" id="kN"></div><div class="delta"><em id="kNn"></em></div></div>
      <div class="kpi"><small>Bersama</small><div class="v" id="kShared"></div><div class="delta"><em id="kSharedN"></em></div></div>
      <div class="kpi"><small>Pribadi</small><div class="v" id="kPriv"></div><div class="delta"><em id="kPrivN"></em></div></div>
    </div>
  </article>
  <article class="card a-cards">
    <div class="head"><div><h2>Kartu</h2><div class="cap" id="cardCap"></div></div></div>
    <div class="deck" id="deck" tabindex="0" aria-label="Kartu rekening, geser"></div>
    <div class="dots" id="dots"></div>
    <div class="qa"><button type="button" id="qCatat"><span></span>Catat</button><button type="button" id="qTf"><span></span>Transfer</button><a href="rekonsiliasi.html"><span></span>Rekonsiliasi</a><button type="button" id="qMut"><span></span>Mutasi</button></div>
  </article>
  <article class="card a-list">
    <div class="head"><div><h2>Semua rekening</h2><div class="cap">Porsi dari total saldo</div></div></div>
    <div id="rows" style="margin-top:8px"></div>
  </article>
  <article class="card a-cc" id="ccSection">
    <div class="head"><div><h2>Kartu kredit</h2><div class="cap">Dicatat sebagai kewajiban</div></div><a class="ghost-btn" href="liabilitas.html">Liabilitas</a></div>
    <div id="cc"></div>
  </article>
</section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:"rekening",title:"Bank & Account"});
(function(){ if(!WM.allowed) return;
var esc=WM.esc,filter="all",cur=0;
var chip='<svg class="chipsvg" viewBox="0 0 34 26" aria-hidden="true"><rect x=".5" y=".5" width="33" height="25" rx="5" fill="#E9C77B" stroke="rgba(0,0,0,.18)"/><path d="M11 1v24M23 1v24M1 9h10M1 17h10M23 9h10M23 17h10M11 13h12" stroke="rgba(0,0,0,.22)" fill="none"/></svg>';

function bankAccounts(){return WM.visibleAccounts().filter(function(a){return a.type==="bank";});}
function ccAccounts(){return WM.store.get("accounts").filter(function(a){return a.type==="cc";});}
function memberOptions(){var me=WM.me(),ms=WM.store.get("members");if(!WM.isOwner())return [[me.id,me.short]];
  return [["","Keluarga (bersama)"]].concat(ms.map(function(m){return [m.id,m.short];}));}
function maskNo(no){if(!no)return "•••• ••••";var s=String(no);return s.length>4?"•••• "+s.slice(-4):s;}
function cardTone(a,i){return a.vis==="private"?"soft":(i%2===0?"lime":"soft");}

function bankCardHTML(a,i){
  return '<button type="button" class="pcard '+cardTone(a,i)+'" data-acc="'+a.id+'">'+
   '<div class="t"><span>'+esc(a.name)+'</span><b>'+esc(a.bank)+'</b></div>'+
   '<div style="display:flex;align-items:center;justify-content:space-between">'+chip+(a.vis==="private"?'<span class="priv">Privat</span>':'')+'</div>'+
   '<div class="no num">'+maskNo(a.no)+'</div>'+
   '<div class="bt"><span>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</span><span class="num">'+WM.rp(a.balance)+'</span></div></button>';
}
function ccCardHTML(a){
  return '<button type="button" class="pcard dark" data-cc="'+a.id+'">'+
   '<div class="t"><span>'+esc(a.name)+'</span><b>'+esc(a.bank)+'</b></div>'+chip+
   '<div class="no num">'+maskNo(a.no)+'</div>'+
   '<div class="bt"><span>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</span><span class="num">Tagihan '+WM.rp(-a.balance)+'</span></div></button>';
}

var BANKTONE={BCA:["#1D4E9E","#fff"],BRI:["#0B5CAD","#fff"],Mandiri:["#F2B81C","#1E2A5A"],Jago:["#F5A623","#1B1B1B"],BNI:["#F26522","#fff"]};
function draw(){
  var all=bankAccounts(),vis=all.filter(function(a){return filter==="all"||a.vis===filter;});
  var total=all.reduce(function(s,a){return s+a.balance;},0),sh=all.filter(function(a){return a.vis==="shared";}),pr=all.filter(function(a){return a.vis==="private";});
  var sum=function(l){return l.reduce(function(s,a){return s+a.balance;},0);},vt=sum(vis);
  document.getElementById("hTotal").innerHTML='<span class="cur">Rp</span>'+vt.toLocaleString("id-ID");
  document.getElementById("hCap").textContent=filter==="all"?"Total saldo semua rekening bank":filter==="shared"?"Saldo rekening bersama":"Saldo rekening pribadi";
  var set=function(id,v,s){var e=document.getElementById(id);e.textContent=v;if(s)e.dataset.short=s;};
  set("kN",String(all.length),String(all.length));set("kNn",WM.short(total));set("kShared",WM.rp(sum(sh)),WM.short(sum(sh)));set("kSharedN",sh.length+" rekening");set("kPriv",WM.rp(sum(pr)),WM.short(sum(pr)));set("kPrivN",pr.length+" rekening");
  var box=document.getElementById("chart");
  if(vis.length)WM.chart.bars(box,{labels:vis.map(function(a){return a.bank;}),series:[{d:vis.map(function(a){return a.balance/1e6;}),c:"var(--lime)",n:"Saldo"}],hi:vis.reduce(function(m,a,i){return a.balance>vis[m].balance?i:m;},0),wide:true,fmt:function(v){return WM.short(v*1e6);},axis:function(t){return Math.round(t)+" jt";}});
  else box.innerHTML='<div class="empty"><b>Belum ada rekening di sini</b></div>';
  document.getElementById("cardCap").textContent=vis.length+" kartu, geser untuk lihat";
  var deck=document.getElementById("deck");deck.innerHTML=vis.map(bankCardHTML).join("")||'<div class="empty"><b>Tidak ada kartu</b></div>';
  deck.querySelectorAll("[data-acc]").forEach(function(b){b.onclick=function(){openDetail(b.dataset.acc);};});
  function dots(){cur=Math.round(deck.scrollLeft/Math.max(1,deck.clientWidth));document.getElementById("dots").innerHTML=vis.map(function(_,i){return '<i class="'+(i===cur?"on":"")+'"></i>';}).join("");}deck.onscroll=dots;dots();
  document.getElementById("qMut").onclick=function(){if(vis[cur])openDetail(vis[cur].id);};
  document.getElementById("rows").innerHTML=vis.slice().sort(function(a,b){return b.balance-a.balance;}).map(function(a){var t=BANKTONE[a.bank]||["var(--card-2)","var(--ink)"],p=total?a.balance/total*100:0;
    return '<button type="button" class="arow" data-acc="'+a.id+'"><span class="bk" style="background:'+t[0]+';color:'+t[1]+'">'+esc(a.bank.slice(0,4))+'</span><span><b>'+esc(a.name)+(a.vis==="private"?' <span class="pill">Pribadi</span>':'')+'</b><small>'+esc(WM.member(a.owner).short)+' · '+maskNo(a.no)+'</small></span><span class="track"><i class="fill-lime" style="width:'+p+'%"></i></span><span class="amt">'+WM.short(a.balance)+'<small style="display:block;font-weight:400">'+Math.round(p)+'%</small></span></button>';}).join("")||'<div class="empty"><b>Belum ada rekening</b></div>';
  document.querySelectorAll("#rows [data-acc]").forEach(function(b){b.onclick=function(){openDetail(b.dataset.acc);};});
  var ccs=ccAccounts();document.getElementById("ccSection").hidden=!ccs.length;
  document.getElementById("cc").innerHTML=ccs.map(function(a){var lim=a.limit||0,used=-a.balance,p=lim?used/lim*100:0;return '<div style="margin-top:14px">'+ccCardHTML(a)+'<div class="track" style="margin-top:14px"><i class="'+(p>80?"fill-bad":p>50?"fill-orange":"fill-lime")+'" style="width:'+Math.min(100,p)+'%"></i></div><div class="cc-meta"><span>Terpakai '+WM.short(used)+'</span><span>Limit '+(lim?WM.short(lim):"–")+'</span></div></div>';}).join("");
  document.querySelectorAll("#cc [data-cc]").forEach(function(b){b.onclick=function(){openCcInfo(WM.account(b.dataset.cc));};});
}
function openForm(edit){
  var opts=memberOptions();
  var body=WM.field({name:"bank",label:"Nama Bank",type:"select",required:true,options:["BCA","Mandiri","BRI","BNI","CIMB","OCBC","Bank Lainnya"],value:edit?edit.bank:""})+
   WM.field({name:"name",label:"Nama Rekening",required:true,placeholder:"cth: BCA Tahapan",value:edit?edit.name:""})+
   WM.field({name:"no",label:"Nomor Rekening",optional:true,placeholder:"cth: 1234567890",value:edit?edit.no:""})+
   WM.field({name:"balance",label:"Saldo Saat Ini",type:"money",required:true,value:edit?edit.balance:0})+
   (edit?"":WM.field({name:"jenis",label:"Jenis",type:"select",options:["Tabungan","Giro","Deposito"]}))+
   '<label class="switch"><span>Rekening Privat<small>Hanya Master & Co-Master.</small></span><input type="checkbox" name="isPrivate"'+(edit&&edit.vis==="private"?" checked":"")+'></label>'+
   WM.field({name:"owner",label:"Pemilik",type:"select",options:opts,value:edit?(edit.owner||""):(WM.isOwner()?"":WM.meId())});
  WM.modal({title:edit?"Ubah rekening":"Tambah rekening",body:body,submit:"Simpan",
    onOpen:function(d){if(!edit)return;var ft=d.querySelector(".sheet-foot");
      ft.insertAdjacentHTML("afterbegin",'<button class="btn" type="button" data-rm style="color:var(--bad);flex:none">'+WM.icon("trash",16)+'Hapus</button>');
      ft.querySelector("[data-rm]").onclick=function(){d.close();delAccount(edit.id);};},
    onSubmit:function(f,v){
      var patch={type:"bank",bank:v.bank,name:v.name,no:v.no,balance:v.balance,owner:v.owner||"",vis:v.isPrivate?"private":"shared"};
      if(edit)WM.store.update("accounts",edit.id,patch);else WM.store.add("accounts",Object.assign({color:"soft"},patch));
      WM.toast("Rekening "+(edit?"diperbarui":"ditambahkan"));draw();}});
}
function delAccount(id){var a=WM.account(id);if(!a)return;
  WM.store.remove("accounts",id);
  WM.toast("Rekening dihapus",{undo:function(){var arr=WM.store.get("accounts");arr.push(a);WM.store.set("accounts",arr);}});
  draw();}

function openDetail(id){
  var a=WM.account(id);if(!a)return;
  var tx=WM.store.get("tx").filter(function(t){return t.acc===id||t.to===id;}).sort(function(x,y){return x.date<y.date?1:-1;}).slice(0,8);
  var body='<dl class="kv"><dt>Bank</dt><dd>'+esc(a.bank)+'</dd><dt>Nomor</dt><dd class="mono">'+maskNo(a.no)+'</dd>'+
   '<dt>Pemilik</dt><dd>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+(a.vis==="private"?' <span class="pill">Privat</span>':'')+'</dd>'+
   '<dt>Saldo</dt><dd class="num">'+WM.rp(a.balance)+'</dd></dl>'+
   '<div class="divider"></div><b style="font-size:13px">Mutasi terakhir</b>'+
   (tx.length?'<div class="list">'+tx.map(WM.txRow).join("")+'</div>':'<p class="muted" style="font-size:13px;margin:6px 0 0">Belum ada mutasi di rekening ini.</p>')+
   '<a class="more" href="rekonsiliasi.html" style="margin-top:10px">'+WM.icon("compare",14,2.2)+' Rekonsiliasi saldo bank</a>';
  WM.modal({title:a.name,sub:a.bank+" · "+maskNo(a.no),body:body,submit:false,cancel:"Tutup",
    onOpen:function(d){if(!WM.isOwner())return;var foot=d.querySelector(".sheet-foot");
      foot.insertAdjacentHTML("beforeend",'<button class="btn" type="button" data-del style="color:var(--bad)">'+WM.icon("trash",16)+'Hapus</button><button class="btn primary" type="button" data-edit>'+WM.icon("edit",16)+'Ubah</button>');
      foot.querySelector("[data-edit]").onclick=function(){d.close();openForm(a);};
      foot.querySelector("[data-del]").onclick=function(){d.close();delAccount(a.id);};}});
}
function openCcInfo(a){
  WM.modal({title:a.name,sub:a.bank,size:"sm",submit:false,cancel:"Tutup",body:
   '<dl class="kv"><dt>Nomor</dt><dd class="mono">'+maskNo(a.no)+'</dd><dt>Pemilik</dt><dd>'+esc(a.owner?WM.member(a.owner).short:"Bersama")+'</dd>'+
   '<dt>Tagihan berjalan</dt><dd class="num" style="color:var(--bad)">'+WM.rp(-a.balance)+'</dd></dl>'+
   '<div class="note" style="margin-top:12px">'+WM.icon("info",16)+'<span>Kartu kredit dicatat sebagai kewajiban. Cicilan, limit dan tanggal cetak tagihan ada di halaman Liabilitas.</span></div>'+
   '<a class="btn block" style="margin-top:12px" href="liabilitas.html">Buka di Liabilitas</a>'});
}
document.getElementById("filterSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b);});filter=b.dataset.f;draw();});
var add=document.getElementById("addTop");if(!WM.isOwner())add.hidden=true;add.onclick=function(){openForm(null);};
document.getElementById("qCatat").onclick=function(){WM.openTx();};document.getElementById("qTf").onclick=function(){WM.openTx(null,{type:"tf"});};
document.querySelectorAll(".qa span").forEach(function(s,i){s.innerHTML=WM.icon(["plus","swap","compare","file"][i],18);});
draw();WM.onChange(["accounts","tx"],draw);WM.onResize(document.getElementById("chart"),draw);
})();
</script>
