<title>Master COA · WealthMe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
@media (min-width:1181px){
  .mc-hero{grid-column:1/9;grid-row:1}.mc-groups{grid-column:9/13;grid-row:1}
  .mc-cats{grid-column:1/9;grid-row:2/4}.mc-tips{grid-column:9/13;grid-row:2/4}
}
.mc-tips .mosaic{margin-top:auto;padding-top:12px;justify-self:start}
.mc-tips #emptyList{flex:none}
.mc-groups .mini-list li{cursor:pointer}
.mc-groups .mini-list li[aria-current="true"]{background:var(--card-2);border-radius:12px;margin:0 -8px;padding:11px 8px}
.mc-groups .mini-list .ic{background:var(--card-2)}
.mc-groups .mini-list li[aria-current="true"] .ic{background:var(--card)}
.mc-guide-list{display:grid;gap:10px}
.gcard{background:var(--card-2);border-radius:14px;padding:14px}
.gcard b{display:block;font-size:14px;margin-bottom:4px}
.gcard p{margin:0 0 6px;color:var(--muted);font-size:13px;line-height:1.5}
.gcard em{font-style:normal;color:var(--ink);font-size:12px;display:block;background:var(--card);border-radius:10px;padding:8px 10px;line-height:1.45}
.mc-tt{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.mc-tt.in{background:var(--lime-soft);color:var(--good)}
.mc-tt.out{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mc-tt.tf{background:color-mix(in srgb,var(--lilac,var(--ghost)) 40%,var(--card-2));color:var(--muted)}
.btile .code{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
<main data-page="mastercoa">
<section class="bento" aria-label="Master COA">
  <article class="card hero dark mc-hero">
    <div class="chart-side">
      <div class="head">
        <div><p class="big num" id="hTotal"></p><div class="cap">Akun COA aktif</div></div>
        <div class="hero-ctrl">
          <div class="ctrl-row"><button class="ghost-btn" type="button" id="btnGuide">Panduan</button><button class="ghost-btn lit" type="button" id="addAcc" hidden>+ Akun</button></div>
        </div>
      </div>
      <div class="chart-wrap" id="chart"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Kategori terhubung</small><div class="v" id="kLinked"></div><div class="delta" id="kLinkedSub"></div></div>
      <div class="kpi"><small>Akun kosong</small><div class="v" id="kEmpty"></div><div class="delta" id="kEmptyFlag"></div></div>
    </div>
  </article>

  <article class="card mc-groups">
    <div class="head"><div><h2>Grup akuntansi</h2><div class="cap">Ketuk untuk filter</div></div></div>
    <ul class="mini-list" id="groupList"></ul>
  </article>

  <article class="card mc-cats">
    <div class="head"><div><h2 id="catsTitle">Semua akun</h2><div class="cap">Ketuk akun untuk ubah</div></div></div>
    <div class="btiles" id="tiles"></div>
    <div class="empty" id="emptyState" hidden><b>Belum ada akun di grup ini</b><p>Coba pilih grup lain atau tambah akun baru.</p></div>
  </article>

  <article class="card mc-tips">
    <div class="head"><div><h2 id="alT"></h2><div class="cap" id="alCap">Perlu ditinjau</div></div></div>
    <p id="alP" style="margin:2px 0 12px"></p>
    <ul class="mini-list" id="emptyList"></ul>
    <div class="mosaic" aria-hidden="true" id="mosaic"></div>
  </article>
</section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:"mastercoa",title:"Master COA"});
(function(){ if(!WM.allowed) return;
var esc=WM.esc;
var GROUP=[null,
 {label:"Pendapatan",badge:"Income",dir:"INCOME",tt:"in",title:"1 · Pendapatan (Income)",meaning:"Uang yang benar-benar menambah kekayaanmu: gaji, bonus, hasil jualan, bunga tabungan. Setiap rupiah di grup ini menaikkan laba di laporan laba-rugimu.",example:"Contoh: gaji Rp 10.000.000 masuk ke BCA dan dicatat sebagai \"Gaji\" (grup 1). Laporan laba-rugi langsung menunjukkan pemasukan Rp 10.000.000."},
 {label:"Beban",badge:"Expense",dir:"EXPENSE",tt:"out",title:"2 · Pengeluaran (Expense)",meaning:"Uang yang benar-benar habis terpakai dan tidak kembali: belanja, makan, listrik, transportasi. Setiap rupiah di grup ini menurunkan laba.",example:"Contoh: belanja bulanan Rp 1.500.000 dicatat sebagai \"Kebutuhan Rumah Tangga\" (grup 2), tercatat sebagai pengeluaran bulan ini."},
 {label:"Alokasi",badge:"Alokasi",dir:"TRANSFER",tt:"tf",title:"3 · Alokasi Kekayaan (Wealth Allocation)",meaning:"Uang yang berpindah tempat, bukan hilang: menabung, membeli emas/investasi, pindah antar rekeningmu sendiri. Tidak muncul sebagai pengeluaran.",example:"Contoh: dari gaji di atas, Rp 2.000.000 dipindah ke tabungan (grup 3, \"Tabungan\"). Laba-rugi TIDAK mencatatnya sebagai pengeluaran, hanya pindah bentuk."},
 {label:"Piutang",badge:"Piutang",dir:"TRANSFER",tt:"tf",title:"4 · Piutang (Account Receivable)",meaning:"Uang yang kamu PINJAMKAN dan akan kembali. Bukan pengeluaran, arahnya TRANSFER.",example:"Contoh: pinjamkan Rp 500.000 ke teman, dicatat grup 4. Kekayaan bersihmu tetap sama, cuma bentuknya berubah jadi piutang."},
 {label:"Utang",badge:"Utang",dir:"TRANSFER",tt:"tf",title:"5 · Utang (Account Payable)",meaning:"Uang yang kamu PINJAM (termasuk cicilan/KPR) dan harus dibayar kembali. Membayar pokok bukan pengeluaran, arahnya TRANSFER.",example:"Contoh: cicilan KPR Rp 5.000.000 (pokok Rp 4.200.000 + bunga Rp 800.000). Hanya bunga masuk expense (grup 2), pokok mengurangi utang di grup 5."},
 {label:"Pajak",badge:"Pajak",dir:"EXPENSE",tt:"out",title:"6 · Pajak (Tax)",meaning:"Pajak yang kamu bayar ke negara: PPh, PBB, dan sejenisnya. Pengeluaran nyata, tetap dicatat sebagai expense.",example:"Contoh: PBB rumah Rp 800.000 dicatat di grup 6, tercatat sebagai pengeluaran Rp 800.000."}];
var SEED=[
 {id:"co1",code:"10001",name:"Gaji",groupNum:1,direction:"INCOME",budgetType:null},
 {id:"co2",code:"10002",name:"Bonus",groupNum:1,direction:"INCOME",budgetType:null},
 {id:"co3",code:"10003",name:"Hasil Investasi",groupNum:1,direction:"INCOME",budgetType:null},
 {id:"co4",code:"10004",name:"Pendapatan Lainnya",groupNum:1,direction:"INCOME",budgetType:null},
 {id:"co5",code:"20001",name:"Makan",groupNum:2,direction:"EXPENSE",budgetType:"VARIABLE"},
 {id:"co6",code:"20002",name:"Transport",groupNum:2,direction:"EXPENSE",budgetType:"VARIABLE"},
 {id:"co7",code:"20003",name:"Rumah & KPR (bunga)",groupNum:2,direction:"EXPENSE",budgetType:"FIXED"},
 {id:"co8",code:"20004",name:"Belanja",groupNum:2,direction:"EXPENSE",budgetType:"VARIABLE"},
 {id:"co9",code:"20005",name:"Kesehatan",groupNum:2,direction:"EXPENSE",budgetType:"VARIABLE"},
 {id:"co10",code:"20006",name:"Pendidikan",groupNum:2,direction:"EXPENSE",budgetType:"FIXED"},
 {id:"co11",code:"20007",name:"Zakat & Donasi",groupNum:2,direction:"EXPENSE",budgetType:"REIMBURSEMENT"},
 {id:"co12",code:"20008",name:"Pengeluaran Lainnya",groupNum:2,direction:"EXPENSE",budgetType:"VARIABLE"},
 {id:"co13",code:"30001",name:"Tabungan Internal",groupNum:3,direction:"TRANSFER",budgetType:null},
 {id:"co14",code:"30002",name:"Pembelian Investasi",groupNum:3,direction:"TRANSFER",budgetType:null},
 {id:"co15",code:"30003",name:"Transfer Antar Rekening",groupNum:3,direction:"TRANSFER",budgetType:null},
 {id:"co16",code:"40001",name:"Piutang Anggota Keluarga",groupNum:4,direction:"TRANSFER",budgetType:null},
 {id:"co17",code:"50001",name:"KPR BCA Bintaro",groupNum:5,direction:"TRANSFER",budgetType:null},
 {id:"co18",code:"50002",name:"Kartu Kredit",groupNum:5,direction:"TRANSFER",budgetType:null},
 {id:"co19",code:"50003",name:"Pinjaman Koperasi",groupNum:5,direction:"TRANSFER",budgetType:null},
 {id:"co20",code:"60001",name:"PPh 21",groupNum:6,direction:"EXPENSE",budgetType:null},
 {id:"co21",code:"60002",name:"PBB",groupNum:6,direction:"EXPENSE",budgetType:null}];
WM.store.ensure("coa",SEED);
(function linkOnce(){var cats=WM.store.get("categories");if(cats.some(function(c){return "coaAccountId" in c;}))return;
  var MAP={"c-makan":"co5","c-transport":"co6","c-rumah":"co7","c-belanja":"co8","c-kesehatan":"co9","c-pendidikan":"co10","c-zakat":"co11","c-gaji":"co1","c-bonus":"co2","c-invest":"co3"};
  cats=cats.map(function(c){return Object.assign({},c,{coaAccountId:MAP[c.id]||null,isPrivate:false});});WM.store.set("categories",cats);})();

var groupNums=[1,2,3,4,5,6],active=0,canManage=WM.isOwner();
document.getElementById("addAcc").hidden=!canManage;

function dirBadge(dir){var m={INCOME:["in","↓ Masuk"],EXPENSE:["out","↑ Keluar"],TRANSFER:["tf","↔ Mutasi"]}[dir];return '<span class="mc-tt '+m[0]+'">'+m[1]+'</span>';}
function btLabel(bt){return {FIXED:"Fixed",VARIABLE:"Variable",REIMBURSEMENT:"Reimbursement"}[bt]||null;}

function chart(coa){var box=document.getElementById("chart");
  var counts=groupNums.map(function(g){return coa.filter(function(a){return a.groupNum===g;}).length;});
  var hi=counts.reduce(function(a,v,i){return v>counts[a]?i:a;},0);
  WM.chart.bars(box,{labels:groupNums.map(function(g){return String(g);}),series:[{d:counts,c:"var(--lime)"}],hi:hi,wide:true});}

function guidePanel(){var html='<div class="mc-guide-list">'+groupNums.map(function(g){var d=GROUP[g];
    return '<div class="gcard"><b>'+d.title+'</b><p>'+d.meaning+'</p><em>'+d.example+'</em></div>';}).join("")+'</div>'+
    '<div class="note warn" style="margin-top:4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg><span>Mengubah grup atau arah akun yang sudah dipakai akan mengubah arti transaksi lama; laporan laba-rugi dan neraca ikut berubah.</span></div>';
  WM.modal({title:"Apa itu Master COA?",sub:"Setiap transaksi masuk ke salah satu dari 6 grup di bawah.",body:html,submit:false,cancel:"Tutup"});}
document.getElementById("btnGuide").onclick=guidePanel;

function drawGroups(coa){document.getElementById("groupList").innerHTML=
  '<li data-g="0" aria-current="'+(active===0)+'"><span class="ic" style="display:grid;place-items:center;color:var(--muted)">'+WM.icon("grid",16)+'</span><div><b>Semua</b><small>'+coa.length+' akun</small></div><span class="mc-tt" style="background:var(--card-2);color:var(--muted)">·</span></li>'+
  groupNums.map(function(g){var d=GROUP[g],n=coa.filter(function(a){return a.groupNum===g;}).length;
    return '<li data-g="'+g+'" aria-current="'+(active===g)+'"><span class="ic" style="display:grid;place-items:center;color:var(--muted)">'+g+'</span><div><b>'+d.label+'</b><small>'+n+' akun</small></div>'+dirBadge(d.dir)+'</li>';}).join("");
  document.querySelectorAll("#groupList [data-g]").forEach(function(li){li.onclick=function(){active=+li.dataset.g;draw();};});}

function draw(){
  var coa=WM.store.get("coa"),cats=WM.store.get("categories");
  document.getElementById("hTotal").textContent=coa.length;
  var linked=cats.filter(function(c){return c.coaAccountId;}).length;
  document.getElementById("kLinked").textContent=linked;
  document.getElementById("kLinkedSub").innerHTML='<em>dari '+cats.length+' kategori</em>';
  var usedCoa={};cats.forEach(function(c){if(c.coaAccountId)usedCoa[c.coaAccountId]=true;});
  var emptyItems=coa.filter(function(a){return !usedCoa[a.id];});
  document.getElementById("kEmpty").textContent=emptyItems.length;
  document.getElementById("kEmptyFlag").innerHTML=emptyItems.length>0?'<em>perlu dicek</em>':'<em>semua terhubung</em>';
  chart(coa);
  drawGroups(coa);

  var filtered=active===0?coa:coa.filter(function(a){return a.groupNum===active;});
  document.getElementById("catsTitle").textContent=active===0?"Semua akun":active+" · "+GROUP[active].label;
  document.getElementById("emptyState").hidden=filtered.length>0;
  document.getElementById("tiles").innerHTML=filtered.map(function(a){var bt=btLabel(a.budgetType);
    return '<button type="button" class="btile" data-edit="'+a.id+'" aria-label="'+esc(a.name)+', ubah"><span class="tt"><span class="code">'+esc(a.code)+'</span></span><span class="pv" style="font-size:16px">'+esc(a.name)+'</span><small>'+dirBadge(a.direction)+(bt?' · '+bt:'')+'</small></button>';}).join("")+
    (canManage?'<button type="button" class="btile add" data-add>'+WM.icon("plus",18,2)+'Akun baru</button>':"");
  document.querySelectorAll("#tiles [data-edit]").forEach(function(b){b.onclick=function(){openForm(b.dataset.edit);};});
  document.querySelectorAll("#tiles [data-add]").forEach(function(b){b.onclick=function(){openForm(null);};});

  var pct=cats.length?Math.round(linked/cats.length*100):0;
  document.getElementById("alT").textContent=emptyItems.length?emptyItems.length+" akun COA belum terhubung":"Semua akun COA terhubung";
  document.getElementById("alP").textContent=emptyItems.length?"Hubungkan akun ini ke kategori dari Setup Master Data.":"Semua akun COA sudah dipakai minimal satu kategori.";
  document.getElementById("emptyList").innerHTML=emptyItems.length?emptyItems.map(function(a){return '<li><span class="ic">'+WM.icon("db",16)+'</span><div><b>'+esc(a.name)+'</b><small>'+esc(a.code)+' · '+esc(GROUP[a.groupNum].label)+'</small></div></li>';}).join(""):'<li style="border:0"><small>Tidak ada akun yang perlu ditinjau.</small></li>';
  var n=Math.round(pct/100*18);document.getElementById("mosaic").innerHTML=Array.apply(null,{length:18}).map(function(_,i){return '<i class="'+(i<n?"a":i%5===0?"b":"")+'"></i>';}).join("");
}

function nextCode(g){var coa=WM.store.get("coa"),base=g*10000+1,codes=coa.filter(function(a){return a.groupNum===g;}).map(function(a){return +a.code;});
  var n=base;while(codes.indexOf(n)>=0)n++;return String(n);}

function openForm(editId){var a=editId?WM.store.find("coa",editId):{groupNum:active||1,direction:"INCOME",budgetType:""};
  var html='<div class="two">'+WM.field({name:"groupNum",label:"Grup (1-6)",type:"select",required:true,value:a.groupNum,options:groupNums.map(function(g){return [g,g+" · "+GROUP[g].label];})})+
    WM.field({name:"code",label:"Kode akun",value:a.code||"",placeholder:editId?"":"Otomatis jika dikosongkan",optional:!editId,hint:editId?"":"Dikosongkan = kode dibuat otomatis dari grup, bisa diubah.",attrs:'class="mono"'})+'</div>'+
    WM.field({name:"name",label:"Nama akun",required:true,value:a.name||"",placeholder:"cth: Kebutuhan Rumah Tangga"})+
    '<div class="two">'+WM.field({name:"direction",label:"Arah transaksi",type:"select",required:true,value:a.direction,options:[["INCOME","↓ Pemasukan"],["EXPENSE","↑ Pengeluaran"],["TRANSFER","↔ Mutasi"]]})+
    WM.field({name:"budgetType",label:"Tipe anggaran",type:"select",value:a.budgetType||"",options:[["","–"],["FIXED","Fixed"],["VARIABLE","Variable"],["REIMBURSEMENT","Reimbursement"]]})+'</div>'+
    WM.field({name:"parentCode",label:"Kode induk",optional:true,value:a.parentCode||"",placeholder:"cth: 201",attrs:'class="mono"'})+
    '<div class="note warn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg><span>Mengubah grup atau arah akun yang sudah dipakai akan mengubah arti transaksi lama.</span></div>';
  WM.modal({title:editId?"Ubah akun COA":"Tambah akun COA",body:html,submit:editId?"Simpan":"Tambah",
    onOpen:function(d,body){if(!editId||!canManage)return;var ft=d.querySelector(".sheet-foot");ft.insertAdjacentHTML("afterbegin",'<button class="btn" type="button" data-rm style="color:var(--bad);flex:none">'+WM.icon("trash",16)+'Hapus</button>');
      ft.querySelector("[data-rm]").onclick=function(){d.close();var old=WM.store.find("coa",editId);WM.store.remove("coa",editId);WM.toast("Akun COA dihapus",{undo:function(){WM.store.add("coa",old);}});};},
    onSubmit:function(f,v){var code=(v.code||"").trim()||nextCode(+v.groupNum);
      var coa=WM.store.get("coa");if(coa.some(function(x){return x.code===code&&x.id!==editId;}))return "Kode "+code+" sudah dipakai akun lain.";
      var rec={code:code,name:v.name,groupNum:+v.groupNum,direction:v.direction,budgetType:v.budgetType||null,parentCode:v.parentCode||undefined};
      if(editId){WM.store.update("coa",editId,rec);WM.toast("Akun COA disimpan");}else{WM.store.add("coa",rec);WM.toast("Akun COA ditambahkan");}}});}

document.getElementById("addAcc").onclick=function(){openForm(null);};
draw();
WM.onChange(["coa","categories"],draw);WM.onResize(document.getElementById("chart"),function(){chart(WM.store.get("coa"));});
})();
</script>
