<title>Detail aset · WealthMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{color:var(--ink)}
.hist-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.hist-item:last-child{border-bottom:0}
.doc-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.doc-item:last-child{border-bottom:0}
.doc-item button.link{background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;text-align:left;color:inherit;cursor:pointer;min-width:0}
.doc-item button.link:hover{text-decoration:underline}
</style>
<main data-page="aset">
  <a class="back" href="aset.html">Kembali ke Aset</a>
  <div class="ph" id="head"></div>
  <section class="grid">
    <div class="card s4" id="histCard"><h2>Riwayat nilai</h2><div id="histList" style="margin-top:8px"></div></div>
    <div class="card s8" id="chartCard"><h2>Grafik nilai</h2><div class="chart" id="valChart" style="height:250px;margin-top:8px"></div></div>
    <div class="card s6" id="docCard"><div class="head"><h2>Dokumen</h2><label class="btn sm ghost" id="uploadBtn" for="docInput" style="cursor:pointer">Unggah</label></div><input type="file" id="docInput" accept=".jpg,.jpeg,.png,.webp,.pdf" style="display:none"><div id="docList" style="margin-top:8px"></div></div>
    <div class="card s6" id="changeCard"><h2>Riwayat perubahan</h2><div id="changeList" style="margin-top:8px"></div></div>
  </section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:"aset"});
(function(){
if(!WM.allowed) return;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
document.querySelector(".back").innerHTML=WM.icon("chevl",15)+"Kembali ke Aset";
document.getElementById("uploadBtn").innerHTML=WM.icon("upload",15)+"Unggah";

var qs=new URLSearchParams(location.search),assetId=qs.get("id");
var TYPE_LABEL={properti:"Properti",kendaraan:"Kendaraan",elektronik:"Elektronik",perhiasan:"Perhiasan",emas:"Emas",lainnya:"Lainnya"};
var TYPE_ICON={properti:"home",kendaraan:"car",elektronik:"zap",perhiasan:"sparkle",emas:"gold",lainnya:"more"};

function normalizeOne(a){
  var n=Object.assign({},a),changed=false;
  if(n.type==null){n.type=n.kind||"lainnya";changed=true;}
  if(n.notes==null){n.notes=n.note||"";changed=true;}
  if(n.acquisitionDate==null){n.acquisitionDate=n.since||WM.today;changed=true;}
  if(n.valueChangeMode==null){n.valueChangeMode="percent";changed=true;}
  if(n.valueChangeRatePct===undefined){n.valueChangeRatePct=0;changed=true;}
  if(n.valueChangeAmount===undefined){n.valueChangeAmount=null;changed=true;}
  if(!n.history){
    n.history=[];
    if(n.cost!=null&&n.cost!==n.value)n.history.push({id:WM.uid("h"),date:n.acquisitionDate,value:n.cost,note:"Nilai awal",by:n.owner||WM.meId()});
    n.history.push({id:WM.uid("h"),date:WM.today,value:n.value,note:"Nilai tercatat",by:n.owner||WM.meId()});
    changed=true;
  }
  if(!n.docs){n.docs=[];changed=true;}
  return {a:n,changed:changed};
}
function getAsset(){
  var list=WM.store.get("assets")||[],changed=false;
  list=list.map(function(x){var r=normalizeOne(x);if(r.changed)changed=true;return r.a;});
  if(changed)WM.store.set("assets",list);
  return list.filter(function(x){return x.id===assetId;})[0]||null;
}

function openHistoryModal(asset){
  WM.modal({title:"Catat nilai baru",sub:esc(asset.name),size:"sm",submit:"Simpan",
    onOpen:function(d,body){
      body.innerHTML='<div class="field"><label>Cara mencatat</label><div class="seg full" data-radio="mode" role="radiogroup" aria-label="Cara mencatat nilai">'+
        '<button type="button" role="radio" data-v="value" aria-checked="true">Nilai baru</button>'+
        '<button type="button" role="radio" data-v="percent" aria-checked="false">Persentase perubahan</button>'+
      '</div></div>'+
      '<div data-panel="value">'+WM.field({name:"value",label:"Nilai baru",type:"money",value:asset.value})+'</div>'+
      '<div data-panel="percent" hidden>'+WM.field({name:"percent",label:"Perubahan (%)",type:"text",placeholder:"misal -2,5 atau 3",hint:"Dihitung dari nilai tercatat saat ini: "+WM.rp(asset.value)+"."})+'</div>'+
      WM.field({name:"recordedAt",label:"Tanggal",type:"date",value:WM.today,max:WM.today})+
      WM.field({name:"note",label:"Catatan",optional:true,placeholder:"misal Hasil appraisal baru"});
      WM.radio(body);
      var group=body.querySelector('[data-radio="mode"]');
      group.addEventListener("change",function(){
        var v=(group.querySelector('[aria-checked="true"]')||{}).dataset.v;
        body.querySelector('[data-panel="value"]').hidden=v!=="value";
        body.querySelector('[data-panel="percent"]').hidden=v!=="percent";
      });
    },
    onSubmit:function(f,v,d){
      var mode=(f.querySelector('[data-radio="mode"] [aria-checked="true"]')||{}).dataset.v||"value";
      var newValue;
      if(mode==="value"){
        newValue=v.value;
        if(!newValue||newValue<=0){WM.setError(f,"value","Masukkan nilai lebih dari 0.");return false;}
      }else{
        var pct=parseFloat(String(v.percent||"").replace(",","."));
        if(!isFinite(pct)){WM.setError(f,"percent","Masukkan angka, misal -2,5 atau 3.");return false;}
        newValue=Math.max(Math.round(asset.value*(1+pct/100)),0);
      }
      if(v.recordedAt>WM.today){WM.setError(f,"recordedAt","Tanggal tidak boleh di masa depan.");return false;}
      var changePct=asset.value?((newValue-asset.value)/asset.value*100):null;
      var hist=(asset.history||[]).slice();
      hist.push({id:WM.uid("h"),date:v.recordedAt,value:newValue,note:v.note||"",by:WM.meId(),changePercent:changePct});
      WM.store.update("assets",asset.id,{value:newValue,history:hist});
      WM.toast("Riwayat nilai tersimpan");
      renderAll();
    }});
}

function deleteDoc(asset,docId){
  WM.confirm({title:"Hapus dokumen ini?",text:"Dokumen akan dihapus dari daftar aset ini (simulasi, tidak ada file di server).",confirm:"Hapus",danger:true}).then(function(ok){
    if(!ok)return;
    var docs=(asset.docs||[]).filter(function(d){return d.id!==docId;});
    WM.store.update("assets",asset.id,{docs:docs});
    WM.toast("Dokumen dihapus");renderAll();
  });
}

function renderAll(){
  var asset=getAsset();
  if(!asset){
    document.getElementById("head").innerHTML='<div><h1>Aset tidak ditemukan</h1><p>Aset ini mungkin sudah dihapus.</p></div>';
    document.getElementById("chartsRowWrap");
    ["histCard","chartCard","docCard","changeCard"].forEach(function(id){document.getElementById(id).style.display="none";});
    return;
  }
  var hist=(asset.history||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var newestFirst=hist.slice().reverse();
  var canManage=WM.isOwner();

  document.getElementById("head").innerHTML=
    '<div><h1>'+esc(asset.name)+'</h1><p class="cap">'+esc(TYPE_LABEL[asset.type]||asset.type)+(asset.notes?" · "+esc(asset.notes):"")+'</p>'+
    '<div class="num" style="font-size:24px;font-weight:700;margin-top:6px">'+WM.rp(asset.value)+'</div></div>'+
    (canManage?'<div class="acts"><button class="btn primary" type="button" id="addHist">'+WM.icon("plus",16)+'Catat nilai baru</button></div>':'');
  if(canManage)document.getElementById("addHist").onclick=function(){openHistoryModal(asset);};

  /* history list */
  document.getElementById("histList").innerHTML=newestFirst.length?newestFirst.map(function(h){
    return '<div class="hist-item"><span class="muted">'+WM.date(h.date)+'</span><span class="num" style="font-weight:600">'+WM.rp(h.value)+'</span></div>';
  }).join(""):'<div class="empty" style="padding:16px 0"><p>Belum ada riwayat nilai.</p></div>';

  /* chart */
  var box=document.getElementById("valChart");
  if(hist.length>=2){
    function drawChart(){WM.chart.area(box,{labels:hist.map(function(h){return WM.date(h.date);}),a:hist.map(function(h){return h.value;}),fmt:WM.short});}
    drawChart();WM.onResize(box,drawChart);
  }else{
    box.innerHTML='<div class="empty" style="padding:24px"><span class="ic">'+WM.icon("chart",18)+'</span><b>Belum cukup data</b><p>Catat nilai baru minimal dua kali untuk melihat grafik.</p></div>';
  }

  /* documents */
  var docs=asset.docs||[];
  document.getElementById("docList").innerHTML=docs.length?docs.map(function(d){
    var kb=Math.max(1,Math.ceil((d.size||0)/1024)).toLocaleString("id-ID");
    var kind=(d.mime||"").replace("image/","").replace("application/","").toUpperCase()||"FILE";
    return '<div class="doc-item"><button type="button" class="link" data-open="'+d.id+'">'+WM.icon("file",16)+'<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.name)+'</span></button>'+
     '<span class="muted" style="white-space:nowrap">'+kind+' · '+kb+' KB · '+WM.date(d.date)+'</span>'+
     (canManage?'<button class="ibtn" type="button" data-doc-del="'+d.id+'" aria-label="Hapus dokumen" style="color:var(--bad)">'+WM.icon("trash",14)+'</button>':'')+
     '</div>';
  }).join(""):'<div class="empty" style="padding:16px 0"><p>Belum ada dokumen terlampir.</p></div>';
  document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){WM.toast("Simulasi: pratinjau dokumen belum tersedia di prototipe ini.");};});
  document.querySelectorAll("[data-doc-del]").forEach(function(b){b.onclick=function(){deleteDoc(asset,b.dataset.docDel);};});
  var upEl=document.getElementById("uploadBtn");
  if(!canManage){upEl.style.display="none";}else{upEl.style.display="";}

  /* change list */
  document.getElementById("changeList").innerHTML=newestFirst.length?newestFirst.map(function(h){
    var pct=h.changePercent!=null&&isFinite(h.changePercent)?h.changePercent:null;
    return '<div class="hist-item" style="align-items:flex-start"><div style="min-width:0"><div class="num" style="font-weight:600">'+WM.rp(h.value)+(pct!=null?' <span style="font-size:11.5px;color:'+(pct>=0?"var(--good)":"var(--bad)")+'">'+(pct>=0?"+":"")+pct.toFixed(2)+'%</span>':'')+'</div>'+
     '<div class="muted" style="margin-top:2px">'+WM.date(h.date,true)+' · oleh '+esc(WM.member(h.by).short)+(h.note?" · "+esc(h.note):"")+'</div></div></div>';
  }).join(""):'<div class="empty" style="padding:16px 0"><p>Belum ada riwayat perubahan.</p></div>';
}

var docInput=document.getElementById("docInput");
document.getElementById("uploadBtn").setAttribute("for","docInput");
docInput.addEventListener("change",function(){
  var f=docInput.files&&docInput.files[0];if(!f)return;
  var asset=getAsset();if(!asset)return;
  var docs=(asset.docs||[]).slice();
  docs.push({id:WM.uid("d"),name:f.name,size:f.size,mime:f.type||"application/octet-stream",date:WM.today});
  WM.store.update("assets",asset.id,{docs:docs});
  WM.toast("Dokumen terlampir (simulasi)");
  docInput.value="";
  renderAll();
});

if(!assetId){
  document.getElementById("head").innerHTML='<div><h1>Aset tidak ditemukan</h1><p>Tidak ada id aset di tautan ini.</p></div>';
  ["histCard","chartCard","docCard","changeCard"].forEach(function(id){document.getElementById(id).style.display="none";});
}else{
  renderAll();
  WM.onChange(["assets"],renderAll);
}
})();
</script>
