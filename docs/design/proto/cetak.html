<title>Cetak Laporan · WealthMe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
body{background:#EEEFE9;padding:24px 16px}
:root[data-theme="dark"] body,@media (prefers-color-scheme:dark){body{background:#EEEFE9}}
.sheet-page{max-width:820px;margin:0 auto;background:#fff;color:#15170F;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.12);padding:36px 40px}
.toolbar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:flex-end;gap:8px}
.toolbar .btn{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar .btn.ghost{background:#fff;color:#15170F;border-color:#D7D9CF}
.letterhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #15170F;padding-bottom:16px;margin-bottom:22px}
.lh-brand{display:flex;align-items:center;gap:10px}
.lh-mark{width:34px;height:34px;border-radius:10px;background:#9CCB3B;color:#1F2A07;display:grid;place-items:center;flex:none}
.lh-name{font-weight:800;font-size:16px}
.lh-title{font-size:20px;font-weight:800;margin-top:2px}
.lh-meta{text-align:right;font-size:12px;color:#666D5F;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{border:1px solid #E2E4DC;border-radius:11px;padding:12px}
.kpi small{display:block;font-size:11px;color:#666D5F;margin-bottom:4px}
.kpi b{display:block;font-size:16px;font-weight:800}
.kpi.pos b{color:#3F8F2F}.kpi.neg b{color:#C2462B}
.psec{margin-bottom:26px;break-inside:avoid}
.psec h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#3A3F31;margin:0 0 10px}
.pmuted{color:#666D5F;font-size:13px;margin:0}
.chart-svg{width:100%;height:160px}
.ptable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.ptable th,.ptable td{text-align:right;padding:7px 8px;border-bottom:1px solid #E2E4DC}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.pbars{display:flex;flex-direction:column;gap:8px}
.pbar-row{display:grid;grid-template-columns:140px 1fr 150px;gap:8px;align-items:center;font-size:12px}
.pbar-track{background:#E2E4DC;border-radius:6px;height:9px;overflow:hidden}
.pbar-fill{display:block;height:100%;background:#9CCB3B}
.pfoot{border-top:1px solid #E2E4DC;padding-top:12px;font-size:11px;color:#8b917f}
@media (max-width:720px){
  body{padding:14px}
  .sheet-page{padding:20px 16px}
  .toolbar{max-width:none}
  .kpis{grid-template-columns:1fr 1fr}
  .letterhead{flex-direction:column;gap:10px}
  .lh-meta{text-align:left}
  .pbar-row{grid-template-columns:1fr;gap:3px}
  .pbar-row .pbar-track{order:3}
  .ptable{font-size:11px}
  .ptable th,.ptable td{padding:6px 4px}
}
@media print{
  body{background:#fff;padding:0}
  .no-print{display:none!important}
  .sheet-page{margin:0;box-shadow:none;border-radius:0;max-width:none;padding:0}
  @page{size:A4;margin:16mm 14mm}
  .pfoot::after{content:"Dibuat dengan WealthMe · halaman " counter(page) " dari " counter(pages)}
}
</style>
<div class="toolbar no-print">
  <button class="btn ghost" type="button" id="backBtn">Kembali</button>
  <button class="btn" type="button" id="printBtn">Unduh PDF</button>
</div>
<div class="sheet-page" id="page"></div>
<script src="wm.js"></script>
<script>
(function(){
var TITLES={rsum:"Ringkasan",rharian:"Harian",rbulanan:"Bulanan",rtahunan:"Tahunan",rfamily:"Group Family",rbank:"Bank",rdetail:"Detail",raliran:"Aliran Dana",rpnl:"PNL",rcashflow:"Cashflow",rkas:"Arus Kas",rinv:"Investasi",rperf:"Performa",rbalance:"Balance Sheet",rasl:"Aset & Liabilitas",rpajak:"Pajak",rcoa:"Ringkasan COA"};
var params=new URLSearchParams(location.search),rid=params.get("r")||"rsum",title=TITLES[rid]||"Ringkasan";
function esc(s){return WM.esc(s);}
function ymOf(d){return d.slice(0,7);}
var CUR=WM.today.slice(0,7);
function monthsBack(n){var d=new Date(WM.today+"T00:00:00"),out=[];for(var i=n-1;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"));}return out;}
function mLabel(ym){return WM.months[+ym.slice(5,7)-1];}
var MON6=monthsBack(6),MON6L=MON6.map(mLabel);
var income=MON6.map(function(y){return WM.income(y);}),expense=MON6.map(function(y){return WM.spent(null,y);});
var curIncome=WM.income(CUR),curExpense=WM.spent(null,CUR),saved=curIncome-curExpense,rate=curIncome>0?Math.round(saved/curIncome*100):0;

function wibNow(){return new Intl.DateTimeFormat("id-ID",{dateStyle:"long",timeStyle:"short"}).format(new Date());}
function chartSVG(){var W=760,H=160,max=Math.max(1,Math.max.apply(null,income.concat(expense))),bw=(W/MON6.length-8)/2;
  var bars="";MON6.forEach(function(y,i){var x=i*(W/MON6.length)+4,ih=income[i]/max*(H-20),eh=expense[i]/max*(H-20);
    bars+='<rect x="'+x+'" y="'+(H-20-ih)+'" width="'+bw+'" height="'+ih+'" fill="#0f766e"/>';
    bars+='<rect x="'+(x+bw)+'" y="'+(H-20-eh)+'" width="'+bw+'" height="'+eh+'" fill="#b91c1c"/>';
    bars+='<text x="'+(x+bw)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="#475569">'+MON6L[i]+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart-svg" role="img" aria-label="Tren bulanan pemasukan vs pengeluaran">'+bars+'</svg>';}

function topExpenseCategories(){var by={};WM.store.get("tx").filter(function(t){return ymOf(t.date)===CUR&&t.type==="out";}).forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amount;});
  var arr=Object.keys(by).map(function(k){return {name:WM.cat(k).name,amount:by[k]};}).sort(function(a,b){return b.amount-a.amount;});
  var tot=arr.reduce(function(s,a){return s+a.amount;},0)||1;
  arr.forEach(function(a){a.pct=Math.round(a.amount/tot*100);});return arr.slice(0,8);}

function detailSection(){
  if(rid==="rinv"||rid==="rperf"){var h=WM.store.get("investments"),rows=h.map(function(i){return "<tr><td style=\"text-align:left\">"+esc(i.name)+"</td><td>"+esc(i.kind)+"</td><td>"+WM.rp(i.cost)+"</td><td>"+WM.rp(i.value)+"</td></tr>";}).join("");
    return '<section class="psec"><h2>Kepemilikan investasi</h2><table class="ptable"><thead><tr><th style="text-align:left">Aset</th><th>Jenis</th><th>Modal</th><th>Nilai kini</th></tr></thead><tbody>'+rows+'</tbody></table></section>';}
  if(rid==="rbalance"||rid==="rasl"||rid==="rcoa"){var t=WM.totals();return '<section class="psec"><h2>Posisi keuangan</h2><table class="ptable"><thead><tr><th style="text-align:left">Pos</th><th>Nilai</th></tr></thead><tbody>'+
    ["Kas & bank","Investasi","Aset lain","Liabilitas","Kekayaan bersih"].map(function(l,i){var v=[t.cash,t.investments,t.assets,t.liabilities,t.netWorth][i];return "<tr><td style=\"text-align:left\">"+l+"</td><td>"+WM.rp(v)+"</td></tr>";}).join("")+'</tbody></table></section>';}
  if(rid==="rfamily"){var members=WM.store.get("members"),rows=members.map(function(m){var mtx=WM.store.get("tx").filter(function(t){return ymOf(t.date)===CUR&&t.member===m.id;});
      var out=mtx.filter(function(t){return t.type==="out";}).reduce(function(s,t){return s+t.amount;},0);return "<tr><td style=\"text-align:left\">"+esc(m.short)+"</td><td>"+WM.rp(out)+"</td></tr>";}).join("");
    return '<section class="psec"><h2>Pengeluaran per anggota</h2><table class="ptable"><thead><tr><th style="text-align:left">Anggota</th><th>Pengeluaran</th></tr></thead><tbody>'+rows+'</tbody></table></section>';}
  if(rid==="rbank"||rid==="rkas"||rid==="rdetail"){var accs=WM.store.get("accounts"),rows=accs.map(function(a){return "<tr><td style=\"text-align:left\">"+esc(a.bank+" · "+a.name)+"</td><td>"+WM.rp(a.balance)+"</td></tr>";}).join("");
    return '<section class="psec"><h2>Saldo rekening</h2><table class="ptable"><thead><tr><th style="text-align:left">Rekening</th><th>Saldo</th></tr></thead><tbody>'+rows+'</tbody></table></section>';}
  if(rid==="rpajak"){var ptkp=67500000,pkp=Math.max(0,curIncome*12-ptkp);return '<section class="psec"><h2>Perkiraan pajak (kasar)</h2><p class="pmuted">Perkiraan berdasarkan data tersimpan, bukan SPT resmi.</p><table class="ptable"><thead><tr><th style="text-align:left">Pos</th><th>Nominal</th></tr></thead><tbody>'+
    "<tr><td style=\"text-align:left\">Estimasi penghasilan setahun</td><td>"+WM.rp(curIncome*12)+"</td></tr><tr><td style=\"text-align:left\">PTKP K/2 (asumsi)</td><td>"+WM.rp(ptkp)+"</td></tr><tr><td style=\"text-align:left\">PKP</td><td>"+WM.rp(pkp)+"</td></tr>"+'</tbody></table></section>';}
  return "";
}

document.getElementById("page").innerHTML =
  '<header class="letterhead"><div class="lh-brand"><span class="lh-mark">'+WM.icon("chart",18)+'</span><div><div class="lh-name">WealthMe</div><div class="lh-title">'+esc(title)+'</div></div></div>'+
  '<div class="lh-meta"><div>Keluarga Rizaldi</div><div>Periode: '+MON6L[0]+'–'+MON6L[MON6L.length-1]+' '+CUR.slice(0,4)+'</div><div>Dibuat: '+wibNow()+'</div></div></header>'+
  '<section class="kpis">'+
    '<div class="kpi"><small>Pemasukan</small><b class="pos">'+WM.rp(curIncome)+'</b></div>'+
    '<div class="kpi"><small>Pengeluaran</small><b class="neg">'+WM.rp(curExpense)+'</b></div>'+
    '<div class="kpi"><small>Tabungan bersih</small><b>'+WM.rp(saved)+'</b></div>'+
    '<div class="kpi"><small>Savings rate</small><b>'+rate+'%</b></div>'+
  '</section>'+
  '<section class="psec"><h2>Tren bulanan</h2>'+(income.concat(expense).every(function(v){return v===0;})?'<p class="pmuted">Belum ada data transaksi pada periode ini.</p>':chartSVG()+
    '<table class="ptable"><thead><tr><th style="text-align:left">Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Net</th></tr></thead><tbody>'+
    MON6.map(function(y,i){var has=income[i]>0||expense[i]>0;return "<tr><td style=\"text-align:left\">"+MON6L[i]+" "+y.slice(0,4)+"</td><td>"+(has?WM.rp(income[i]):"—")+"</td><td>"+(has?WM.rp(expense[i]):"—")+"</td><td>"+(has?WM.rp(income[i]-expense[i]):"—")+"</td></tr>";}).join("")+
    '</tbody></table>')+'</section>'+
  '<section class="psec"><h2>Kategori pengeluaran terbesar</h2>'+(function(){var top=topExpenseCategories();if(!top.length)return '<p class="pmuted">Belum ada pengeluaran tercatat.</p>';
    return '<div class="pbars">'+top.map(function(c){return '<div class="pbar-row"><span>'+esc(c.name)+'</span><span class="pbar-track"><span class="pbar-fill" style="width:'+Math.min(100,c.pct)+'%"></span></span><span>'+WM.rp(c.amount)+' ('+c.pct+'%)</span></div>';}).join("")+'</div>';})()+'</section>'+
  detailSection()+
  '<footer class="pfoot">Dibuat dengan WealthMe · Laporan ini adalah ringkasan, bukan nasihat keuangan atau pajak resmi.</footer>';

document.getElementById("printBtn").addEventListener("click",function(){window.print();});
document.getElementById("backBtn").addEventListener("click",function(){if(document.referrer)history.back();else location.href="laporan.html#"+rid;});
})();
</script>
