<title>Aset · WealthMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
.asset-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.asset-mini{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.asset-mini:hover{border-color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.banner .headline{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:2px 0 0}
[data-page="aset"].priv .money{filter:blur(6px);user-select:none}
.mini-name{font-weight:600;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:inherit}
.mini-name:hover{text-decoration:underline}
.mini-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
@media (max-width:720px){.banner{align-items:flex-start}}
</style>
<main data-page="aset">
  <div class="ph"><div><h1>Aset</h1><p>Semua dana, rekening, investasi, dan aset fisik keluarga dalam satu tempat.</p></div></div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Filter aset"></div>
  <section class="grid">
    <div class="cover s12" id="banner"></div>
  </section>
  <section class="grid" id="breakdown"></section>
  <section class="grid" id="chartsRow"></section>
  <section class="grid" id="groups"></section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:document.querySelector("main").dataset.page});
(function(){
if(!WM.allowed) return;
var main=document.querySelector('main[data-page="aset"]');
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var TAB_IDS=["semua","dana","rekening","investasi","fisik"];
var TAB_LABEL={semua:"Semua",dana:"Dana",rekening:"Rekening",investasi:"Investasi",fisik:"Aset fisik"};
var TYPES=[["properti","Properti"],["kendaraan","Kendaraan"],["elektronik","Elektronik"],["perhiasan","Perhiasan"],["emas","Emas"],["lainnya","Lainnya"]];
var TYPE_LABEL={properti:"Properti",kendaraan:"Kendaraan",elektronik:"Elektronik",perhiasan:"Perhiasan",emas:"Emas",lainnya:"Lainnya"};
var TYPE_ICON={properti:"home",kendaraan:"car",elektronik:"zap",perhiasan:"sparkle",emas:"gold",lainnya:"more"};
var DEFAULT_RATE={properti:3,kendaraan:-12,elektronik:-20,perhiasan:2,emas:0,lainnya:0};
var activeTab=0;

/* ---- migrate seed/legacy asset shape to the fields this prototype needs, once ---- */
function normalize(){
  var list=WM.store.get("assets")||[],changed=false;
  list=list.map(function(a){
    var n=Object.assign({},a);
    if(n.type==null){n.type=n.kind||"lainnya";changed=true;}
    if(n.notes==null){n.notes=n.note||"";changed=true;}
    if(n.acquisitionDate==null){n.acquisitionDate=n.since||WM.today;changed=true;}
    if(n.valueChangeMode==null){n.valueChangeMode="percent";changed=true;}
    if(n.valueChangeRatePct===undefined){n.valueChangeRatePct=DEFAULT_RATE[n.type]!=null?DEFAULT_RATE[n.type]:0;changed=true;}
    if(n.valueChangeAmount===undefined){n.valueChangeAmount=null;changed=true;}
    if(!n.history){
      n.history=[];
      if(n.cost!=null&&n.cost!==n.value)n.history.push({id:WM.uid("h"),date:n.acquisitionDate,value:n.cost,note:"Nilai awal",by:n.owner||WM.meId()});
      n.history.push({id:WM.uid("h"),date:WM.today,value:n.value,note:"Nilai tercatat",by:n.owner||WM.meId()});
      changed=true;
    }
    if(!n.docs){n.docs=[];changed=true;}
    return n;
  });
  if(changed)WM.store.set("assets",list);
  return list;
}

function estimateCurrent(a){
  var base=+a.value||0,days=(new Date(WM.today)-new Date(a.acquisitionDate))/864e5,years=Math.max(0,days/365.25);
  if(a.valueChangeMode==="fixed"){var amt=a.valueChangeAmount;if(!amt)return base;return Math.max(Math.round(base+amt*years),0);}
  var rate=a.valueChangeRatePct;if(!rate)return base;return Math.max(Math.round(base*(1+(rate/100)*years)),0);
}

/* ---------- privacy eye toggle (per-user localStorage, matches the real app's scoping) ---------- */
var PRIV_KEY="wm.aset-privacy."+WM.meId();
function privOn(){try{return localStorage.getItem(PRIV_KEY)==="1";}catch(e){return false;}}
function setPriv(v){try{localStorage.setItem(PRIV_KEY,v?"1":"0");}catch(e){}main.classList.toggle("priv",v);}

/* ---------- asset trend from real recorded history (no fabricated numbers) ---------- */
function assetTrend(assets){
  var perAsset=assets.map(function(a){return (a.history||[]).slice().sort(function(x,y){return x.date<y.date?-1:1;});});
  var months={};perAsset.forEach(function(h){h.forEach(function(e){months[e.date.slice(0,7)]=true;});});
  var keys=Object.keys(months).sort();if(keys.length<2)return null;keys=keys.slice(-6);
  return keys.map(function(mk){
    var total=0;
    perAsset.forEach(function(h){var v=h.length?h[0].value:0;h.forEach(function(e){if(e.date.slice(0,7)<=mk)v=e.value;});total+=v||0;});
    return {label:WM.months[+mk.slice(5,7)-1],v:total};
  });
}

/* ---------- form ---------- */
function assetFormBody(a){
  a=a||{};var mode=a.valueChangeMode||"percent";
  return ''+
   WM.field({name:"name",label:"Nama aset",required:true,value:a.name,placeholder:"misal Rumah Bintaro"})+
   WM.field({name:"type",label:"Jenis",type:"select",required:true,value:a.type||"properti",options:TYPES})+
   WM.field({name:"value",label:"Nilai saat ini",type:"money",required:true,value:a.value})+
   '<div class="field"><label>Perubahan nilai per tahun</label><div class="seg full" data-radio="mode" role="radiogroup" aria-label="Mode perubahan nilai">'+
     '<button type="button" role="radio" data-v="percent" aria-checked="'+(mode==="percent")+'">Persen</button>'+
     '<button type="button" role="radio" data-v="fixed" aria-checked="'+(mode==="fixed")+'">Rp tetap</button>'+
   '</div></div>'+
   '<div data-mode-panel="percent"'+(mode!=="percent"?" hidden":"")+'>'+WM.field({name:"ratePct",label:"Kenaikan/penurunan per tahun",type:"percent",value:a.valueChangeRatePct!=null?a.valueChangeRatePct:"",optional:true,min:-100,max:100,hint:"Perkiraan default "+TYPE_LABEL[a.type||"properti"]+": "+DEFAULT_RATE[a.type||"properti"]+"%."})+'</div>'+
   '<div data-mode-panel="fixed"'+(mode!=="fixed"?" hidden":"")+'>'+WM.field({name:"changeAmount",label:"Perubahan nilai per tahun",type:"money",value:a.valueChangeAmount!=null?a.valueChangeAmount:"",optional:true,hint:"Boleh minus untuk penyusutan.",attrs:'data-allow-zero'})+'</div>'+
   WM.field({name:"acquisitionDate",label:"Tanggal perolehan",type:"date",value:a.acquisitionDate||"",optional:true,max:WM.today,hint:"Kosongkan untuk pakai tanggal aset ini dicatat."})+
   WM.field({name:"notes",label:"Catatan",value:a.notes||"",optional:true,placeholder:"misal SHM atas nama Christian"})+
   '<div class="note" id="projNote" hidden>'+WM.icon("calc",16)+'<span id="projText"></span></div>'+
   '<div class="field"><label>Dokumen <span class="opt">(opsional)</span></label><label class="drop" for="assetDoc">'+WM.icon("upload",22)+'<b>Pilih file bukti kepemilikan</b><span>JPG, PNG, WEBP atau PDF</span></label><input type="file" id="assetDoc" accept=".jpg,.jpeg,.png,.webp,.pdf" style="display:none">'+
   '<span class="hint" id="docHint">Simulasi: dokumen tidak benar-benar diunggah ke server di prototipe ini.</span></div>';
}
function wireAssetForm(d,body,a){
  a=a||{};
  WM.radio(body);
  var group=body.querySelector('[data-radio="mode"]'),typeSel=body.querySelector('[name="type"]'),valueInp=body.querySelector('[name="value"]');
  function syncPanels(){
    var v=(group.querySelector('[aria-checked="true"]')||{}).dataset.v||"percent";
    body.querySelector('[data-mode-panel="percent"]').hidden=v!=="percent";
    body.querySelector('[data-mode-panel="fixed"]').hidden=v!=="fixed";
    updateProjection();
  }
  function updateProjection(){
    var base=WM.parseMoney(valueInp.value),mode=(group.querySelector('[aria-checked="true"]')||{}).dataset.v||"percent",proj=null;
    if(base){
      if(mode==="percent"){var r=body.querySelector('[name="ratePct"]'),rate=r?parseFloat((r.value||"").replace(",",".")):NaN;if(isFinite(rate)&&rate!==0)proj=Math.max(Math.round(base*(1+(rate/100)*5)),0);}
      else{var amt=WM.parseMoney(body.querySelector('[name="changeAmount"]').value);if(amt)proj=Math.max(Math.round(base+amt*5),0);}
    }
    var note=body.querySelector("#projNote");
    if(proj!=null&&proj!==base){note.hidden=false;body.querySelector("#projText").innerHTML="Proyeksi 5 tahun: <strong class=\"num\">"+WM.rp(proj)+"</strong> dari nilai, mode perubahan, dan tanggal perolehan.";}
    else note.hidden=true;
  }
  group.addEventListener("change",syncPanels);
  typeSel.addEventListener("change",function(){
    var r=body.querySelector('[name="ratePct"]');
    if(r&&!r.value.trim())r.value=DEFAULT_RATE[typeSel.value];
    r&&(r.closest(".field").querySelector(".hint").textContent="Perkiraan default "+TYPE_LABEL[typeSel.value]+": "+DEFAULT_RATE[typeSel.value]+"%.");
    updateProjection();
  });
  body.addEventListener("input",updateProjection);
  var fi=body.querySelector("#assetDoc");
  fi.addEventListener("change",function(){
    if(fi.files&&fi.files[0]){WM.toast("Dokumen terlampir (simulasi)");body.querySelector("#docHint").textContent="Terpilih: "+fi.files[0].name+" (simulasi, belum diunggah).";}
  });
  syncPanels();
}
function openAssetModal(id){
  var editing=id?WM.store.find("assets",id):null;
  WM.modal({title:editing?"Ubah aset":"Tambah aset fisik",size:"lg",submit:editing?"Simpan perubahan":"Tambah aset",
    onOpen:function(d,body){body.innerHTML=assetFormBody(editing);wireAssetForm(d,body,editing);},
    onSubmit:function(f,v,d){
      var mode=(f.querySelector('[data-radio="mode"] [aria-checked="true"]')||{}).dataset.v||"percent";
      var rec={name:v.name,type:v.type,value:v.value,
        valueChangeMode:mode,
        valueChangeRatePct:mode==="percent"?(v.ratePct!=null&&v.ratePct!==""?v.ratePct:null):null,
        valueChangeAmount:mode==="fixed"?(v.changeAmount||null):null,
        acquisitionDate:v.acquisitionDate||WM.today,
        notes:v.notes||""};
      var fi=f.querySelector("#assetDoc"),docFile=fi&&fi.files&&fi.files[0];
      if(editing){
        var hist=(editing.history||[]).slice();
        if(editing.value!==rec.value)hist.push({id:WM.uid("h"),date:WM.today,value:rec.value,note:"Diubah lewat form",by:WM.meId()});
        var docs=(editing.docs||[]).slice();
        if(docFile)docs.push({id:WM.uid("d"),name:docFile.name,size:docFile.size,mime:docFile.type||"application/octet-stream",date:WM.today});
        WM.store.update("assets",editing.id,Object.assign({},rec,{history:hist,docs:docs}));
        WM.toast("Perubahan disimpan");
      }else{
        rec.history=[{id:WM.uid("h"),date:rec.acquisitionDate,value:rec.value,note:"Aset ditambahkan",by:WM.meId()}];
        rec.docs=docFile?[{id:WM.uid("d"),name:docFile.name,size:docFile.size,mime:docFile.type||"application/octet-stream",date:WM.today}]:[];
        WM.store.add("assets",rec);
        WM.toast("Aset tersimpan");
      }
      draw();
    }});
}
function deleteAsset(id){
  var a=WM.store.find("assets",id);if(!a)return;
  WM.confirm({title:"Hapus aset ini?",text:'"'+esc(a.name)+'" akan dihapus dari daftar aset kamu.',confirm:"Hapus",danger:true}).then(function(ok){
    if(!ok)return;WM.store.remove("assets",id);WM.toast("Aset dihapus");draw();
  });
}
function adoptProjection(id){
  var a=WM.store.find("assets",id);if(!a)return;
  var est=estimateCurrent(a),hist=(a.history||[]).slice();
  hist.push({id:WM.uid("h"),date:WM.today,value:est,note:"Disesuaikan ke proyeksi",by:WM.meId()});
  WM.store.update("assets",id,{value:est,history:hist});
  WM.toast("Nilai diperbarui ke "+WM.rp(est));draw();
}

/* ---------- render pieces ---------- */
function rowHTML(icon,name,sub,val,isLast){
  return '<div class="row" style="'+(isLast?"border-bottom:0":"")+'"><span class="ic lime">'+WM.icon(icon,18)+'</span>'+
   '<span style="min-width:0"><b class="mini-sub" style="font-weight:500">'+esc(name)+'</b><small class="mini-sub">'+esc(sub)+'</small></span>'+
   '<span class="r num money">'+WM.rp(val)+'</span></div>';
}
function accountsGroupHTML(list,title,icon){
  var total=list.reduce(function(s,a){return s+a.balance;},0);
  var body=list.length?list.map(function(a,i){
    var typeIcon=a.type==="bank"?"landmark":a.type==="cc"?"card":"wallet";
    var typeLabel={bank:"Bank",cash:"Tunai",ewallet:"E-wallet",cc:"Kartu kredit"}[a.type]||a.type;
    var owner=a.vis==="private"?WM.member(a.owner).short:"Bersama";
    var sub=[typeLabel,a.bank,a.no?"···"+a.no:null,owner].filter(Boolean).join(" · ");
    return rowHTML(typeIcon,a.name,sub,a.balance,i===list.length-1);
  }).join(""):'<div class="empty"><span class="ic">'+WM.icon(icon,20)+'</span><b>Belum ada dana atau rekening</b><p>Tambahkan lewat halaman Dana atau Rekening.</p></div>';
  return '<div class="card s12"><div class="head"><div style="display:flex;align-items:center;gap:10px"><span class="ic lime">'+WM.icon(icon,18)+'</span><h2>'+title+'</h2></div><b class="num money" style="font-size:15px">'+WM.rp(total)+'</b></div><div class="list">'+body+'</div></div>';
}
function investGroupHTML(list){
  var total=list.reduce(function(s,i){return s+i.value;},0);
  var lbl={saham:"Saham",reksadana:"Reksadana",emas:"Emas",deposito:"Deposito",kripto:"Kripto"};
  var icons={saham:"trend",reksadana:"bars",emas:"gold",deposito:"landmark",kripto:"trend"};
  var body=list.length?list.map(function(inv,i){
    var name=(inv.ticker?inv.ticker+" · ":"")+inv.name;
    return rowHTML(icons[inv.kind]||"more",name,lbl[inv.kind]||inv.kind,inv.value,i===list.length-1);
  }).join(""):'<div class="empty"><span class="ic">'+WM.icon("bars",20)+'</span><b>Belum ada investasi</b><p>Catat saham, reksadana, atau instrumen lain di halaman Investasi.</p></div>';
  return '<div class="card s12"><div class="head"><div style="display:flex;align-items:center;gap:10px"><span class="ic lime">'+WM.icon("bars",18)+'</span><h2>Investasi</h2></div><b class="num money" style="font-size:15px">'+WM.rp(total)+'</b></div><div class="list">'+body+'</div></div>';
}
function assetMiniHTML(a,i){
  var est=estimateCurrent(a),drift=est!==a.value;
  var hasInfo=a.valueChangeMode==="fixed"?!!a.valueChangeAmount:!!a.valueChangeRatePct;
  var positive=a.valueChangeMode==="fixed"?(a.valueChangeAmount||0)>=0:(a.valueChangeRatePct||0)>=0;
  var badge=a.valueChangeMode==="fixed"?((a.valueChangeAmount>=0?"+":"")+WM.rp(a.valueChangeAmount)+"/thn"):((a.valueChangeRatePct>=0?"+":"")+WM.pct(a.valueChangeRatePct)+"/thn");
  return '<div class="asset-mini enter" style="animation-delay:'+(i*30)+'ms">'+
   '<div style="display:flex;align-items:center;gap:10px">'+
     '<span class="ic lime" style="border-radius:99px">'+WM.icon(TYPE_ICON[a.type]||"more",18)+'</span>'+
     '<div style="min-width:0;flex:1"><a class="mini-name" href="aset-detail.html?id='+encodeURIComponent(a.id)+'">'+esc(a.name)+'</a><small class="muted mini-sub">'+esc(a.notes||TYPE_LABEL[a.type]||"Lainnya")+'</small></div>'+
     '<div style="display:flex;gap:4px">'+
       '<button class="ibtn" type="button" data-edit="'+a.id+'" aria-label="Ubah aset">'+WM.icon("edit",15)+'</button>'+
       '<button class="ibtn" type="button" data-del="'+a.id+'" aria-label="Hapus aset">'+WM.icon("trash",15)+'</button>'+
     '</div>'+
   '</div>'+
   '<div style="display:grid;grid-template-columns:'+(drift?"1fr 1fr":"1fr")+';gap:10px">'+
     '<div><small class="muted">Nilai tercatat</small><b class="num money" style="display:block;font-size:14px">'+WM.rp(a.value)+'</b></div>'+
     (drift?'<div><small class="muted">Proyeksi</small><b class="num money" style="display:block;font-size:14px;color:'+(est>a.value?"var(--good)":"var(--bad)")+'">'+WM.rp(est)+'</b></div>':'')+
   '</div>'+
   (hasInfo?'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">'+
     '<span class="pill '+(positive?"good":"bad")+'">'+badge+'</span>'+
     (drift?'<button type="button" class="btn sm ghost" style="padding:0;min-height:auto;height:auto" data-adopt="'+a.id+'">Gunakan nilai ini</button>':'')+
   '</div>':'')+
  '</div>';
}
function fisikGroupHTML(list){
  var total=list.reduce(function(s,a){return s+a.value;},0);
  var body=list.length?'<div class="asset-mini-grid">'+list.map(assetMiniHTML).join("")+'</div>':'<div class="empty"><span class="ic">'+WM.icon("home",20)+'</span><b>Belum ada aset fisik</b><p>Tambahkan properti, kendaraan, atau barang berharga lain.</p></div>';
  return '<div class="card s12"><div class="head"><div style="display:flex;align-items:center;gap:10px"><span class="ic lime">'+WM.icon("home",18)+'</span><h2>Aset fisik</h2></div><b class="num money" style="font-size:15px">'+WM.rp(total)+'</b></div>'+body+'</div>';
}

/* ---------- main draw ---------- */
function draw(){
  var accounts=WM.visibleAccounts(),investments=WM.store.get("investments"),assets=WM.store.get("assets");
  var danaAcc=accounts.filter(function(a){return a.type==="cash"||a.type==="ewallet";});
  var rekAcc=accounts.filter(function(a){return a.type==="bank";});
  var cashTotal=danaAcc.reduce(function(s,a){return s+a.balance;},0);
  var bankTotal=rekAcc.reduce(function(s,a){return s+a.balance;},0);
  var accTotal=accounts.reduce(function(s,a){return s+a.balance;},0);
  var invTotal=investments.reduce(function(s,i){return s+i.value;},0);
  var astTotal=assets.reduce(function(s,a){return s+a.value;},0);
  var grand=accTotal+invTotal+astTotal;

  /* tabs */
  document.getElementById("tabs").innerHTML=TAB_IDS.map(function(id,i){return '<button type="button" role="tab" aria-selected="'+(i===activeTab)+'" data-tab="'+i+'">'+TAB_LABEL[id]+'</button>';}).join("");
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){activeTab=+b.dataset.tab;draw();};});

  /* banner */
  document.getElementById("banner").innerHTML=
   '<div class="banner"><div><small class="cap">Total aset</small><div class="headline num money">'+WM.rp(grand)+'</div>'+
    '<small class="cap">per '+WM.date(WM.today,true)+'</small></div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+
      '<button class="btn primary" type="button" id="add">'+WM.icon("plus",16)+'Tambah aset</button>'+
      '<button class="ibtn" type="button" id="eye" aria-pressed="'+privOn()+'" aria-label="'+(privOn()?"Tampilkan nominal":"Sembunyikan nominal")+'">'+WM.icon(privOn()?"eyeoff":"eye",17)+'</button>'+
    '</div></div>';
  document.getElementById("add").onclick=function(){openAssetModal();};
  document.getElementById("eye").onclick=function(){var v=!privOn();setPriv(v);draw();};
  main.classList.toggle("priv",privOn());

  /* breakdown */
  var nonZero=[cashTotal>0,bankTotal>0,invTotal>0,astTotal>0].filter(Boolean).length;
  document.getElementById("breakdown").innerHTML=nonZero>=2?[
    ["wallet","Dana",cashTotal],["landmark","Rekening",bankTotal],["bars","Investasi",invTotal],["home","Aset fisik",astTotal,"Nilai tercatat, bukan proyeksi"]
  ].map(function(s){return '<div class="card s3"><span class="ic lime" style="margin-bottom:10px">'+WM.icon(s[0],18)+'</span><small class="muted" style="display:block">'+s[1]+'</small><b class="num money" style="display:block;font-size:16px;margin-top:2px">'+WM.rp(s[2])+'</b>'+(s[3]?'<small class="muted" style="display:block;margin-top:2px">'+s[3]+'</small>':'')+'</div>';}).join(""):"";

  /* charts */
  var trend=assetTrend(assets),segs=[["Aset fisik",astTotal,"var(--orange)"],["Investasi",invTotal,"#8B7FD6"],["Rekening",bankTotal,"var(--sky,#5B9BD5)"],["Dana",cashTotal,"var(--lime)"]].filter(function(s){return s[1]>0;});
  var chartsHTML="";
  if(trend||segs.length){
    chartsHTML='<div class="card s8"><h2>Tren nilai aset fisik</h2><p class="cap">'+(trend?"6 bulan terakhir, dari riwayat nilai yang tercatat.":"Belum cukup riwayat untuk grafik.")+'</p><div class="chart" id="trendChart" style="height:220px;margin-top:8px">'+(trend?"":'<div class="empty" style="padding:20px"><span class="ic">'+WM.icon("chart",18)+'</span><p>Catat perubahan nilai aset di halaman detail untuk mulai melihat tren.</p></div>')+'</div></div>'+
      '<div class="card s4"><h2>Alokasi aset</h2><div class="chart" id="donutChart" style="height:180px;margin-top:8px">'+(segs.length?"":'<div class="empty" style="padding:20px"><p>Belum ada data.</p></div>')+'</div>'+(segs.length?WM.legend(segs.map(function(s){return [s[0],s[2],WM.short(s[1])];})):"")+'</div>';
  }
  document.getElementById("chartsRow").innerHTML=chartsHTML;
  if(trend){var box=document.getElementById("trendChart");WM.chart.area(box,{labels:trend.map(function(p){return p.label;}),a:trend.map(function(p){return p.v;}),fmt:WM.short});WM.onResize(box,function(){WM.chart.area(box,{labels:trend.map(function(p){return p.label;}),a:trend.map(function(p){return p.v;}),fmt:WM.short});});}
  if(segs.length){var db=document.getElementById("donutChart");WM.chart.donut(db,{items:segs,center:WM.short(grand),sub:"Total"});}

  /* groups by tab */
  var id=TAB_IDS[activeTab],html="";
  if(id==="semua")html+=accountsGroupHTML(accounts,"Dana & rekening","wallet");
  if(id==="dana")html+=accountsGroupHTML(danaAcc,"Dana","wallet");
  if(id==="rekening")html+=accountsGroupHTML(rekAcc,"Rekening","landmark");
  if(id==="semua"||id==="investasi")html+=investGroupHTML(investments);
  if(id==="semua"||id==="fisik")html+=fisikGroupHTML(assets);
  document.getElementById("groups").innerHTML=html;
  document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){openAssetModal(b.dataset.edit);};});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){deleteAsset(b.dataset.del);};});
  document.querySelectorAll("[data-adopt]").forEach(function(b){b.onclick=function(){adoptProjection(b.dataset.adopt);};});
}
normalize();
draw();
WM.onChange(["assets","accounts","investments"],draw);
})();
</script>
