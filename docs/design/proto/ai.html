<title>AI Advisor · WealthMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
@media (min-width:1181px){
  .ai-hero{grid-column:1/9;grid-row:1/4}
  .ai-data{grid-column:9/13;grid-row:1}
  .ai-ctx{grid-column:9/13;grid-row:2}
  .ai-provider{grid-column:9/13;grid-row:3}
}
.ai-hero{min-height:0}
.ai-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ai-chips{display:flex;gap:7px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.ai-chips::-webkit-scrollbar{display:none}
.ai-chips button{flex:none;border:1px solid var(--line);background:var(--card-2);color:var(--muted);border-radius:99px;padding:0 13px;min-height:34px;font-size:12px;font-weight:500;white-space:nowrap}
.ai-chips button:hover{color:var(--ink);border-color:var(--muted)}
.ai-body{flex:1;min-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-top:14px;padding-right:2px}
.msg{display:flex;align-items:flex-start;gap:9px;max-width:100%}
.msg .av{width:28px;height:28px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--card-2);color:var(--ink)}
.msg .bub{max-width:80%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.55;white-space:pre-line}
.msg.bot .bub{background:var(--card-2);border-radius:15px 15px 15px 4px}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:var(--lime);color:var(--lime-ink);border-radius:15px 15px 4px 15px}
.msg.user .av{background:var(--lime-soft);color:var(--lime-ink)}
.typing .bub{display:inline-flex;gap:4px;align-items:center;padding:12px 15px}
.typing .dot{width:6px;height:6px;border-radius:99px;background:var(--muted);animation:wmDot 1.1s ease-in-out infinite}
.typing .dot:nth-child(2){animation-delay:.15s}.typing .dot:nth-child(3){animation-delay:.3s}
@keyframes wmDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.ai-empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;max-width:34ch}
.ai-empty .ic{width:42px;height:42px;border-radius:14px;background:var(--card-2);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--ink)}
.ai-in{display:flex;gap:8px;margin-top:12px}
.ai-in input{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:99px;padding:0 16px;min-height:44px;font:inherit;font-size:13.5px;color:var(--ink)}
.ai-in input:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
.ai-in button{width:44px;height:44px;flex:none;border-radius:99px;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;border:0}
.ai-in button:disabled{opacity:.4}
.ai-provider .kv{margin-top:10px}
</style>
<main data-page="ai">
<section class="bento" aria-label="AI Advisor">
  <article class="card dark ai-hero">
    <div class="ai-top">
      <div><h2>AI Advisor</h2><div class="cap">Simulasi dari data contoh, bukan model sungguhan.</div></div>
      <button class="ghost-btn" type="button" id="btnNew">Percakapan baru</button>
    </div>
    <div class="ai-chips" id="chipsRow" role="list" aria-label="Pertanyaan populer"></div>
    <div class="ai-body" id="chatBody"></div>
    <div class="ai-in">
      <input id="chatInput" type="text" placeholder="Tanya apa saja…" aria-label="Tulis pesan">
      <button type="button" id="btnSend" aria-label="Kirim pesan"></button>
    </div>
  </article>

  <article class="card ai-data">
    <div class="head"><div><h2>Data yang dibaca</h2></div></div>
    <ul class="mini-list" id="dataRead"></ul>
  </article>

  <article class="card ai-ctx">
    <div class="head"><div><h2>Ringkasan</h2><div class="cap">Bulan ini</div></div></div>
    <dl class="kv" id="ctxSummary"></dl>
  </article>

  <article class="card ai-provider">
    <div class="head"><div><h2>Penyedia</h2><div class="cap" id="providerCap">Claude (Anthropic)</div></div><a class="see-all" id="btnKey" href="#" style="min-height:36px;width:auto;padding:0 14px">Ubah</a></div>
    <dl class="kv"><dt>API Key</dt><dd class="mono">sk-•••demo</dd></dl>
  </article>
</section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:"ai"});
(function(){ if(!WM.allowed) return;

  document.getElementById("btnSend").innerHTML=WM.icon("send",17,2);

  var CHIPS=["Analisa keuangan bulan ini","Cara capai target lebih cepat","Rekomendasi anggaran belanja","Tips hemat pengeluaran","Progres tujuan tabunganku","Ringkas kondisi keuangan keluarga"];

  if(WM.store.get("aiChat")==null) WM.store.set("aiChat",[]);
  var settings=WM.store.ensure("aiSettings",{provider:"Claude (Anthropic)",key:"sk-•••demo"});

  var body=document.getElementById("chatBody"), input=document.getElementById("chatInput"), sendBtn=document.getElementById("btnSend");
  var isTyping=false;

  function chipsHtml(){return CHIPS.map(function(c){return '<button type="button" data-chip="'+WM.esc(c)+'">'+WM.esc(c)+'</button>';}).join("");}
  document.getElementById("chipsRow").innerHTML=chipsHtml();

  function fmtMoney(n){return WM.rp(n);}

  function budgetReply(){
    var b=WM.store.get("budgets")||[], ym=WM.today.slice(0,7), lines=b.slice(0,4).map(function(x){
      var c=WM.cat(x.cat), spent=WM.spent(x.cat,ym), pct=x.limit?Math.round(spent/x.limit*100):0;
      return "• "+(c?c.name:x.cat)+": "+fmtMoney(spent)+" dari "+fmtMoney(x.limit)+" ("+pct+"%)";
    });
    return "Ini status anggaran bulan ini:\n"+lines.join("\n")+"\n\nMau aku bantu cari kategori yang paling perlu direm?";
  }
  function goalReply(){
    var g=(WM.store.get("goals")||[])[0];
    if(!g) return "Kamu belum punya tujuan tabungan yang tercatat. Buat satu di halaman Tujuan biar aku bisa pantau progresnya.";
    var pct=Math.round(g.saved/g.target*100);
    return "Tujuan \""+g.name+"\" sudah "+fmtMoney(g.saved)+" dari target "+fmtMoney(g.target)+" ("+pct+"%), jatuh tempo "+WM.date(g.due,true)+". Terus aja disiplin nabungnya, tinggal "+fmtMoney(g.target-g.saved)+" lagi.";
  }
  function spendingReply(){
    var ym=WM.today.slice(0,7), tx=WM.monthTx(ym).filter(function(t){return t.type==="out";});
    var byCat={};
    tx.forEach(function(t){byCat[t.cat]=(byCat[t.cat]||0)+t.amount;});
    var top=Object.keys(byCat).map(function(k){return {cat:k,amt:byCat[k]};}).sort(function(a,b){return b.amt-a.amt;}).slice(0,3);
    var lines=top.map(function(x){var c=WM.cat(x.cat);return "• "+(c?c.name:x.cat)+": "+fmtMoney(x.amt);});
    var total=WM.spent(null,ym);
    return "Total pengeluaranmu bulan ini "+fmtMoney(total)+". Kategori terbesar:\n"+lines.join("\n");
  }
  function genericReply(){
    var t=WM.totals();
    return "Kekayaan bersih keluarga kamu sekarang "+fmtMoney(t.netWorth)+", dengan pemasukan "+fmtMoney(WM.income())+" dan pengeluaran "+fmtMoney(WM.spent())+" bulan ini. Tanya lebih spesifik soal anggaran, tujuan, atau pengeluaran ya.";
  }
  function craftReply(text){
    var s=text.toLowerCase();
    if(/anggaran|budget/.test(s)) return budgetReply();
    if(/tabungan|goal|tujuan/.test(s)) return goalReply();
    if(/pengeluaran|belanja|hemat/.test(s)) return spendingReply();
    return genericReply();
  }

  function bubble(m){
    var isUser=m.role==="user";
    return '<div class="msg '+(isUser?"user":"bot")+'"><div class="av">'+(isUser?WM.avatar(WM.me(),28):WM.icon("bot",15))+'</div><div class="bub">'+WM.esc(m.text)+'</div></div>';
  }
  function typingBubble(){
    return '<div class="msg bot typing"><div class="av">'+WM.icon("bot",15)+'</div><div class="bub"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
  }

  function draw(){
    var msgs=WM.store.get("aiChat")||[];
    if(msgs.length===0){
      body.innerHTML='<div class="ai-empty"><div class="ic">'+WM.icon("bot",22,1.6)+'</div><b style="display:block;color:var(--ink);margin-bottom:4px">Mulai obrolan dengan AI Advisor</b>Tanya soal anggaran, tujuan, atau pengeluaran bulan ini.</div>';
    }else{
      body.innerHTML=msgs.map(bubble).join("")+(isTyping?typingBubble():"");
    }
    body.scrollTop=body.scrollHeight;
    sendBtn.disabled=isTyping;
    input.disabled=isTyping;
  }

  function pushMsg(role,text){
    var msgs=WM.store.get("aiChat")||[];
    msgs.push({id:WM.uid("m"),role:role,text:text});
    WM.store.set("aiChat",msgs);
  }

  function send(text){
    text=(text||"").trim();
    if(!text||isTyping) return;
    pushMsg("user",text);
    input.value="";
    isTyping=true;
    draw();
    setTimeout(function(){
      var reply=craftReply(text);
      isTyping=false;
      pushMsg("assistant",reply);
      draw();
    },600+Math.round(Math.random()*300));
  }

  document.addEventListener("click",function(e){
    var chip=e.target.closest("[data-chip]");
    if(chip) send(chip.dataset.chip);
  });
  sendBtn.onclick=function(){send(input.value);};
  input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send(input.value);}});

  document.getElementById("btnNew").onclick=function(){
    var old=WM.store.get("aiChat")||[];
    if(!old.length) return;
    WM.store.set("aiChat",[]);
    isTyping=false;
    draw();
    WM.toast("Percakapan baru dimulai",{undo:function(){WM.store.set("aiChat",old);draw();}});
  };

  document.getElementById("btnKey").onclick=function(e){
    e.preventDefault();
    var s=WM.store.get("aiSettings");
    var html=WM.field({name:"provider",label:"Penyedia",type:"select",value:s.provider,options:[["Claude (Anthropic)","Claude (Anthropic)"],["OpenAI GPT","OpenAI GPT"],["Google Gemini","Google Gemini"]]})+
      WM.field({name:"key",label:"API Key",required:true,value:s.key,hint:"Contoh untuk prototipe, key disimpan terenkripsi di server pada aplikasi asli."});
    WM.modal({title:"Ubah penyedia & kunci",body:html,submit:"Simpan",onSubmit:function(f,v){
      WM.store.set("aiSettings",{provider:v.provider,key:v.key});
      document.getElementById("providerCap").textContent=v.provider;
      document.querySelector(".ai-provider .kv dd").textContent=v.key;
      WM.toast("Pengaturan AI disimpan (simulasi)");
    }});
  };

  function drawSide(){
    var rows=[
      ["Kekayaan bersih & neraca",true],["Pemasukan & pengeluaran bulan ini",true],["Kategori pengeluaran teratas",true],
      ["Liabilitas: sisa, cicilan, jatuh tempo",true],["Saldo rekening & rincian aset",true],["Tujuan keuangan & progresnya",true],
      ["Detail transaksi individual",false],["Nomor rekening",false]
    ];
    document.getElementById("dataRead").innerHTML=rows.map(function(r){
      return '<li><span class="ic" style="background:var(--card-2);display:flex;align-items:center;justify-content:center">'+WM.icon(r[1]?"check":"x",15)+'</span><div><b>'+r[0]+'</b></div><span class="pill '+(r[1]?"good":"")+'">'+(r[1]?"Ya":"Tidak")+'</span></li>';
    }).join("");
    var t=WM.totals();
    document.getElementById("ctxSummary").innerHTML=
      "<dt>Kekayaan bersih</dt><dd>"+WM.short(t.netWorth)+"</dd>"+
      "<dt>Pemasukan</dt><dd style='color:var(--good)'>"+WM.short(WM.income())+"</dd>"+
      "<dt>Pengeluaran</dt><dd style='color:var(--bad)'>"+WM.short(WM.spent())+"</dd>";
  }

  draw();
  drawSide();
  document.getElementById("providerCap").textContent=settings.provider;
  document.querySelector(".ai-provider .kv dd").textContent=settings.key;
  WM.onChange(["tx","budgets","goals","accounts","investments","assets","liabilities"],drawSide);
})();
</script>
