<title>Persetujuan · WealthMe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
@media (min-width:1181px){
  .p-hero{grid-column:1/9;grid-row:1}.p-side{grid-column:9/13;grid-row:1/3}
  .p-main{grid-column:1/9;grid-row:2/4}.p-tips{grid-column:9/13;grid-row:3}
}
.pq-card{border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
.pq-card+.pq-card{margin-top:10px}
.pq-top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px}
.pq-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;background:linear-gradient(135deg,var(--lime),#7C6BD1)}
.pq-meta{min-width:170px;flex:1}
.pq-meta .nm{font-weight:600;font-size:13px}
.pq-meta .sub{color:var(--muted);font-size:12px;margin-top:2px}
.pq-amt{text-align:right;flex:none}
.pq-amt b{font-size:20px;font-weight:700}
.pq-box{border-radius:11px;border:1px solid var(--line);padding:7px 11px;margin-top:9px;font-size:13px}
.pq-box .lbl{font-size:11px;color:var(--muted)}
.pq-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
.pq-tbl{width:100%;border-collapse:collapse;font-size:13px}
.pq-tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.pq-tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.pq-tbl tr:last-child td{border-bottom:0}
.pq-inl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
.pq-inl select,.pq-inl textarea{min-height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;background:var(--card);font:inherit;color:inherit}
.pq-inl textarea{width:100%;min-height:38px;padding:8px 10px;resize:vertical}
.pq-inl .err{color:var(--bad);font-size:12px;flex-basis:100%}
</style>
<main data-page="persetujuan">
<section class="bento" aria-label="Persetujuan">
  <article class="card hero dark p-hero">
    <div class="chart-side">
      <div class="head">
        <div><p class="big num" id="heroVal"></p><div class="cap">Total permintaan menunggu</div></div>
        <div class="hero-ctrl"><div class="ctrl-row"><span class="ghost-btn" style="border:0;background:var(--card-2)" id="heroCount"></span></div></div>
      </div>
      <div class="chart-wrap" id="chart"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Menunggu</small><div class="v" id="kPend"></div></div>
      <div class="kpi"><small>Disetujui bulan ini</small><div class="v" id="kAppr"></div></div>
      <div class="kpi"><small>Ditolak bulan ini</small><div class="v" id="kRej"></div></div>
    </div>
  </article>

  <article class="card p-side">
    <div class="head"><div><h2>Pemohon aktif</h2><div class="cap">Menunggu keputusanmu</div></div></div>
    <p class="mid" id="pAvg"></p>
    <div class="cap" id="pAvgCap">Rata-rata per permintaan</div>
    <ul class="mini-list" id="reqList"></ul>
    <button class="see-all" type="button" id="toRiwayat">Lihat riwayat keputusan</button>
  </article>

  <article class="card p-main">
    <div class="head"><div><h2>Permintaan dana</h2></div><div class="seg" role="group" aria-label="Tampilan"><button type="button" data-tab="pending" aria-pressed="true">Menunggu</button><button type="button" data-tab="riwayat" aria-pressed="false">Riwayat</button></div></div>
    <div id="panelPending" style="margin-top:10px"></div>
    <div id="panelRiwayat" style="margin-top:10px" hidden></div>
  </article>

  <article class="card tips p-tips">
    <div><h2 id="tipT"></h2><p id="tipP"></p></div>
    <div class="mosaic" aria-hidden="true" id="mosaic"></div>
  </article>
</section>
</main>
<script src="wm.js"></script>
<script>
WM.shell({page:"persetujuan",title:"Persetujuan"});
(function(){ if(!WM.allowed) return;
if(!WM.isOwner()){document.querySelector("main").innerHTML='<div class="ph"><h1>Persetujuan</h1></div><div class="card"><div class="empty"><span class="ic">'+WM.icon("lock",24)+'</span><b>Hanya Master atau Co-Master</b><p>Halaman ini hanya tersedia untuk peran yang bisa menyetujui permintaan dana.</p></div></div>';return;}

var tab="pending";

function requests(){return WM.store.get("requests")||[];}
function pending(){return requests().filter(function(r){return r.status==="pending";});}
function history(){return requests().filter(function(r){return r.status!=="pending";}).sort(function(a,b){return (b.decidedAt||b.date)<(a.decidedAt||a.date)?-1:1;});}
function isThisMonth(iso){if(!iso)return false;var d=new Date(iso),n=new Date(WM.today);return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();}

function drawHero(){
  var p=pending(),pt=p.reduce(function(s,r){return s+r.amount;},0);
  document.getElementById("heroVal").innerHTML='<span class="cur">Rp</span>'+pt.toLocaleString("id-ID");
  document.getElementById("heroCount").textContent=p.length+" permintaan";
  document.getElementById("kPend").textContent=p.length;
  document.getElementById("pAvg").textContent=p.length?WM.rp(Math.round(pt/p.length)):"Rp 0";
  document.getElementById("pAvgCap").textContent=p.length?"Rata-rata per permintaan":"Tidak ada yang menunggu";

  var appr=requests().filter(function(r){return r.status==="approved"&&isThisMonth(r.decidedAt);}),at=appr.reduce(function(s,r){return s+r.amount;},0);
  document.getElementById("kAppr").textContent=WM.short(at);
  var rej=requests().filter(function(r){return r.status==="rejected"&&isThisMonth(r.decidedAt);}),rt=rej.reduce(function(s,r){return s+r.amount;},0);
  document.getElementById("kRej").textContent=WM.short(rt);

  var box=document.getElementById("chart");
  if(!at&&!rt){box.innerHTML='<div class="empty"><b>Belum ada keputusan bulan ini</b><p>Setujui atau tolak permintaan untuk melihat ringkasannya.</p></div>';}
  else{box.innerHTML="";WM.chart.bars(box,{labels:["Disetujui","Ditolak"],series:[{d:[at,rt],c:"var(--lime)"}],fmt:WM.rp,wide:true});}

  var wrap=document.getElementById("reqList");
  wrap.innerHTML=p.length?p.slice(0,5).map(function(r){var m=WM.member(r.member);
    return '<li>'+WM.avatar(m,36)+'<div><b>'+WM.esc(m.short)+'</b><small>'+WM.esc(r.reason||"Dana keluarga")+'</small></div><span class="amt num">'+WM.short(r.amount)+'</span></li>';
  }).join(""):'<li style="border:0"><small>Tidak ada permintaan menunggu.</small></li>';
}

function pendingCard(r){
  var m=WM.member(r.member),acc=WM.account(r.acc);
  return '<div class="pq-card" data-id="'+r.id+'"><div class="pq-top">'+WM.avatar(m,38)+
   '<div class="pq-meta"><div class="nm">'+WM.esc(m.short)+' → '+WM.esc(acc?acc.name:"–")+' <span class="pill warn">Menunggu</span></div>'+
   '<div class="sub">Diminta '+WM.date(r.date,true)+'</div></div>'+
   '<div class="pq-amt"><b class="num">'+WM.rp(r.amount)+'</b></div></div>'+
   '<div class="pq-box"><span class="lbl">Keperluan</span> '+WM.esc(r.reason||"—")+'</div>'+
   '<div class="pq-acts" data-default><button class="btn primary sm" type="button" data-approve>'+WM.icon("checkc",15)+' Setujui</button>'+
   '<button class="btn sm" type="button" data-reject>'+WM.icon("x",15)+' Tolak</button></div>'+
   '<div class="pq-inl" data-approve-form hidden></div>'+
   '<div class="pq-inl" data-reject-form hidden></div></div>';
}

function drawPending(){
  var list=pending(),wrap=document.getElementById("panelPending");
  wrap.innerHTML=list.length?list.map(pendingCard).join(""):'<div class="empty"><span class="ic">'+WM.icon("checkc",24)+'</span><b>Tidak ada permintaan menunggu</b><p>Semua permintaan dana sudah diputuskan.</p></div>';
}

function drawRiwayat(){
  var list=history(),wrap=document.getElementById("panelRiwayat");
  if(!list.length){wrap.innerHTML='<div class="empty"><span class="ic">'+WM.icon("clock",24)+'</span><b>Belum ada riwayat keputusan</b><p>Riwayat persetujuan dan penolakan akan tampil di sini.</p></div>';return;}
  wrap.innerHTML='<div class="tw"><table class="pq-tbl"><thead><tr><th>Pemohon</th><th>Keperluan</th><th>Rekening</th><th>Status</th><th>Diputuskan oleh</th><th>Tanggal</th><th style="text-align:right">Jumlah</th></tr></thead><tbody>'+
   list.map(function(r){var m=WM.member(r.member),acc=WM.account(r.acc),by=r.decidedBy?WM.member(r.decidedBy):null;
     return '<tr><td style="font-weight:600">'+WM.esc(m.short)+'</td><td>'+WM.esc(r.reason||"—")+'</td><td>'+WM.esc(acc?acc.name:"–")+'</td>'+
      '<td><span class="pill'+(r.status==="approved"?" good":" bad")+'">'+(r.status==="approved"?"Disetujui":"Ditolak")+'</span></td>'+
      '<td>'+(by?WM.esc(by.short):"—")+'</td><td class="cap">'+(r.decidedAt?WM.date(r.decidedAt):"—")+'</td>'+
      '<td class="num" style="text-align:right;font-weight:600">'+WM.rp(r.amount)+'</td></tr>';}).join("")+'</tbody></table></div>';
}

function drawTips(){
  var p=pending(),oldest=p.slice().sort(function(a,b){return a.date<b.date?-1:1;})[0];
  var t=document.getElementById("tipT"),p2=document.getElementById("tipP");
  if(!p.length){t.textContent="Tidak ada yang menunggu";p2.textContent="Semua permintaan dana sudah kamu putuskan.";}
  else{var m=WM.member(oldest.member);t.textContent=p.length+" permintaan menunggu";p2.textContent="Permintaan "+m.short+" sudah menunggu sejak "+WM.date(oldest.date,true)+".";}
  var n=Math.min(18,p.length*3);document.getElementById("mosaic").innerHTML=Array.apply(null,{length:18}).map(function(_,i){return '<i class="'+(i<n?"a":i%5===0?"b":"")+'"></i>';}).join("");
}

function draw(){drawHero();drawPending();drawRiwayat();drawTips();}
draw();
WM.onChange(["requests","accounts","tx"],draw);

function selectTab(name){
  tab=name;document.querySelectorAll('[data-tab]').forEach(function(x){x.setAttribute("aria-pressed",x.dataset.tab===name);});
  document.getElementById("panelPending").hidden=tab!=="pending";document.getElementById("panelRiwayat").hidden=tab!=="riwayat";
}
document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener("click",function(){selectTab(b.dataset.tab);});});
document.getElementById("toRiwayat").addEventListener("click",function(){selectTab("riwayat");document.querySelector(".p-main").scrollIntoView({behavior:"smooth",block:"nearest"});});

document.getElementById("panelPending").addEventListener("click",function(e){
  var card=e.target.closest("[data-id]");if(!card)return;var id=card.dataset.id,r=WM.store.find("requests",id);
  if(e.target.closest("[data-approve]"))showApprove(card,r);
  else if(e.target.closest("[data-reject]"))showReject(card,r);
  else if(e.target.closest("[data-cancel]"))resetCard(card);
  else if(e.target.closest("[data-doapprove]"))doApprove(card,r);
  else if(e.target.closest("[data-doreject]"))doReject(card,r);
});

function resetCard(card){
  card.querySelector("[data-default]").hidden=false;
  card.querySelector("[data-approve-form]").hidden=true;card.querySelector("[data-approve-form]").innerHTML="";
  card.querySelector("[data-reject-form]").hidden=true;card.querySelector("[data-reject-form]").innerHTML="";
}

function showApprove(card,r){
  var eligible=WM.visibleAccounts().filter(function(a){return a.id!==r.acc;});
  card.querySelector("[data-default]").hidden=true;
  card.querySelector("[data-reject-form]").hidden=true;card.querySelector("[data-reject-form]").innerHTML="";
  var f=card.querySelector("[data-approve-form]");f.hidden=false;
  f.innerHTML='<select aria-label="Transfer dari rekening" data-apacc><option value="">Pilih rekening sumber…</option>'+
   eligible.map(function(a){return '<option value="'+a.id+'">'+WM.esc(a.bank+" · "+a.name)+" ("+WM.short(a.balance)+')</option>';}).join("")+'</select>'+
   '<button class="btn sm" type="button" data-cancel>Batal</button>'+
   '<button class="btn sm primary" type="button" data-doapprove>Setujui '+WM.short(r.amount)+'</button><span class="err" data-aperr></span>';
}

function showReject(card,r){
  card.querySelector("[data-default]").hidden=true;
  card.querySelector("[data-approve-form]").hidden=true;card.querySelector("[data-approve-form]").innerHTML="";
  var f=card.querySelector("[data-reject-form]");f.hidden=false;
  f.innerHTML='<textarea aria-label="Alasan penolakan" data-rjreason placeholder="Alasan penolakan (opsional)" rows="1"></textarea>'+
   '<button class="btn sm" type="button" data-cancel>Batal</button>'+
   '<button class="btn sm danger" type="button" data-doreject>Tolak permintaan</button>';
}

function doApprove(card,r){
  var sel=card.querySelector("[data-apacc]"),accId=sel.value,err=card.querySelector("[data-aperr]");
  if(!accId){err.textContent="Pilih rekening sumber terlebih dahulu.";return;}
  var acc=WM.account(accId);
  if(acc.type!=="cc"&&acc.balance<r.amount){err.textContent="Saldo "+acc.name+" tidak mencukupi.";return;}
  var m=WM.member(r.member);
  var t=WM.addTx({type:"tf",amount:r.amount,acc:accId,to:r.acc,member:r.member,date:WM.today,note:"Persetujuan: "+(r.reason||"Dana keluarga")});
  WM.store.update("requests",r.id,{status:"approved",decidedAt:WM.today,decidedBy:WM.meId(),fromAcc:accId});
  WM.toast("Permintaan "+m.short+" disetujui",{undo:function(){WM.removeTx(t.id);WM.store.update("requests",r.id,{status:"pending",decidedAt:null,decidedBy:null,fromAcc:null});}});
}

function doReject(card,r){
  var reason=card.querySelector("[data-rjreason]").value||"";
  var m=WM.member(r.member);
  WM.store.update("requests",r.id,{status:"rejected",decidedAt:WM.today,decidedBy:WM.meId(),rejectReason:reason});
  WM.toast("Permintaan "+m.short+" ditolak",{undo:function(){WM.store.update("requests",r.id,{status:"pending",decidedAt:null,decidedBy:null,rejectReason:null});}});
}
})();
</script>
