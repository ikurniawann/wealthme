<title>Undangan keluarga · WealthMe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wm.css">
<style>
body{padding:0}
.awrap{min-height:100vh;display:flex;flex-direction:column}
.acover{background:var(--cover);color:var(--on-cover);padding:22px 20px;position:relative;overflow:hidden;flex:none}
.acover::before{content:"";position:absolute;inset:auto -70px -140px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(169,216,76,.18),transparent);pointer-events:none}
.acover>*{position:relative}
.abrand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em;text-decoration:none;color:inherit}
.abrand .mark{width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:var(--lime-ink);flex:none}
.ahl{margin:20px 0 0;font-size:20px;line-height:1.2;letter-spacing:-.03em;font-weight:600;max-width:30ch}
.ahl em{font-style:normal;color:var(--lime)}
.afeat{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.afeat li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--on-cover-2)}
.afeat svg{flex:none;color:var(--lime);margin-top:1px}
.anote{margin-top:auto;padding-top:18px;font-size:11px;color:var(--on-cover-2);border-top:1px solid var(--cover-line)}
.aform{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 40px}
.acard{width:100%;max-width:400px}
.aback{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:12px}
.aback:hover{color:var(--ink)}
.atitle{margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.02em;text-align:center}
.asub{margin:4px 0 18px;color:var(--muted);font-size:13px;text-align:center}
.aseg{display:flex;gap:2px;background:var(--card-2);border-radius:12px;padding:3px;margin-bottom:16px}
.aseg button{flex:1;border:0;background:transparent;border-radius:9px;padding:0 10px;min-height:38px;font-weight:600;font-size:13px;color:var(--muted)}
.aseg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.demo{display:flex;gap:10px;align-items:flex-start;background:var(--lime-soft);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;color:var(--good)}
.demo svg{flex:none;margin-top:1px}
.demo b{display:block;color:var(--ink)}
.demo code{background:rgba(0,0,0,.08);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:12px;color:var(--ink)}
.quick{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.qm{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-width:76px;font-size:11px;color:var(--muted)}
.qm:hover{border-color:var(--lime);background:var(--lime-soft)}
.qm b{color:var(--ink);font-size:12px;font-weight:600}
.pwrap{position:relative}
.pwrap input{padding-right:42px!important}
.peye{position:absolute;right:6px;top:29px;width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.peye:hover{background:var(--card-2);color:var(--ink)}
.pwmeter{display:flex;gap:5px;margin-top:8px}
.pwmeter i{flex:1;height:5px;border-radius:99px;background:var(--ghost);display:block}
.pwmeter i.on1{background:var(--bad)}.pwmeter i.on2{background:var(--orange)}.pwmeter i.on3{background:var(--good)}
.pwmsg{margin-top:5px;font-size:12px;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.rule{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.rule.ok{color:var(--good)}
.rule i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.rule.ok i{background:var(--good);border-color:var(--good);color:#fff}
.afoot{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
.afoot a,.alink{color:var(--good);font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:0;font-size:inherit;cursor:pointer}
.legallinks{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legallinks a{color:inherit;text-decoration:none}
.legallinks a:hover{color:var(--ink);text-decoration:underline}
.divide{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}
.divide::before,.divide::after{content:"";flex:1;height:1px;background:var(--line)}
.oktick{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--lime-soft);color:var(--good);margin:0 auto 14px}
.badtick{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--orange) 20%,transparent);color:color-mix(in srgb,var(--orange) 55%,var(--ink));margin:0 auto 14px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--orange) 14%,var(--card));border-radius:12px;padding:12px 14px;font-size:13px;color:color-mix(in srgb,var(--orange) 65%,var(--ink));margin-bottom:14px}
.warnbox svg{flex:none;margin-top:1px}
.identity{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 12px;background:var(--card-2);border-radius:12px}
.center{text-align:center}
.emoji64{width:56px;height:56px;border-radius:50%;background:var(--lime-soft);display:grid;place-items:center;font-size:28px;margin:0 auto 14px}
@media(min-width:960px){
 .awrap{flex-direction:row;min-height:100vh}
 .acover{width:42%;min-width:380px;display:flex;flex-direction:column;padding:44px 40px;justify-content:flex-start}
 .ahl{margin-top:30px;font-size:28px}
 .aform{width:58%;align-items:center}
}
</style>
<main data-page="join">
<div class="awrap"><div class="aform" style="width:100%"><div class="acard" style="max-width:440px">
    <div class="abrand center" style="justify-content:center;display:flex"><span class="mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l4.5 12L12 8l4.5 10L21 6"/></svg></span>WealthMe</div>
    <div class="card enter center" style="margin-top:18px">
      <div class="emoji64" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2.2 1-4 3-4s3 1.8 3 4"/></svg></div>
      <div id="loadView"><p class="asub">Memuat undangan…</p></div>
      <div id="errView" hidden>
        <h1 class="atitle">Undangan tidak valid</h1>
        <p class="asub" id="errMsg">Link undangan kedaluwarsa, sudah dipakai, atau tidak ditemukan.</p>
      </div>
      <div id="invView" hidden>
        <h1 class="atitle" style="font-size:16px">Undangan bergabung ke<br>"<span id="famName"></span>"</h1>
        <p class="asub">Untuk <span id="invEmail"></span> · peran <span id="invRole"></span></p>
        <div id="loggedInRow"><button class="btn primary block" type="button" id="acceptBtn"><span id="acceptLbl">Terima undangan</span></button></div>
        <div id="loggedOutRow" hidden>
          <p class="asub">Masuk atau daftar dulu, lalu buka link ini kembali.</p>
          <div class="two" style="margin-top:8px"><a class="btn primary block" href="login.html">Masuk</a><a class="btn block" href="register.html">Daftar</a></div>
        </div>
      </div>
      <div id="doneView" hidden>
        <h1 class="atitle" style="color:var(--good)">Berhasil bergabung!</h1>
        <p class="asub">Mengalihkan ke halaman masuk…</p>
      </div>
    </div>
  </div></div></div>
</main>
<script src="wm.js"></script>
<script>
(function(){
  var token = new URLSearchParams(location.search).get("token") || "";
  function show(id){["loadView","errView","invView","doneView"].forEach(function(x){document.getElementById(x).hidden = x!==id;});}
  var loggedIn = !!localStorage.getItem("wm-proto-v1:me");
  setTimeout(function(){
    if(!token){show("errView");return;}
    var roles=["master","spouse","child","staff"], roleLabels={master:"Master",spouse:"Co-Master",child:"Anak",staff:"Operasional"};
    var role = roles[token.length % roles.length];
    document.getElementById("famName").textContent = "Keluarga Rizaldi";
    document.getElementById("invEmail").textContent = "anggota.baru@email.com";
    document.getElementById("invRole").textContent = roleLabels[role];
    document.getElementById("loggedInRow").hidden = !loggedIn;
    document.getElementById("loggedOutRow").hidden = loggedIn;
    show("invView");
  }, 500);
  document.getElementById("acceptBtn").addEventListener("click",function(){
    document.getElementById("acceptLbl").textContent="Memproses…";
    setTimeout(function(){
      WM.toast("Undangan diterima! Silakan masuk kembali.");
      show("doneView");
      setTimeout(function(){location.href="login.html";},1200);
    },500);
  });
})();
</script>
