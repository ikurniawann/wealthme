<title>WealthMe Laporan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEDE8; --card:#FFFFFF; --card-2:#F4F5F1; --ink:#15170F; --muted:#666D5F; --line:#E2E4DC;
  --lime:#9CCB3B; --lime-ink:#1F2A07; --lime-soft:#E4F1C4; --yellow:#EFDC4E; --orange:#F2A247;
  --good:#3F8F2F; --bad:#C2462B; --ghost:#E6E8E1;
  --radius:18px; --shadow:0 1px 2px rgba(30,40,10,.04),0 6px 18px -8px rgba(30,40,10,.10);
  --font:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E100B; --card:#171A13; --card-2:#1E2219; --ink:#EEF0E8; --muted:#9BA290; --line:#2A2F23;
  --lime:#A9D84C; --lime-ink:#172005; --lime-soft:#2B3A12; --yellow:#E6D34A; --orange:#E9973D;
  --good:#8BD06B; --bad:#F08A6E; --ghost:#262B20; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E100B; --card:#171A13; --card-2:#1E2219; --ink:#EEF0E8; --muted:#9BA290; --line:#2A2F23;
  --lime:#A9D84C; --lime-ink:#172005; --lime-soft:#2B3A12; --yellow:#E6D34A; --orange:#E9973D;
  --good:#8BD06B; --bad:#F08A6E; --ghost:#262B20; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding:16px;}
::selection{background:var(--lime);color:var(--lime-ink)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;min-height:calc(100vh - 32px);align-items:start;max-width:2240px;margin-inline:auto}
.main{width:100%;min-width:0}

/* sidebar */
.side{background:var(--card);border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:sticky;top:16px;height:calc(100vh - 32px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:var(--lime-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500;min-height:42px}
.nav a:hover{background:var(--card-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--card-2);color:var(--ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.sub{display:flex;flex-direction:column;margin:2px 0 4px 29px;border-left:1px solid var(--line);padding-left:12px}
.sub a{min-height:34px;padding:6px 8px;font-size:13px}
.badge{margin-left:auto;background:var(--ink);color:var(--card);font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px}
.sep{height:1px;background:var(--line);margin:10px 8px}
.promo{margin-top:auto;background:var(--card-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.promo h3{margin:0;font-size:15px;letter-spacing:-.01em}
.promo p{margin:0;color:var(--muted);font-size:12.5px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--ghost)}
.steps i.on{background:var(--lime)}
.btn-dark{background:var(--ink);color:var(--card);border:0;border-radius:11px;padding:10px 12px;font-weight:600;font-size:13px;min-height:40px}

/* main */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;gap:10px}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:13px;padding:0 14px;height:44px;color:var(--muted);box-shadow:var(--shadow)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);width:100%}
.search input::placeholder{color:var(--muted)}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--card);border:0;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.icon-btn .dot{position:absolute;top:11px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--orange);outline:2px solid var(--card)}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:13px;padding:0 14px 0 6px;height:44px;box-shadow:var(--shadow)}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.me b{font-size:13px;line-height:1.2;display:block}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--lime);color:var(--lime-ink);border:0;border-radius:13px;height:44px;padding:0 16px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.btn-primary:hover{filter:brightness(.97)}
.chip-demo{font-size:11px;color:var(--muted);background:var(--card);border-radius:99px;padding:4px 10px;box-shadow:var(--shadow)}

.mbrand{display:none;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.02em;margin-right:auto}
.mbrand .brand-mark{width:28px;height:28px}
.mnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--card);border-radius:20px;padding:6px;box-shadow:0 12px 30px -10px rgba(20,30,5,.35)}
.mnav a,.mnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-decoration:none;border:0;background:none;min-height:48px;justify-content:center}
.mnav a[aria-current="page"]{color:var(--ink);font-weight:600}
.mnav .fab{width:48px;height:48px;border-radius:16px;background:var(--lime);color:var(--lime-ink);margin:0 auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.card .cap{color:var(--muted);font-size:12px;margin-top:2px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.seg{display:flex;background:var(--card-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);min-height:30px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.ghost-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:500;min-height:34px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.span-8{grid-column:span 8}.span-9{grid-column:span 9}

/* hero chart */
.hero{display:grid;grid-template-columns:1fr 200px;gap:0;padding:0;overflow:hidden}
.hero .chart-side{padding:20px 20px 12px;display:flex;flex-direction:column;min-height:0}
.big{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:0}
.big .cur{font-size:.55em;color:var(--muted);font-weight:500;margin-right:4px;letter-spacing:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpis{border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.kpi small{color:var(--muted);font-size:12px}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-.025em;margin-top:2px;white-space:nowrap}
.delta{font-size:11.5px;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.delta em{font-style:normal;color:var(--muted)}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.hero-ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.hero-ctrl .legend{flex-wrap:nowrap;gap:12px;white-space:nowrap}
.ctrl-row{display:flex;gap:6px}
.sel{appearance:none;border:1px solid var(--line);background:var(--card) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%2710%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23737A6C%27 stroke-width=%273%27%3E%3Cpath d=%27M6 9l6 6 6-6%27/%3E%3C/svg%3E") no-repeat right 9px center;border-radius:10px;padding:0 26px 0 11px;height:34px;font:inherit;font-size:12.5px;color:var(--ink)}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.ibtn[aria-pressed="true"]{background:var(--card-2);color:var(--ink);border-color:transparent}
.tip{position:absolute;pointer-events:none;background:var(--card);border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25);padding:10px 12px;font-size:12px;min-width:170px}
.tip b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.chart-wrap{position:relative;margin-top:10px;flex:1;min-height:230px}
.chart-wrap svg{position:absolute;inset:0;width:100%;height:100%}

/* wallet */
.wallet .cards{display:flex;margin-top:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.wallet .cards::-webkit-scrollbar{display:none}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:none;border:0;padding:0}
.act span{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);background:var(--card)}
.act:hover span{background:var(--card-2)}
.fam{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.fam div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.fam .avatar{width:40px;height:40px;border-radius:12px;font-size:13px}
.fam .me-mark{outline:2px solid var(--lime);outline-offset:2px}

/* limit + tips */
.bar{height:22px;border-radius:7px;background:var(--ghost);overflow:hidden;margin-top:16px;display:flex}
.fill-lime{background:var(--lime);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 2px,transparent 2px 8px)}
.bar-legend{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.tips{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}
.tips p{margin:6px 0 10px;color:var(--muted);font-size:13px;max-width:52ch}
.more{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13px;text-decoration:none}
.mosaic{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;justify-self:end}
.mosaic i{width:20px;height:20px;border-radius:4px;background:var(--ghost)}
.mosaic i.a{background:var(--lime)}.mosaic i.b{background:var(--lime-soft)}.mosaic i.c{background:var(--yellow);opacity:.7}

/* spending */
.seg-bar{display:flex;gap:3px;margin-top:14px;height:26px}
.seg-bar i{border-radius:6px}
.cat{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:9px}
.cat li{display:flex;align-items:center;gap:10px;font-size:13px}
.cat li i{width:10px;height:10px;border-radius:3px;flex:none}
.cat li .p{margin-left:auto;color:var(--muted)}
.mid{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:12px 0 0}

/* gauge */
.gauge{display:grid;place-items:center;margin-top:8px;position:relative}
.gauge .center{position:absolute;bottom:14px;text-align:center}
.gauge .center b{font-size:26px;letter-spacing:-.03em;display:block}
.gauge .center small{color:var(--muted);font-size:11.5px}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}
.col{display:flex;flex-direction:column}
.push{margin-top:auto}
.cat li .p{margin-left:0;min-width:34px;text-align:right}

/* goals */
.goal{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .ico{width:40px;height:40px;border-radius:12px;background:var(--card-2);display:grid;place-items:center}
.goal .t{display:flex;justify-content:space-between;font-size:13px;font-weight:500;gap:8px}
.goal .t .num{color:var(--muted);font-weight:400;font-size:12px}
.goal .track{height:8px;border-radius:4px;background:var(--ghost);margin:6px 0 4px;overflow:hidden}
.goal .track i{display:block;height:100%;border-radius:4px}
.goal small{color:var(--muted);font-size:11.5px}
.group-label{font-size:11.5px;color:var(--muted);margin:12px 0 2px;letter-spacing:.02em}

/* history */
.tx{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.tx li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.see-all{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;min-height:44px;border-radius:12px;background:var(--card-2);font-weight:600;font-size:13px;text-decoration:none}
.see-all:hover{background:var(--ghost)}
.see-all.push{margin-top:auto}
.tx{margin-bottom:10px}
.tx li:first-child{border-top:0}
.tx .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700}
.tx b{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--muted);font-size:11.5px}
.tx .amt{text-align:right;font-size:13px}
.tx .amt small{display:block}
.in{color:var(--good)}.out{color:var(--ink)}
.status-pending{color:var(--orange)}


@media (min-width:1181px){
  .grid{grid-template-columns:repeat(12,minmax(0,1fr));align-items:stretch}
  .a-hero{grid-column:1/10;grid-row:1}
  .a-wallet{grid-column:10/13;grid-row:1}
  .a-limit{grid-column:1/5;grid-row:2}
  .a-tips{grid-column:5/10;grid-row:2}
  .a-spend{grid-column:1/4;grid-row:3}
  .a-health{grid-column:4/7;grid-row:3}
  .a-goals{grid-column:7/10;grid-row:3}
  .a-hist{grid-column:10/13;grid-row:2/4}
  .a-wallet .actions{gap:4px}
  .a-wallet .pcard{width:88%;padding:12px 14px}
  .a-wallet .pcard .no{font-size:12px}
  .a-wallet .fam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;flex-wrap:nowrap}
  .a-wallet .fam .avatar{width:36px;height:36px}
  .a-wallet .fam div{min-width:0;font-size:11px}
}
@media (max-width:1180px){
  .grid>.card{grid-column:1/-1;grid-row:auto}
  .hero{grid-template-columns:1fr}
  .kpis{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .kpi .v{font-size:18px}
  .hero .head{flex-wrap:wrap;row-gap:12px}
  .hero-ctrl{align-items:flex-start}
  .search{min-width:180px}
  .tips{grid-template-columns:1fr}.mosaic{display:none}
  .me div,.chip-demo{display:none}
  .me{padding:0 6px}
  .btn-primary{white-space:nowrap}
}
@media (max-width:1180px) and (min-width:721px){
  .grid>.a-wallet{grid-column:1/7;grid-row:2/4}
  .grid>.a-limit{grid-column:7/13;grid-row:2}
  .grid>.a-tips{grid-column:7/13;grid-row:3;align-content:start}
  .grid>.a-spend{grid-column:1/7;grid-row:4}
  .grid>.a-health{grid-column:7/13;grid-row:4}
  .grid>.a-goals{grid-column:1/7;grid-row:5}
  .grid>.a-hist{grid-column:7/13;grid-row:5}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mbrand{display:flex}
}
@media (max-width:720px){
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .top{flex-wrap:wrap}
  .search{flex:1 1 100%;order:9;min-width:0}
  .me div,.chip-demo,.top .icon-btn:nth-of-type(2),.top .btn-primary{display:none}
  .me{padding:0 6px}
  .kpis{grid-template-columns:1fr;gap:14px}
  .kpi .v{font-size:20px}
  .big{font-size:32px}
  .hero-ctrl .legend{white-space:normal;flex-wrap:wrap}
  .chart-wrap{min-height:210px}
  .tip.pinned{display:none}
  .mnav{display:grid}
}
@media (prefers-reduced-motion:no-preference){
  .grow{transform-origin:bottom;animation:grow .5s cubic-bezier(.16,1,.3,1) both}
  @keyframes grow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
}

/* add-transaction dialog */
dialog.sheet{border:0;padding:0;border-radius:22px;background:var(--card);color:var(--ink);width:min(580px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:0 30px 80px -20px rgba(20,30,5,.35)}
dialog.sheet::backdrop{background:rgba(14,18,8,.66);backdrop-filter:blur(8px) saturate(.8);-webkit-backdrop-filter:blur(8px) saturate(.8)}
.sheet form{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
.sheet-head h2{margin:0;font-size:17px;letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:11px;border:0;background:var(--card-2);display:grid;place-items:center}
.sheet-body{padding:4px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.seg.full{width:100%}.seg.full button{flex:1;min-height:38px;font-size:13px}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 0 8px}
.amount:focus-within{border-color:var(--lime)}
.amount span{font-size:20px;color:var(--muted);font-weight:500}
.amount input{border:0;outline:0;background:transparent;font:600 38px/1.1 var(--font);letter-spacing:-.035em;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.amount input::placeholder{color:var(--ghost)}
.flabel{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.acc-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x proximity}
.acc-row::-webkit-scrollbar{display:none}
.hscroll{position:relative}
.hscroll .acc-row,.hscroll .cards{cursor:grab}
.hscroll.dragging .acc-row,.hscroll.dragging .cards{cursor:grabbing;scroll-snap-type:none;user-select:none}
.hs-btn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(0,0,0,.2);z-index:2}
.hs-btn.l{left:-6px}.hs-btn.r{right:-6px}
.hs-btn[hidden]{display:none}
.hscroll::before,.hscroll::after{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none;z-index:1;opacity:0;transition:opacity .15s}
.hscroll::before{left:0;background:linear-gradient(90deg,var(--card),transparent)}
.hscroll::after{right:0;background:linear-gradient(270deg,var(--card),transparent)}
.hscroll.more-l::before,.hscroll.more-r::after{opacity:1}
@media (pointer:coarse){.hs-btn{display:none}}
