<!-- @dsCard group="Type" viewport="700x180" name="Typefaces" subtitle="Sora for UI & display, DM Mono for money, IDs & shortcuts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--card); color: var(--foreground); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .label { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 8px; }
  .big { font-family: var(--font-sans); font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .bigm { font-family: var(--font-mono); font-size: 34px; font-weight: 500; line-height: 1; }
  .meta { font-family: var(--font-sans); font-size: 11px; color: var(--muted-foreground); margin-top: 10px; }
  .metam { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="label">Sora · Display & UI</div>
      <div class="big">Aa Bg 0123</div>
      <div class="meta">300 · 400 · 500 · 600 · 700 · 800</div>
    </div>
    <div>
      <div class="label">DM Mono · Numerals</div>
      <div class="bigm">Rp 1.256.780</div>
      <div class="metam">400 · 500 · tabular-nums</div>
    </div>
  </div>
</body>
</html>
