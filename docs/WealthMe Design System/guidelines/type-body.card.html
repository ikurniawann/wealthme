<!-- @dsCard group="Type" viewport="700x250" name="Body & Labels" subtitle="Dense UI text — body, nav, meta, and uppercase section labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--card); color: var(--foreground); font-family: var(--font-sans); }
  .line { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; }
  .spec { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); width: 120px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="line"><span class="spec">base · 13 · 600</span><span style="font-size:13px;font-weight:600">Tabungan Pendidikan Anak</span></div>
  <div class="line"><span class="spec">sm · 12.5 · 500</span><span style="font-size:12.5px;font-weight:500">Kelola transaksi, investasi & aset</span></div>
  <div class="line"><span class="spec">xs · 11 · 400</span><span style="font-size:11px;color:var(--muted-foreground)">Terakhir diperbarui 2 jam lalu</span></div>
  <div class="line"><span class="spec">2xs · 10.5 · 700</span><span style="font-size:10.5px;font-weight:700;color:var(--success)">▲ 4,2%</span></div>
  <div class="line"><span class="spec">label · 10 · 700</span><span style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)">Keuangan</span></div>
</body>
</html>
