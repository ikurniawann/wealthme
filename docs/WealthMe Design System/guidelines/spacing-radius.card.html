<!-- @dsCard group="Spacing" viewport="700x150" name="Radius Scale" subtitle="Base 14px — cards, pills at 999px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--card); }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 72px; height: 56px; background: var(--primary-soft); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .name { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--foreground); }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="name">sm</span><span class="val">10px</span></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-md)"></div><span class="name">md</span><span class="val">12px</span></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="name">lg</span><span class="val">14px</span></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="name">xl</span><span class="val">18px</span></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="name">pill</span><span class="val">999px</span></div>
  </div>
</body>
</html>
