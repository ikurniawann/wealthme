<!-- @dsCard group="Colors" viewport="700x150" name="Brand Extensions" subtitle="Purple, cyan, orange — accents for New tags, categories & icons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--card); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 104px; height: 56px; border-radius: var(--radius-md); box-shadow: var(--ring-card); }
  .soft { height: 22px; border-radius: var(--radius-sm); margin-top:2px; box-shadow: var(--ring-card); }
  .name { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--foreground); }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--brand-purple)"></div><div class="soft" style="background:var(--brand-purple-soft)"></div><span class="name">brand-purple</span><span class="hex">#8B5CF6</span></div>
    <div class="sw"><div class="chip" style="background:var(--brand-cyan)"></div><span class="name">brand-cyan</span><span class="hex">#06B6D4</span></div>
    <div class="sw"><div class="chip" style="background:var(--brand-orange)"></div><span class="name">brand-orange</span><span class="hex">#F97316</span></div>
  </div>
</body>
</html>
