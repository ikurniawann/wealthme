<!-- @dsCard group="Colors" viewport="700x150" name="Theme Presets" subtitle="Swap --primary via data-theme — neutrals retint automatically" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--card); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .chip { width: 56px; height: 56px; border-radius: 999px; box-shadow: var(--ring-card); }
  .name { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#4f46e5"></div><span class="name">indigo</span></div>
    <div class="sw"><div class="chip" style="background:#059669"></div><span class="name">emerald</span></div>
    <div class="sw"><div class="chip" style="background:#e11d48"></div><span class="name">rose</span></div>
    <div class="sw"><div class="chip" style="background:#d97706"></div><span class="name">amber</span></div>
    <div class="sw"><div class="chip" style="background:#7c3aed"></div><span class="name">violet</span></div>
    <div class="sw"><div class="chip" style="background:#475569"></div><span class="name">slate</span></div>
  </div>
</body>
</html>
