<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Neutrals" subtitle="Slate neutrals, subtly tinted toward the active brand color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--card); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 96px; height: 64px; border-radius: var(--radius-md); box-shadow: var(--ring-card); }
  .name { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--foreground); }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--background)"></div><span class="name">background</span><span class="hex">#F8F9FC</span></div>
    <div class="sw"><div class="chip" style="background:var(--card)"></div><span class="name">card</span><span class="hex">#FFFFFF</span></div>
    <div class="sw"><div class="chip" style="background:var(--secondary)"></div><span class="name">secondary</span><span class="hex">#F1F5F9</span></div>
    <div class="sw"><div class="chip" style="background:var(--muted)"></div><span class="name">muted</span><span class="hex">#F1F5F9</span></div>
    <div class="sw"><div class="chip" style="background:var(--foreground)"></div><span class="name">foreground</span><span class="hex">#0F172A</span></div>
    <div class="sw"><div class="chip" style="background:var(--muted-foreground)"></div><span class="name">muted-fg</span><span class="hex">#64748B</span></div>
    <div class="sw"><div class="chip" style="background:var(--border)"></div><span class="name">border</span><span class="hex">#E2E8F0</span></div>
  </div>
</body>
</html>
