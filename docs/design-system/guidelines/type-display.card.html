<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="../styles.css" />

  .line { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; }
  .spec { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); width: 110px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="line"><span class="spec">2xl · 28 · 800</span><span style="font-size:28px;font-weight:800;letter-spacing:-.02em">Rp 2.847.500.000</span></div>
  <div class="line"><span class="spec">xl · 21 · 800</span><span style="font-size:21px;font-weight:800">Selamat pagi, Andra 👋</span></div>
  <div class="line"><span class="spec">lg · 18 · 800</span><span style="font-size:18px;font-weight:800">Aset Saya</span></div>
  <div class="line"><span class="spec">md · 15 · 800</span><span style="font-size:15px;font-weight:800">Rp 25,85 jt</span></div>

</html>
