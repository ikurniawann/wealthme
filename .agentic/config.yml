# .agentic/config.yml — per-project Agentic Workflow Kit manifest
# ---------------------------------------------------------------------------
# Single source of truth for everything that used to be hardcoded in scripts,
# hooks, agents, and commands. Generic kit tooling READS this file (with
# auto-detect fallbacks) so the same scripts work in every repo.
#
# This file is GIT-TRACKED. Machine-specific overrides go in
# `.agentic/config.local.yml` (gitignored) and are deep-merged on top.
#
# Generated by /agentic-init (maintenance) on 2026-07-18; review and commit.
# Any field left blank falls back to auto-detection at runtime.
# ---------------------------------------------------------------------------

project:
  name: wealthme # short slug; used as the memory namespace root
  repo: andrsrjld/wealthme-web # owner/name — from `git remote get-url origin`
  type: monorepo # single-app | monorepo

package_manager: pnpm # from package.json packageManager (pnpm@9.15.0)

monorepo:
  tool: turbo # turbo.json present
  workspaces: [apps/*, packages/*] # from pnpm-workspace.yaml

# Branch model — remote HEAD is `development`
branches:
  integration: development # PRs target this
  primary: "" # "" = auto

# Local DEV deploy (never production). Used by the deploy gate + smoke test.
deploy:
  dev_command: scripts/deploy-dev.sh
  health_url: http://localhost:4000/health
  smoke_user: "" # seeded demo login; "" skips smoke E2E login

# Foundation files agents must NOT modify without an explicit reviewed task.
# Mirrors WM_CONVENTIONS.md "Global Guardrails".
protected_paths:
  - apps/web/src/app/globals.css
  - apps/web/src/lib/*
  - apps/web/src/components/ui/*
  - apps/web/src/components/wm/*
  - apps/web/src/components/charts/*
  - apps/web/src/components/shell/*
  - apps/web/src/app/layout.tsx

# Project conventions surfaced to code/review agents.
conventions:
  page_pattern: "apps/web/src/app/(app)/[page-id]/page.tsx"
  shared_types: "@wealthme/contracts"
  notes: 'Pages start with "use client"; render inner content only — the route group provides shell/padding/nav. Reuse @/components/wm, @/components/charts, @/lib/format, @/lib/data.'

# Multi-tenant scoping — every list/query must filter by these fields.
tenant:
  scope_fields: [userId, familyGroupId]

# Guardrail hook config.
guardrail:
  override_env: AGENTIC_OVERRIDE

# Gate scripts (relative to repo root).
gates:
  qa: scripts/qa.sh # formatting, bugs, unsafe patterns
  test: scripts/test.sh # lint + TypeScript + build
  security: scripts/security-check.sh # secrets, auth risks, destructive commands

# Loop engineering control plane. Disabled by default: enabling a loop never
# grants permission to push, open PRs, deploy, or mutate third-party systems.
# L1 is report-only; L2 may prepare a patch in an isolated worktree but always
# stops at the human gate. L3 unattended mutation is intentionally unsupported.
loop:
  enabled: false # opt in only after `bash scripts/loop-readiness.sh`
  pattern: daily-triage # daily-triage | issue-triage | ci-sweeper | dependency-sweeper | changelog-drafter | post-merge-cleanup | pr-babysitter
  level: L1 # L1 report-only | L2 assisted
  mode: report-only # report-only (L1) | assisted (L2)
  cadence: manual # document the host scheduler; this kit does not schedule by itself
  state_file: docs/LOOP-STATE.md # human-readable current queue and overrides
  run_log: docs/LOOP-RUN-LOG.md # append-only, durable run observability
  ledger: .agentic/loop-ledger.tsv # local counters for mechanical cap enforcement
  constraints_file: .agentic/loop-constraints.md
  kill_switch: .agentic/loop.pause # local file; creating it stops the next run
  max_attempts_per_item: 3
  max_runs_per_day: 1
  token_budget_per_day: 100000
  max_subagents_per_run: 0
  worktree_required: true # mandatory before an L2 patch attempt
  verifier_required: true # maker and checker must be separate at L2
  human_gate: required # required before every remote or irreversible action

# Self-learning memory.
memory:
  enabled: true
  namespace: wealthme # memory keys are wealthme[:<branch>][:<epic>]
  warm_start: true
  top_k: 8

# Docs source-of-truth locations (standard set).
docs:
  root: docs
  prd: docs/product/PRD.md
  stories: docs/product/USER-STORIES.md
  acceptance: docs/product/ACCEPTANCE-CRITERIA.md
  tasks: docs/product/ENGINEERING-TASKS.md
  backlog: docs/BACKLOG.md
  epics: docs/epics
  definition_of_done: docs/DEFINITION-OF-DONE.md
